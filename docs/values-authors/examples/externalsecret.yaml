# A Secret pulled from an external store by the External Secrets Operator, read
# by a workload and by its migration hook. Reference it by its externalSecrets
# key, never by the Secret name it produces: a pre-* hook then reads a copy that
# exists before the hook runs.
externalSecrets:
  api-env:
    secretstore:
      kind: ClusterSecretStore
      name: vault
    refreshInterval: 1h
    data:
      - secretkey: DB_PASSWORD
        remote: { key: apps/api, property: db_password }
      - secretkey: API_TOKEN
        remote: { key: apps/api, property: api_token }

workloads:
  api:
    image:
      repository: ghcr.io/example/api
      tag: "2.0.1"
    service:
      targetPort: 3000
    externalSecrets:
      - name: api-env                 # envFrom source; with mountPath, a read-only volume
    hooks:
      pre-install:
        migrate:                      # inherits the externalSecrets list
          command: ["./bin/migrate", "up"]
          activeDeadlineSeconds: 600
      pre-upgrade:
        migrate:
          command: ["./bin/migrate", "up"]
          activeDeadlineSeconds: 600
