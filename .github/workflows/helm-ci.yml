name: Helm CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v4.3.0

      - name: Pre-pull Docker images
        run: |
          for img in \
            ghcr.io/stackrox/kube-linter:v0.7.1 \
            ghcr.io/yannh/kubeconform:v0.7.0 \
            helmunittest/helm-unittest:3.19.0-1.0.3 \
            jnorwood/helm-docs:latest; do
            for i in 1 2 3; do
              docker pull "$img" && break || sleep 5
            done
          done

      - name: Lint chart scenarios
        run: make lint-chart

      - name: Run unit tests
        run: make unit-test

      - name: Validate bad-values rejected
        run: make validate-bad-values

      - name: Generate manifests
        run: make generate-templates

      - name: Validate manifests (kubeconform)
        run: make kubeconform

      - name: Lint manifests (kube-linter)
        run: make kube-linter

      # The generated README ships inside the package, so a stale one is
      # published to Artifact Hub. Nothing else notices it drifting: helm-docs
      # reads Chart.yaml and values.yaml, and every other check here reads the
      # templates.
      - name: Verify the generated docs are current
        run: |
          make generate-docs
          if ! git diff --quiet -- 'charts/*/README.md'; then
            echo "::error::A generated README is out of date. Run 'make generate-docs' and commit the result."
            git diff -- 'charts/*/README.md'
            exit 1
          fi

      - name: Upload generated manifests
        if: ${{ success() }}
        uses: actions/upload-artifact@v7
        with:
          name: generated-manifests
          path: generated-manifests/

  # Separate job on purpose: e2e creates a kind cluster and installs KEDA, so it
  # is both slower and failing for entirely different reasons than the lint and
  # render checks above. Keeping them apart makes the cause readable at a glance.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v4.3.0

      - name: Set up kubectl
        uses: azure/setup-kubectl@v5

      # Downloads kind into .bin/, creates a throwaway cluster, installs KEDA,
      # then runs the install/upgrade/uninstall assertions.
      - name: Run e2e on kind
        run: make e2e

      # An e2e that only fails in CI is otherwise undebuggable from the log alone.
      - name: Dump cluster state on failure
        if: ${{ failure() }}
        run: |
          export KUBECONFIG="$PWD/.bin/kind-kubeconfig"
          kubectl get all,scaledobject,triggerauthentication -A || true
          kubectl -n keda logs deployment/keda-operator --tail=100 || true

  # Argo CD, not Helm, runs the hooks here (issues #149, #164): pre-install on
  # every sync, HookFailed on every hook of a failed operation. Its own job for
  # the same reason e2e is one.
  e2e-argocd:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v4.3.0

      - name: Set up kubectl
        uses: azure/setup-kubectl@v5

      - name: Run e2e-argocd on kind
        run: make e2e-argocd

      - name: Dump cluster state on failure
        if: ${{ failure() }}
        run: |
          export KUBECONFIG="$PWD/.bin/kind-kubeconfig"
          kubectl -n argocd get application e2e -o yaml || true
          kubectl -n global-chart-argocd get all,sa,cm,secret,externalsecret || true
          kubectl -n argocd logs statefulset/argocd-application-controller --tail=100 || true

  # The release runs here, not in a workflow of its own, so it cannot start
  # before the checks: `needs` is a real dependency, while two workflows on the
  # same `push` event are two parallel runs. chart-releaser used to publish
  # while the tests were still going, and published all the same when they
  # failed. It is gated on the push to main as well, so a pull request never
  # reaches it.
  release:
    needs: [lint-and-test, e2e, e2e-argocd]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Run chart-releaser
        uses: helm/chart-releaser-action@v1.7.0
        with:
          skip_existing: true
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
