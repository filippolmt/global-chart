# A null kedaTriggerAuthentications entry a trigger's authenticationRef names
# (issue #303): the schema requires a map, and under --skip-schema-validation
# the null is unset, as the entry left out, so the ref is passed through
# verbatim, as one to a TriggerAuthentication managed outside the chart. It
# used to fail as an empty entry.
workloads:
  app:
    image: nginx:1.25
    keda:
      enabled: true
      triggers:
        - type: cron
          metadata:
            timezone: UTC
            start: "0 8 * * *"
            end: "0 18 * * *"
            desiredReplicas: "3"
          authenticationRef:
            name: shared-auth
kedaTriggerAuthentications:
  shared-auth: null
