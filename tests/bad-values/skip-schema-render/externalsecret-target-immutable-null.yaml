# A null target.immutable on an ExternalSecret (issue #303): the schema
# requires a boolean, and under --skip-schema-validation the null is unset, as
# the key left out, so no immutable field renders. hasKey used to hand it on
# as `immutable: null`.
externalSecrets:
  app-env:
    remote:
      key: app/env
    secretstore:
      kind: ClusterSecretStore
      name: vault
    secretkey: token
    target:
      immutable: null
