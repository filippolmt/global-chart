# The keys of the form an ExternalSecret does not use, null (issue #304): a null
# remote and secretkey beside data, a null dataFrom beside data, a null storeRef
# beside a generatorRef. Each is unset, as the key left out; a null beside data
# used to fail as mixing the two forms.
externalSecrets:
  app:
    secretstore: { kind: ClusterSecretStore, name: store }
    remote: null
    secretkey: null
    dataFrom: null
    data:
      - secretkey: token
        remote: { key: app/token }
  gen:
    data: null
    dataFrom:
      - sourceRef:
          storeRef: null
          generatorRef: { apiVersion: generators.external-secrets.io/v1alpha1, kind: Password, name: pw }
