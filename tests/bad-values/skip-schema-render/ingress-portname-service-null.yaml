# portName beside a null service: the schema requires service to be a map, and
# under --skip-schema-validation the null is unset, so resolveBackend takes the
# workload's Service and its port named http, with no conflict.
workloads:
  app:
    image: nginx:1.25
ingress:
  enabled: true
  hosts:
    - host: app.example.com
      workload: app
      portName: http
      service: null
      paths:
        - path: /
