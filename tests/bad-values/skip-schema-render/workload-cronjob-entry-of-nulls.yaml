# A workload's cronJobs entry whose keys are all null (issue #305): the schema
# rejects the null, and under --skip-schema-validation the entry is an empty
# entry, as `nightly: {}`: no CronJob. It used to render a CronJob with an
# empty schedule, which the API server refuses.
workloads:
  app:
    image: nginx:1.25
    cronJobs:
      nightly:
        schedule: null
