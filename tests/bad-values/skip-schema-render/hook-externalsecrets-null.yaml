# A workload-scope hook's externalSecrets set to null (issue #303): the schema
# requires a list, and under --skip-schema-validation the null is unset, as
# the key left out, so the hook inherits the workload's references and reads
# their hook-prerequisite copy (ADR 0007). hasKey used to read it as `[]`:
# no envFrom, and no copy.
workloads:
  app:
    image: nginx:1.25
    externalSecrets:
      - name: app-env
    hooks:
      pre-upgrade:
        migrate:
          command: ["/bin/migrate"]
          externalSecrets: null
externalSecrets:
  app-env:
    remote:
      key: app/env
    secretstore:
      kind: ClusterSecretStore
      name: vault
    secretkey: token
