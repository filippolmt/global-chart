# A cronjob's externalSecrets set to null (issue #303): the schema requires a
# list, and under --skip-schema-validation the null is unset, as the key left
# out, so the cronjob inherits the workload's references. hasKey used to read
# it as `[]` and drop the inherited envFrom.
workloads:
  app:
    image: nginx:1.25
    externalSecrets:
      - name: app-env
    cronJobs:
      nightly:
        schedule: "0 3 * * *"
        command: ["/bin/run"]
        externalSecrets: null
externalSecrets:
  app-env:
    remote:
      key: app/env
    secretstore:
      kind: ClusterSecretStore
      name: vault
    secretkey: token
