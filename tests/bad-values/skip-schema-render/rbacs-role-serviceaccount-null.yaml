# A null serviceAccount on an rbacs.roles entry (issue #303): the schema
# requires a map, and under --skip-schema-validation the null is unset, as the
# key left out, so the role binds no ServiceAccount. hasKey used to read it as
# `serviceAccount: {}` and render a <role>-sa and its RoleBinding.
rbacs:
  roles:
    - name: reader
      serviceAccount: null
      rules:
        - apiGroups: [""]
          resources: ["pods"]
          verbs: ["get"]
