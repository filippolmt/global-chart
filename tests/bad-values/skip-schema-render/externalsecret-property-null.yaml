# A null remote.property (issue #294): the schema requires a string, and under
# --skip-schema-validation the null is unset, so the remoteRef carries no
# property, as the key left out. hasKey used to render it as property: "".
workloads: {}
externalSecrets:
  app-config:
    secretkey: app-config
    remote:
      key: "apps/prod/config"
      property: null
    secretstore:
      kind: ClusterSecretStore
      name: default-store
