# imagePullSecrets set to null on a workload and on its cronjob (issue #303):
# the schema requires a list, and under --skip-schema-validation each null is
# unset, as the key left out, so both fall back to global.imagePullSecrets.
# hasKey used to read each null as `[]` and drop the global secrets.
global:
  imagePullSecrets:
    - name: registry
workloads:
  app:
    image: nginx:1.25
    imagePullSecrets: null
    cronJobs:
      nightly:
        schedule: "0 3 * * *"
        command: ["/bin/run"]
        imagePullSecrets: null
