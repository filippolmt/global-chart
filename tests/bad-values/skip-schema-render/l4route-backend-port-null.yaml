# A null service.port on a TCPRoute backend and a null portName on a UDPRoute
# backend (issue #303): the schema rejects each, and under
# --skip-schema-validation each is unset, as the key left out, so
# resolveBackend gives the foreign Service port 80 and the workload's primary
# port, UDP here. They used to fail naming the key.
workloads:
  dns:
    image: coredns/coredns:1.11.1
    service:
      port: 53
      protocol: UDP
tcpRoutes:
  ext:
    parentRefs:
      - name: shared-gateway
    rules:
      - backendRefs:
          - service:
              name: external
              port: null
udpRoutes:
  dns:
    parentRefs:
      - name: shared-gateway
    rules:
      - backendRefs:
          - workload: dns
            portName: null
