# inheritDeploymentSecret at root scope, where it never applied: the schema
# rejects it, and under --skip-schema-validation global-chart.validateRemovedKeys
# does too, since it checks every removed job key at both scopes (issue #221).
# Expected fail substring: "hooks.pre-install.migrate.inheritDeploymentSecret: removed in 4.0.0, use inheritWorkloadSecret on a workload-scope job; a root-scope job inherits nothing"
hooks:
  pre-install:
    migrate:
      image: nginx:1.25
      command: ["./migrate.sh"]
      inheritDeploymentSecret: false
