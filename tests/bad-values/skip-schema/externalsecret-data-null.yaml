# A null data on an ExternalSecret (issue #304) is unset, as the key left out:
# the single-key form, whose remote is then missing. It used to render
# `data: null`.
# Expected fail substring: "externalSecrets.app.remote: mandatory"
externalSecrets:
  app:
    secretstore: { kind: ClusterSecretStore, name: store }
    data: null
