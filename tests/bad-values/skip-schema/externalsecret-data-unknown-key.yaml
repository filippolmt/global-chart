# covers: externalSecret/properties/data/items
# An unknown key inside an externalSecrets.<name>.data entry (typo of
# secretkey). The schema's closure rejects it first; under
# --skip-schema-validation externalsecret.yaml names the secretkey it drops.
# Expected fail substring: "externalSecrets.app.data[0].secretkey: mandatory"
externalSecrets:
  app:
    secretstore:
      kind: ClusterSecretStore
      name: my-store
    data:
      - secretKey: DB_PASSWORD
        remote:
          key: apps/prod/db
