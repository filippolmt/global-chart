# A tag made only of @<digest> (ADR 0018). The schema's tag pattern rejects it
# first; under --skip-schema-validation imageString fails rather than render
# nginx:@sha256:…, an InvalidImageName at pull time.
# Expected fail substring: "workloads.web.image.tag: "
# Expected fail substring: "has no tag before the @<digest>"
workloads:
  web:
    image:
      repository: nginx
      tag: "@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
