# A null generatorRef in a dataFrom entry's sourceRef (issue #304) is unset: the
# entry carries no sourceRef of its own, so the spec-level secretstore is
# required. It used to count as self-contained and render the sourceRef
# with no store.
# Expected fail substring: "externalSecrets.app.secretstore: mandatory unless every dataFrom entry"
externalSecrets:
  app:
    dataFrom:
      - sourceRef:
          generatorRef: null
