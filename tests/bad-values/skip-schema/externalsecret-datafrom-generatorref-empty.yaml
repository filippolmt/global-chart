# An empty generatorRef in a dataFrom entry's sourceRef (issue #309): the schema
# requires its kind and name, and the template fails naming the first missing
# one. It used to count as self-contained and render a sourceRef with no
# generator and no secretStoreRef, which ESO rejects at apply.
# Expected fail substring: "externalSecrets.app.dataFrom[0].sourceRef.generatorRef.kind: mandatory"
externalSecrets:
  app:
    dataFrom:
      - sourceRef:
          generatorRef: {}
