# A null kedaTriggerAuthentications entry a trigger's authenticationRef names
# (issue #305): the schema requires a map, and under --skip-schema-validation
# the null is an empty entry, as `shared-auth: {}`, so the ref fails as one to
# an empty entry. Issue #303 had passed it through verbatim, a ref to nothing
# in the release; 4.2.1 failed as here.
# Expected fail substring: "kedaTriggerAuthentications.shared-auth: empty, but a keda trigger's authenticationRef names it"
workloads:
  app:
    image: nginx:1.25
    keda:
      enabled: true
      triggers:
        - type: cron
          metadata:
            timezone: UTC
            start: "0 8 * * *"
            end: "0 18 * * *"
            desiredReplicas: "3"
          authenticationRef:
            name: shared-auth
kedaTriggerAuthentications:
  shared-auth: null
