# An extraContainers item whose volumeMounts is not a list (issue #235). The
# StatefulSet check reads it, so the schema declares it an array; any other
# value was rejected by the API server at apply.
# Expected fail substring: "workloads.app.extraContainers[0].volumeMounts: a number, where the chart reads a list"
workloads:
  app:
    image: nginx:1.25
    extraContainers:
      - name: sidecar
        image: busybox:1.36
        volumeMounts: 3
