# A storeRef of nulls only in a dataFrom entry's sourceRef (issue #309): a null
# name is unset, and the schema requires it. It used to render
# `storeRef: {name: null}`, which ESO rejects at apply; without secretstore it
# also counted as self-contained. A spec-level secretstore does not make up
# for it: the entry's storeRef overrides it.
# Expected fail substring: "externalSecrets.app.dataFrom[0].sourceRef.storeRef.name: mandatory"
externalSecrets:
  app:
    secretstore: { kind: ClusterSecretStore, name: store }
    dataFrom:
      - sourceRef:
          storeRef: { name: null }
