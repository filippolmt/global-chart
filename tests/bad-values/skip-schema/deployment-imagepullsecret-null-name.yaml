# An imagePullSecrets entry whose name is null. Rendered, it would be `- name:`
# with nothing after it; validateNullItems names the key instead (issue #198).
# Expected fail substring: "workloads.web.imagePullSecrets[0].name: null, a value nobody wrote"
workloads:
  web:
    image: nginx:1.25
    imagePullSecrets:
      - name: null
