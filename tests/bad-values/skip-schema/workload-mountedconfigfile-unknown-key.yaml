# covers: mountedConfigFiles/properties/files/items
# An unknown key inside a mountedConfigFiles.files entry (typo of targetPath).
# The schema's closure rejects it first; under --skip-schema-validation
# workload.yaml names the targetPath it drops.
# Expected fail substring: "workloads.web.mountedConfigFiles.files[0].targetPath: required"
workloads:
  web:
    image: nginx:1.25
    mountedConfigFiles:
      files:
        - name: app-conf
          filename: app.conf
          tagretPath: /etc/app/app.conf
          content: |
            key = value
