# A KEDA trigger's authenticationRef without a name (issue #304): the schema
# requires it, and the template fails naming it. With a cluster-scoped kind it
# rendered `name:` empty, a ref to nothing; with no kind or a namespaced one it
# died on a Go type error naming no values path.
# Expected fail substring: "workloads.web.keda.triggers[0].authenticationRef.name: mandatory"
workloads:
  web:
    image: nginx:1.25
    keda:
      enabled: true
      triggers:
        - type: cron
          metadata: { timezone: UTC, start: "0 0 * * *", end: "59 23 * * *", desiredReplicas: "3" }
          authenticationRef:
            kind: ClusterTriggerAuthentication
