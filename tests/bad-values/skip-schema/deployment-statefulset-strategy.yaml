# A Deployment field on a StatefulSet, under --skip-schema-validation: the
# backstop guard in deployment.yaml names it (ADR 0020).
# Expected fail substring: "deployments.db.strategy: a Deployment field, and this entry renders a StatefulSet. Drop it, or set kind: Deployment."
deployments:
  db:
    kind: StatefulSet
    image: nginx:1.25
    strategy:
      type: Recreate
