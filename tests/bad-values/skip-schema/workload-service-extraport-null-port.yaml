# A null extraPorts port (issue #185). The schema rejects it first; under
# --skip-schema-validation, validateNullItems keeps "<nil>" out of the
# manifest and names the key: port is a required field of the item
# (nullItemFields, issue #303). A null inside a list survives the values merge
# in Helm 3 and 4.
# Expected fail substring: "workloads.app.service.extraPorts[0].port: null"
workloads:
  app:
    image: nginx:1.25
    service:
      extraPorts:
        - name: metrics
          port: null
