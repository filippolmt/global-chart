# A null item in an externalSecrets data list. rejectNullInLists names it before
# renderExternalSecretSpec reads .remote off it (issue #198).
# Expected fail substring: "externalSecrets.app.data[0]: null, a value nobody wrote"
externalSecrets:
  app:
    secretstore: { kind: ClusterSecretStore, name: store }
    data:
      - null
