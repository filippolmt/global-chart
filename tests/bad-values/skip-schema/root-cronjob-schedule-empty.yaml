# An empty schedule (issue #312). The schema rejects it first (minLength 1);
# under --skip-schema-validation cronJobSpecFields fails naming the key. It
# used to pass the schema and render `schedule: ""`, which the API server
# refuses.
# Expected fail substring: "cronJobs.cleanup.schedule: required"
cronJobs:
  cleanup:
    schedule: ""
    image: busybox:1.36
    command: ["true"]
