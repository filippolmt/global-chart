# A probe whose one handler holds nulls only, beside a timing (issue #294): the
# schema rejects each null, and under --skip-schema-validation a map of nulls
# is the map left out, so the probe has no handler and validateProbeHandler
# names it. It used to render httpGet with null fields, which the API server
# refuses.
# Expected fail substring: "workloads.app.livenessProbe: no handler."
workloads:
  app:
    image: nginx:1.25
    livenessProbe:
      httpGet:
        path: null
        port: null
      periodSeconds: 5
