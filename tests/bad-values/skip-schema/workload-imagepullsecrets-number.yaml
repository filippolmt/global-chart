# A workload's imagePullSecrets items share global.imagePullSecrets' shape,
# a string or {name}. A number used to pass the schema and crash the render
# with "wrong type for value" (issue #158). Under --skip-schema-validation
# validateValueTypes names it.
# Expected fail substring: "workloads.web.imagePullSecrets[1]: a number, where the chart reads a map or a string"
workloads:
  web:
    image: nginx:1.25
    imagePullSecrets: [regcred, 5]
