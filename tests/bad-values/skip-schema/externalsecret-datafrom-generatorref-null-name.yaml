# A generatorRef whose name is null in a dataFrom entry's sourceRef (issue
# #309): a null name is unset, and the schema requires it. It used to count as
# self-contained and render `name: null` with no secretStoreRef, which ESO
# rejects at apply.
# Expected fail substring: "externalSecrets.app.dataFrom[0].sourceRef.generatorRef.name: mandatory"
externalSecrets:
  app:
    dataFrom:
      - sourceRef:
          generatorRef: { apiVersion: generators.external-secrets.io/v1alpha1, kind: Password, name: null }
