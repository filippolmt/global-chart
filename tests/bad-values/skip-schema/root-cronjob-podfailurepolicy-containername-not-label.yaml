# A podFailurePolicy containerName that is not a DNS-1123 label can name no
# container, so the schema rejects it before the render (issue #285); under
# --skip-schema-validation validatePodFailurePolicy finds no such container.
# Expected fail substring: "cronJobs.report.podFailurePolicy.rules[0].onExitCodes.containerName: 'Report_Main' names no container of the job's pod"
cronJobs:
  report:
    schedule: "0 3 * * *"
    image: busybox:1.36
    podFailurePolicy:
      rules:
        - action: FailJob
          onExitCodes:
            containerName: Report_Main
            operator: In
            values: [42]
