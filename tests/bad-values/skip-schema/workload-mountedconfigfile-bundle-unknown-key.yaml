# covers: mountedConfigFiles/properties/bundles/items
# An unknown key inside a mountedConfigFiles.bundles entry (typo of mountDir).
# The schema's closure rejects it first; under --skip-schema-validation
# workload.yaml names the mountDir it drops.
# Expected fail substring: "workloads.web.mountedConfigFiles.bundles[0].mountDir: required"
workloads:
  web:
    image: nginx:1.25
    mountedConfigFiles:
      bundles:
        - mountdir: /etc/app
          files:
            - name: app-conf
              relPath: app.conf
              content: |
                key = value
