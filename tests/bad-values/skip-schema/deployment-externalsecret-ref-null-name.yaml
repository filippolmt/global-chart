# A deployment externalSecrets reference whose name is null. The readers skip
# it (isNamedEntry); validateNullItems names it (issue #198).
# Expected fail substring: "deployments.web.externalSecrets[0].name: null, a value nobody wrote"
externalSecrets:
  app:
    secretstore: { kind: ClusterSecretStore, name: store }
    secretkey: PASSWORD
    remote: { key: app }
deployments:
  web:
    image: nginx:1.25
    externalSecrets:
      - name: null
