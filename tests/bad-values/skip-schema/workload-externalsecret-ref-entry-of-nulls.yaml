# A workload's externalSecrets ref naming an entry whose keys are all null
# (issue #305): the schema rejects the null, and under
# --skip-schema-validation the entry is an empty entry, so the ref fails as
# one to `app-conf: {}`. It used to fail on the secretstore the entry lacks.
# Expected fail substring: "workloads.app.externalSecrets: references 'app-conf', which is empty"
workloads:
  app:
    image: nginx:1.25
    externalSecrets:
      - name: app-conf
externalSecrets:
  app-conf:
    refreshInterval: null
