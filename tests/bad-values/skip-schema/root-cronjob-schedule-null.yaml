# A root-level cronjob with a null schedule (issue #312). The schema requires a
# string; under --skip-schema-validation the template fails naming the key,
# where it rendered `schedule: ""`, which the API server refuses.
# Expected fail substring: "cronJobs.cleanup.schedule: required"
cronJobs:
  cleanup:
    schedule: null
    image: busybox:1.36
    command: ["true"]
