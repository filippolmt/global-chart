# A storeRef whose name is "" in a dataFrom entry's sourceRef (issue #309): the
# schema requires a name of one character at least, as ESO's CRD does. It used
# to count as self-contained and render `name: ""` with no secretStoreRef,
# which ESO rejects at apply.
# Expected fail substring: "externalSecrets.app.dataFrom[0].sourceRef.storeRef.name: mandatory"
externalSecrets:
  app:
    dataFrom:
      - sourceRef:
          storeRef: { kind: ClusterSecretStore, name: "" }
