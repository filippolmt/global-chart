# covers: ingress/properties/tls/items
# An unknown key inside an ingress.tls entry (typo of secretName). Without the
# constraint the Ingress renders `secretName: ""` and the controller serves its
# default certificate.
# API accepts: dropped: no template reads the unknown key, so the manifest never carries it
workloads:
  web:
    image: nginx:1.25

ingress:
  enabled: true
  hosts:
    - host: example.com
      workload: web
      paths:
        - path: /
          pathType: Prefix
  tls:
    - hosts:
        - example.com
      secretname: example-tls
