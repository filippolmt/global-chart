# A podFailurePolicy containerName that is not a DNS-1123 label can name no
# container, so the schema rejects it before the render (issue #285).
cronJobs:
  report:
    schedule: "0 3 * * *"
    image: busybox:1.36
    podFailurePolicy:
      rules:
        - action: FailJob
          onExitCodes:
            containerName: Report_Main
            operator: In
            values: [42]
