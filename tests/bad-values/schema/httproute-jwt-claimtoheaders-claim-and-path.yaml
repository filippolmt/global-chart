# Envoy Gateway's CEL rule: exactly one of claim and claimPath.
httpRoute:
  enabled: true
  parentRefs: [{name: gw}]
  rules: [{backendRefs: [{service: {name: web, port: 80}}]}]
  jwt:
    enabled: true
    providers:
      - name: idp
        issuer: https://idp.example.com
        audiences: [app]
        remoteJWKS: {uri: https://idp.example.com/certs}
        claimToHeaders:
          - {header: X-User, claim: sub, claimPath: [sub]}
