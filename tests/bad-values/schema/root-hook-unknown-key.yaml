# covers: hookJob
# An unknown key under hooks.<type>.<name> (typo of weight). Must be rejected
# by values.schema.json ($defs/hookJob composes jobCommon + hookJobSpec +
# rootJobSpec under unevaluatedProperties:false). Without the constraint the
# hook keeps the default weight of 10 and runs in the wrong order.
# Requires Helm >= 3.18.6: older Helm ignores unevaluatedProperties silently.
# Root hooks are a oneOf [null, hookJob], so the headline error is "'oneOf'
# failed, none matched"; the key is named one line down, in the branch detail
# ("at '/hooks/pre-install/migrate/weigth': false schema").
hooks:
  pre-install:
    migrate:
      image: busybox:1.36
      command: ["sh", "-c", "true"]
      weigth: "-5"
