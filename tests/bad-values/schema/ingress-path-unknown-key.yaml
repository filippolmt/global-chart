# covers: ingress/properties/hosts/items/properties/paths/items
# An unknown key inside an ingress path entry (typo of pathType). Without the
# constraint the path renders with no pathType, which the API server rejects at
# apply time rather than here.
# API accepts: dropped: no template reads the unknown key, so the manifest never carries it
workloads:
  web:
    image: nginx:1.25

ingress:
  enabled: true
  hosts:
    - host: example.com
      workload: web
      paths:
        - path: /
          pathTipe: Prefix
