# ESO's CRD takes a store name only as a DNS-1123 subdomain (issue #317):
# `My_Store` renders and passes `helm lint`, then the API server rejects the
# ExternalSecret at apply.
# API rejects: "spec.secretStoreRef.name: Invalid value: "My_Store": spec.secretStoreRef.name in body should match"
externalSecrets:
  app:
    secretstore: { kind: ClusterSecretStore, name: My_Store }
    secretkey: PASSWORD
    remote: { key: app }
