# creationPolicy outside ESO's enum: it passed lint and the ExternalSecret CRD
# rejected it at apply.
# API rejects: "spec.target.creationPolicy: Unsupported value: "owner": supported values: "Owner", "Orphan", "Merge", "None""
externalSecrets:
  app:
    secretstore: { kind: ClusterSecretStore, name: store }
    secretkey: K
    remote: { key: k }
    target: { creationPolicy: owner }
