# maxReplicaCount 0: the ScaledObject CRD requires at least 1 (issue #226).
# API rejects: "spec.maxReplicaCount: Invalid value: 0: spec.maxReplicaCount in body should be greater than or equal to 1"
workloads:
  app:
    image: nginx:1.25
    keda:
      enabled: true
      maxReplicaCount: 0
      triggers:
        - type: cpu
          metricType: Utilization
          metadata: { value: "60" }
