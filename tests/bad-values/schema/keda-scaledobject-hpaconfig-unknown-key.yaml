# covers: kedaScaledObject/properties/advanced/properties/horizontalPodAutoscalerConfig
# An unknown key under keda.advanced.horizontalPodAutoscalerConfig (typo of
# behavior). Without the closure the derived HPA keeps the default scaling
# behaviour instead of the intended one.
deployments:
  web:
    image: nginx:1.25
    keda:
      enabled: true
      advanced:
        horizontalPodAutoscalerConfig:
          behaviour:
            scaleDown:
              stabilizationWindowSeconds: 300
      triggers:
        - type: cron
          metadata:
            timezone: UTC
            start: "0 0 * * *"
            end: "59 23 * * *"
            desiredReplicas: "2"
