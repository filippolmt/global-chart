# covers: kedaSecretTargetRef
# An unknown key in a secretTargetRef (a namespace, which KEDA does not take:
# the Secret is always read from the TriggerAuthentication's own namespace).
# Without the closure the key reads as if it pointed elsewhere and is ignored.
# The three real keys stay: all are required, so replacing one with a typo
# would reject the file even with the closure gone.
# API rejects: "unknown field "spec.secretTargetRef[0].namespace""
kedaTriggerAuthentications:
  auth:
    secretTargetRef:
      - parameter: password
        name: redis
        key: password
        namespace: other
