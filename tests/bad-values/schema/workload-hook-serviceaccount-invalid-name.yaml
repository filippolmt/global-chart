# The job scopes share the ServiceAccount definition with the workload
# (issue #123): `Migrate_SA` is rejected here too.
# API rejects: "metadata.name: Invalid value: "Migrate_SA": a lowercase RFC 1123 subdomain must consist of lower case"
# naming key: /$defs/serviceAccount/properties/name
workloads:
  web:
    image: nginx:1.25
    hooks:
      pre-install:
        migrate:
          command: ["true"]
          serviceAccount:
            create: true
            name: Migrate_SA
