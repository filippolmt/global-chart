# covers: externalSecret/properties/dataFrom/items
# dataFrom item with an unknown selector key (typo of "find") must be rejected
# by the schema before it reaches external-secrets at apply time.
# API rejects: "unknown field "spec.dataFrom[0].fnid""
externalSecrets:
  app:
    secretstore:
      kind: ClusterSecretStore
      name: my-store
    dataFrom:
      - fnid:
          name:
            regexp: "^APP_.*"
