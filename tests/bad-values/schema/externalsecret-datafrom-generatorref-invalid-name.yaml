# ESO's CRD takes a generator name only as a DNS-1123 subdomain (issue #317):
# `My_Password` renders and passes `helm lint`, then the API server rejects the
# ExternalSecret at apply.
# API rejects: "spec.dataFrom[0].sourceRef.generatorRef.name: Invalid value: "My_Password""
externalSecrets:
  app:
    dataFrom:
      - sourceRef:
          generatorRef: { kind: Password, name: My_Password }
