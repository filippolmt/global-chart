# covers: externalSecret
# An unknown key under externalSecrets.<name> (typo of refreshInterval). Must
# be rejected by values.schema.json ($defs/externalSecret is closed). Without
# the constraint the ExternalSecret keeps the operator default refresh and the
# intended interval never applies.
# API accepts: dropped: no template reads the unknown key, so the manifest never carries it
externalSecrets:
  app:
    secretstore:
      kind: ClusterSecretStore
      name: my-store
    refreshinterval: 1h
    secretkey: PASSWORD
    remote:
      key: app/password
