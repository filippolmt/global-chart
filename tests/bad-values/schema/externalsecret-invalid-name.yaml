# The key becomes the ExternalSecret name `<fullname>-<key>` and, by default,
# its target Secret: DNS-1123 subdomains. `App_Env` renders and passes
# `helm lint`, then the API server rejects it.
externalSecrets:
  App_Env:
    secretstore: { kind: ClusterSecretStore, name: store }
    secretkey: PASSWORD
    remote: { key: app }
