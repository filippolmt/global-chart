# covers: httpRouteRule/properties/matches/items/properties/path
# An unknown key inside a matches entry's path (typo of value). Without the
# closure the path matches the gateway default instead of the intended prefix.
deployments:
  api:
    image: nginx:1.25

httpRoute:
  enabled: true
  parentRefs:
    - name: public-gw
  rules:
    - matches:
        - path:
            type: PathPrefix
            vaule: /api
      backendRefs:
        - deployment: api
