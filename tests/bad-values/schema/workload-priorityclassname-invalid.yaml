# priorityClassName names an existing PriorityClass: a DNS-1123 subdomain.
# `Prod_High` renders, lints, and the API server rejects the Deployment.
# API rejects: "spec.template.spec.priorityClassName: Invalid value: "Prod_High": a lowercase RFC 1123 subdomain must consist"
workloads:
  main:
    image: nginx:1.25
    priorityClassName: Prod_High
