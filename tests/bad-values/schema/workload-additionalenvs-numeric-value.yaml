# EnvVar.value is a string (issue #137). A number renders unquoted, passes
# `helm lint`, then the API server rejects the Deployment.
# API rejects: "cannot unmarshal number into Go struct field EnvVar.spec.template.spec.containers.env.value"
workloads:
  app:
    image: nginx:1.25
    additionalEnvs:
      - name: LIMIT
        value: 10000000
