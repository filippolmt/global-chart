# EnvVar.value is a string (issue #137), in a sidecar's env (issue #148): the
# rest of the Container stays open, its env does not.
# API rejects: "cannot unmarshal number into Go struct field EnvVar.spec.template.spec.containers.env.value"
workloads:
  app:
    image: nginx:1.25
    extraContainers:
      - name: sidecar
        image: busybox:1.36
        env:
          - name: LIMIT
            value: 10000000
