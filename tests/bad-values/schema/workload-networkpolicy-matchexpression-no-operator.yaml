# A matchExpressions entry without an operator is rejected by the API server
# at apply; the schema catches it at lint.
# API rejects: "spec.ingress[0].from[0].podSelector.matchExpressions[0].operator: Invalid value: "": not a valid selector"
workloads:
  app:
    image: nginx:1.25
    networkPolicy:
      enabled: true
      ingress:
        - from:
            - podSelector:
                matchExpressions:
                  - key: app
                    values: [web]
