# Envoy Gateway's CEL rule: recomputeRoute needs claimToHeaders.
# API rejects: "spec.jwt.providers[0]: Invalid value: "object": no such key: claimToHeaders evaluating rule: claimToHeaders"
httpRoute:
  enabled: true
  parentRefs: [{name: gw}]
  rules: [{backendRefs: [{service: {name: web, port: 80}}]}]
  jwt:
    enabled: true
    providers:
      - name: idp
        issuer: https://idp.example.com
        audiences: [app]
        remoteJWKS: {uri: https://idp.example.com/certs}
        recomputeRoute: true
