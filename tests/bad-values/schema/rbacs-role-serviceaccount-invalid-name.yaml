# rbacs.roles[].serviceAccount.name becomes the ServiceAccount and the RoleBinding
# subject (issue #123). `Reader_SA` renders, lints, and is rejected at apply.
# API rejects: "metadata.name: Invalid value: "Reader_SA": a lowercase RFC 1123 subdomain must consist of lower case"
rbacs:
  roles:
    - name: reader
      serviceAccount:
        name: Reader_SA
      rules: []
