# covers: probe/properties/httpGet/properties/httpHeaders/items
# An HTTPHeader has no valueFrom (EnvVar has): Kubernetes drops it, and the
# header goes out with the literal value only.
deployments:
  app:
    image: nginx:1.25
    readinessProbe:
      httpGet:
        port: 8080
        httpHeaders:
          - name: Authorization
            value: ""
            valueFrom:
              secretKeyRef:
                name: probe-token
                key: token
