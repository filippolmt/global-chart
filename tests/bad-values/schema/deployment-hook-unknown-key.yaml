# covers: deploymentHookJob
# An unknown key under deployments.<name>.hooks.<type>.<name> (typo of
# deletePolicy). Must be rejected by values.schema.json
# ($defs/deploymentHookJob, unevaluatedProperties:false). Without the
# constraint the hook Job keeps the default before-hook-creation policy and
# the intended cleanup never happens.
# Requires Helm >= 3.18.6: older Helm ignores unevaluatedProperties silently.
deployments:
  web:
    image: nginx:1.25
    hooks:
      pre-install:
        migrate:
          command: ["sh", "-c", "true"]
          deletePolicie: hook-succeeded
