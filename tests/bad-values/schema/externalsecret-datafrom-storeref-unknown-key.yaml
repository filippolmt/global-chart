# covers: externalSecret/properties/dataFrom/items/properties/sourceRef/properties/storeRef
# An unknown key in a sourceRef storeRef (typo of kind): ESO reads a SecretStore
# of that name instead of the ClusterSecretStore.
externalSecrets:
  app:
    dataFrom:
      - extract:
          key: app
        sourceRef:
          storeRef:
            name: my-store
            knd: ClusterSecretStore
