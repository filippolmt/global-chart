# Envoy Gateway skips the issuer check on an empty issuer.
# API accepts: stricter: Envoy Gateway accepts an empty issuer, then skips the issuer check (#261)
httpRoute:
  enabled: true
  parentRefs: [{name: gw}]
  rules: [{backendRefs: [{service: {name: web, port: 80}}]}]
  jwt:
    enabled: true
    providers:
      - name: idp
        issuer: ""
        audiences: [app]
        remoteJWKS: {uri: https://idp.example.com/certs}
