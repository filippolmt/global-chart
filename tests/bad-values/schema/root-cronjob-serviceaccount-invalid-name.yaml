# A root cronjob's own ServiceAccount is held to the same rule (issue #123).
# API rejects: "metadata.name: Invalid value: "Cleanup_SA": a lowercase RFC 1123 subdomain must consist of lower case"
cronJobs:
  cleanup:
    schedule: "0 0 * * *"
    image: busybox:1.36
    serviceAccount:
      create: true
      name: Cleanup_SA
