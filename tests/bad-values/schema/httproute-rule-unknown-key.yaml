# covers: httpRouteRule
# An unknown key inside an httpRoute rule (typo of matches). Without the
# constraint the rule matches every path instead of the one intended, and the
# manifest is valid either way.
# API accepts: dropped: no template reads the unknown key, so the manifest never carries it
workloads:
  api:
    image: nginx:1.25

httpRoute:
  enabled: true
  parentRefs:
    - name: public-gw
  rules:
    - matchez:
        - path:
            type: PathPrefix
            value: /v1
      backendRefs:
        - workload: api
