# A ServiceAccount name is a DNS-1123 subdomain in every scope (issue #123).
# `Web_SA` renders and passes `helm lint`, then the API server rejects it.
# API rejects: "metadata.name: Invalid value: "Web_SA": a lowercase RFC 1123 subdomain must consist of lower case"
# naming key: /$defs/serviceAccount/properties/name
workloads:
  web:
    image: nginx:1.25
    serviceAccount:
      name: Web_SA
