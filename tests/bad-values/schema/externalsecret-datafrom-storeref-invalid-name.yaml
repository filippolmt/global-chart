# ESO's CRD takes a store name only as a DNS-1123 subdomain (issue #317):
# `My_Store` renders and passes `helm lint`, then the API server rejects the
# ExternalSecret at apply.
# API rejects: "spec.dataFrom[0].sourceRef.storeRef.name: Invalid value: "My_Store": spec.dataFrom[0].sourceRef.storeRef.name"
externalSecrets:
  app:
    dataFrom:
      - extract: { key: app }
        sourceRef:
          storeRef: { kind: ClusterSecretStore, name: My_Store }
