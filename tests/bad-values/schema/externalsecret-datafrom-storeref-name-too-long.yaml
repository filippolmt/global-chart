# 254 characters: one over the 253 ESO's CRD allows a store name (issue #317).
# The name is rendered verbatim as sourceRef.storeRef.name.
# API rejects: "spec.dataFrom[0].sourceRef.storeRef.name: Too long: may not be more than 253 bytes"
externalSecrets:
  app:
    dataFrom:
      - extract: { key: app }
        sourceRef:
          storeRef: { kind: ClusterSecretStore, name: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa.bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb.ccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc.dddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddd }
