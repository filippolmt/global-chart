# covers: externalSecret/properties/target
# An unknown key under externalSecrets.<name>.target (typo of creationPolicy).
# Without the closure ESO keeps Owner and deletes a Secret the values meant
# to orphan.
# API accepts: dropped: no template reads the unknown key, so the manifest never carries it
externalSecrets:
  app:
    secretstore:
      kind: ClusterSecretStore
      name: my-store
    secretkey: DB_PASSWORD
    remote:
      key: apps/prod/db
    target:
      creationPolicyy: Orphan
