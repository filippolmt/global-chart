# The kubelet parses a digest as <algorithm>:<hex>, with at least 32 hex
# characters (distribution/reference). sha256:abc passed a looser OCI pattern
# and still failed at pull time with InvalidImageName (issue #173).
# API accepts: silent-misrender: the API server does not parse an image reference; the pull fails with InvalidImageName
workloads:
  web:
    image:
      repository: nginx
      digest: "sha256:abc"
