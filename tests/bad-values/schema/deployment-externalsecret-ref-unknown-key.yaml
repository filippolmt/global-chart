# covers: externalSecretRef
# An unknown key in a deployments.<name>.externalSecrets entry (typo of
# mountPath). Must be rejected by values.schema.json ($defs/externalSecretRef,
# additionalProperties:false). Without the constraint the entry silently turns
# into an envFrom source instead of the volume it was meant to be.
externalSecrets:
  app-conf:
    secretstore: { kind: ClusterSecretStore, name: store }
    secretkey: app.conf
    remote: { key: app/conf }
deployments:
  web:
    image: nginx:1.25
    externalSecrets:
      - name: app-conf
        mountpath: /etc/app
