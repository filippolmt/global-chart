# The key becomes the UDPRoute name `<fullname>-<key>`, which the chart composes
# as a DNS-1123 label (issue #194). `Gps.Trackers` renders and passes
# `helm lint`, then the API server rejects it.
# API rejects: "metadata.name: Invalid value: "api-verdict-global-chart-Gps.Trackers": a lowercase RFC 1123 subdomain must"
# naming key: /properties/udpRoutes/propertyNames
udpRoutes:
  Gps.Trackers:
    parentRefs:
      - name: gw
    rules:
      - backendRefs:
          - service: { name: dns, port: 53 }
