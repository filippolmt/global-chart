# EnvVar.value is a string (issue #137), in a workload-scope job's env:
# the jobCommon $ref of the workload scope.
# API rejects: "cannot unmarshal number into Go struct field EnvVar.spec.jobTemplate.spec.template.spec.containers.env.value"
workloads:
  app:
    image: nginx:1.25
    cronJobs:
      report:
        schedule: "0 3 * * *"
        command: ["true"]
        env:
          - name: LIMIT
            value: 10000000
