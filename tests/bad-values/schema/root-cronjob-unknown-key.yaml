# covers: cronJob
# An unknown key under cronJobs.<name> (typo of image). Must be rejected by
# values.schema.json ($defs/cronJob composes jobCommon + cronJobSpec +
# rootJobSpec under unevaluatedProperties:false). Without the constraint the
# CronJob renders with no image and the render fails far from this line.
# Requires Helm >= 3.18.6: older Helm ignores unevaluatedProperties silently.
cronJobs:
  cleanup:
    image: busybox:1.36
    schedule: "0 0 * * *"
    imagge: busybox:1.37
