# A job's serviceAccountName names an existing ServiceAccount: a DNS-1123
# subdomain. `Migrate_SA` renders, lints, and the API server rejects the Job.
# API rejects: "spec.template.spec.serviceAccountName: Invalid value: "Migrate_SA": a lowercase RFC 1123 subdomain must"
hooks:
  pre-install:
    migrate:
      image: busybox:1.36
      command: ["true"]
      serviceAccountName: Migrate_SA
