# covers: jwtProvider/properties/extractFrom/properties/headers/items
# API rejects: "unknown field "spec.jwt.providers[0].extractFrom.headers[0].prefix""
httpRoute:
  enabled: true
  parentRefs: [{name: gw}]
  rules: [{backendRefs: [{service: {name: web, port: 80}}]}]
  jwt:
    enabled: true
    providers:
      - name: idp
        issuer: https://idp.example.com
        audiences: [app]
        remoteJWKS: {uri: https://idp.example.com/certs}
        extractFrom: {headers: [{name: X-Jwt-Assertion, prefix: 'Bearer '}]}
