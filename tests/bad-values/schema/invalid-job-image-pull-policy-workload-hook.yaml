# Same core violation on $defs/deploymentHookJob. See
# invalid-job-image-pull-policy-root-cronjob.yaml for why there are four files.
# API rejects: "spec.template.spec.containers[0].imagePullPolicy: Unsupported value: "Bogus": supported values: "Always""
workloads:
  backend:
    image: myapp:v1
    hooks:
      pre-install:
        demo:
          command: ["./migrate.sh"]
          imagePullPolicy: Bogus
