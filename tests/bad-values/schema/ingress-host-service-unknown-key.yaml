# An unknown key inside an ingress host's explicit service reference (typo of
# port). Without the constraint the backend falls back to port 80 and the
# traffic lands on the wrong port of an existing Service.
# The closure is backendServiceRef's, covered by httproute-backendref-service-unknown-key.yaml:
# this fixture proves the ingress host reaches it through its $ref.
ingress:
  enabled: true
  hosts:
    - host: example.com
      service:
        name: external-svc
        prot: 8080
      paths:
        - path: /
          pathType: Prefix
