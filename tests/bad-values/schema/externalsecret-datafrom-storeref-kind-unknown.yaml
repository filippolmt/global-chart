# ESO's CRD takes storeRef.kind only as SecretStore or ClusterSecretStore, as
# secretstore.kind does here (issue #317): a typo renders, then the API server
# rejects the ExternalSecret at apply.
# API rejects: "spec.dataFrom[0].sourceRef.storeRef.kind: Unsupported value: "ClusterSecretstore": supported values"
externalSecrets:
  app:
    dataFrom:
      - extract: { key: app }
        sourceRef:
          storeRef: { kind: ClusterSecretstore, name: my-store }
