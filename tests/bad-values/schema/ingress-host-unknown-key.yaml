# covers: ingress/properties/hosts/items
# An unknown key inside an ingress.hosts entry (typo of workload). Without
# the constraint the host resolves against no workload and the render fails
# far from this line.
workloads:
  web:
    image: nginx:1.25

ingress:
  enabled: true
  hosts:
    - host: example.com
      deploymnet: web
      paths:
        - path: /
          pathType: Prefix
