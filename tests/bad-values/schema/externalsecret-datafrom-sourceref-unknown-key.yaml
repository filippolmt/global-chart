# covers: externalSecret/properties/dataFrom/items/properties/sourceRef
# An unknown key in a dataFrom sourceRef (typo of storeRef). ESO prunes it, and
# the entry falls back to the ExternalSecret's own store.
externalSecrets:
  app:
    secretstore:
      kind: ClusterSecretStore
      name: my-store
    dataFrom:
      - extract:
          key: app
        sourceRef:
          storRef:
            kind: ClusterSecretStore
            name: other-store
