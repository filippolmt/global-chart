# covers: imagePullSecretMap
# An unknown key in the map form of an imagePullSecrets entry, beside name.
# A pull secret is a LocalObjectReference, always read from the pod's own
# namespace: without the closure `namespace` reads as pointing elsewhere and
# is dropped in silence. name stays: it is required, so replacing it with a
# typo would reject the file even with the closure gone.
deployments:
  web:
    image: nginx:1.25
    imagePullSecrets:
      - name: regcred
        namespace: other
