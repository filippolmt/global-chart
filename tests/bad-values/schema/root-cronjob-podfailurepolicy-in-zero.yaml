# The API server rejects exit code 0 with the In operator: 0 is success, and a
# failed pod never exits 0 (issue #282).
cronJobs:
  report:
    schedule: "0 3 * * *"
    image: busybox:1.36
    podFailurePolicy:
      rules:
        - action: FailJob
          onExitCodes:
            operator: In
            values: [0, 42]
