# covers: ingress
# An unknown key under ingress (typo of className). Must be rejected by
# values.schema.json ($defs/ingress is closed). Without the constraint the
# Ingress renders with no ingressClassName and no controller claims it.
# API accepts: dropped: no template reads the unknown key, so the manifest never carries it
workloads:
  web:
    image: nginx:1.25

ingress:
  enabled: true
  classname: nginx
  hosts:
    - host: example.com
      workload: web
      paths:
        - path: /
          pathType: Prefix
