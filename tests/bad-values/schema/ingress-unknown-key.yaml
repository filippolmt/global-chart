# An unknown key under ingress (typo of className). Must be rejected by
# values.schema.json ($defs/ingress is closed). Without the constraint the
# Ingress renders with no ingressClassName and no controller claims it.
deployments:
  web:
    image: nginx:1.25

ingress:
  enabled: true
  classname: nginx
  hosts:
    - host: example.com
      deployment: web
      paths:
        - path: /
          pathType: Prefix
