# covers: labelSelector/properties/matchExpressions/items
# An unknown key in a matchExpressions entry (typo of values).
# API rejects: "unknown field "spec.ingress[0].from[0].podSelector.matchExpressions[0].vlaues""
workloads:
  app:
    image: nginx:1.25
    networkPolicy:
      enabled: true
      ingress:
        - from:
            - podSelector:
                matchExpressions:
                  - key: app
                    operator: Exists
                    vlaues: [web]
