# A probe port outside 1-65535, or a name that is not an IANA_SVC_NAME, is
# rejected by the API server at apply; the schema catches it at lint.
# API rejects: "spec.template.spec.containers[0].livenessProbe.httpGet.port: Invalid value: 80800: must be between 1 and"
workloads:
  app:
    image: nginx:1.25
    livenessProbe:
      httpGet:
        port: 80800
