# API rejects: "spec.jwt.providers[0]: Invalid value: either remoteJWKS or localJWKS must be specified"
httpRoute:
  enabled: true
  parentRefs: [{name: gw}]
  rules: [{backendRefs: [{service: {name: web, port: 80}}]}]
  jwt:
    enabled: true
    providers:
      - name: idp
        issuer: https://idp.example.com
        audiences: [app]
