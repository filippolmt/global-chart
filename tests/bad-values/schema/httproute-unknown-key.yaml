# covers: httpRoute
# An unknown key under httpRoute (typo of hostnames). Without the constraint
# the HTTPRoute matches every hostname the gateway listens on instead of the
# one intended.
# API accepts: dropped: no template reads the unknown key, so the manifest never carries it
workloads:
  api:
    image: nginx:1.25

httpRoute:
  enabled: true
  hostname:
    - api.example.com
  parentRefs:
    - name: public-gw
  rules:
    - backendRefs:
        - workload: api
