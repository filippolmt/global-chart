# covers: envVar
# An unknown key in an env entry (typo of valueFrom). Kubernetes drops the
# field it does not know, so the variable arrives empty instead of resolved.
# API rejects: "unknown field "spec.template.spec.containers[0].env[0].valueFrm""
workloads:
  app:
    image: nginx:1.25
    additionalEnvs:
      - name: DB_PASSWORD
        valueFrm:
          secretKeyRef: { name: db, key: password }
