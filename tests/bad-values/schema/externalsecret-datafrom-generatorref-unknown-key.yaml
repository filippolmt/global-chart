# covers: externalSecret/properties/dataFrom/items/properties/sourceRef/properties/generatorRef
# An unknown key in a sourceRef generatorRef (typo of apiVersion).
# API rejects: "unknown field "spec.dataFrom[0].sourceRef.generatorRef.apiVerison""
externalSecrets:
  app:
    dataFrom:
      - sourceRef:
          generatorRef:
            apiVerison: generators.external-secrets.io/v1alpha1
            kind: Password
            name: app-password
