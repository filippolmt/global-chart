# A volumeMounts entry without a mountPath. Kubernetes rejects it at apply
# time; the schema catches it first: validateMountPaths reads it.
# API rejects: "spec.template.spec.containers[0].volumeMounts[0].mountPath: Required value"
workloads:
  app:
    image: nginx:1.25
    volumes:
      - name: data
        emptyDir: {}
    volumeMounts:
      - name: data
