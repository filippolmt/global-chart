# covers: autoscaling
# An unknown key under workloads.<name>.autoscaling (typo of maxReplicas).
# Without the constraint the HPA renders with no upper bound declared and the
# render fails far from this line.
workloads:
  web:
    image: nginx:1.25
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplica: 10
