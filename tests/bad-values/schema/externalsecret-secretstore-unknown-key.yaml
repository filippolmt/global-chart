# covers: externalSecret/properties/secretstore
# An unknown key under externalSecrets.<name>.secretstore (typo of kind).
# Without the closure the store kind falls back to the default and the
# ExternalSecret points at a store that may not exist.
externalSecrets:
  app:
    secretstore:
      knid: SecretStore
      name: my-store
    secretkey: DB_PASSWORD
    remote:
      key: apps/prod/db
