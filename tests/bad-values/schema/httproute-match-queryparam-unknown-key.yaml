# covers: httpRouteRule/properties/matches/items/properties/queryParams/items
# An unknown key inside a matches entry's queryParams item (typo of type).
# Without the closure the parameter matches exactly instead of by the intended
# regular expression.
deployments:
  api:
    image: nginx:1.25

httpRoute:
  enabled: true
  parentRefs:
    - name: public-gw
  rules:
    - matches:
        - queryParams:
            - name: version
              value: "^v[0-9]+$"
              tpye: RegularExpression
      backendRefs:
        - deployment: api
