# covers: deploymentReloader
# An unknown key under workloads.<name>.reloader (typo of externalSecrets).
# Without the closure the field is dropped in silence and Reloader never rolls
# the pods on an ExternalSecret rotation.
externalSecrets:
  app-env:
    secretstore: { kind: ClusterSecretStore, name: store }
    secretkey: KEY
    remote: { key: app/env }
workloads:
  web:
    image: nginx:1.25
    externalSecrets:
      - name: app-env
    reloader:
      externalSecret: true
