# covers: persistentVolumeClaimRetentionPolicy
# An unknown key under persistentVolumeClaimRetentionPolicy (typo of whenScaled).
# Without the constraint the default Retain applies in silence.
# API accepts: dropped: no template reads the unknown key, so the manifest never carries it
workloads:
  db:
    kind: StatefulSet
    image: nginx:1.25
    persistentVolumeClaimRetentionPolicy:
      whenScale: Delete
