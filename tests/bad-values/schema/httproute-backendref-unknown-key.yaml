# covers: httpRouteBackendRef
# An unknown key inside an httpRoute rule backendRefs entry (typo of weight).
# Without the closure every backend gets the default weight and the intended
# traffic split never happens.
workloads:
  api:
    image: nginx:1.25

httpRoute:
  enabled: true
  parentRefs:
    - name: public-gw
  rules:
    - backendRefs:
        - workload: api
          wieght: 10
