# covers: kedaTrigger
# An unknown key inside a KEDA trigger (typo of metricType). Without the
# constraint the trigger falls back to the default metric type and scales on
# the wrong quantity.
deployments:
  web:
    image: nginx:1.25
    keda:
      enabled: true
      triggers:
        - type: cron
          metricTypee: AverageValue
          metadata:
            timezone: UTC
            start: "0 0 * * *"
            end: "59 23 * * *"
            desiredReplicas: "2"
