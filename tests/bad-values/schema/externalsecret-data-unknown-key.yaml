# covers: externalSecret/properties/data/items
# An unknown key inside an externalSecrets.<name>.data entry (typo of
# secretkey). Without the closure the entry renders with no target key and
# external-secrets rejects it at apply time rather than here.
externalSecrets:
  app:
    secretstore:
      kind: ClusterSecretStore
      name: my-store
    data:
      - secretKey: DB_PASSWORD
        remote:
          key: apps/prod/db
