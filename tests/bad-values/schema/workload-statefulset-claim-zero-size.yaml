# A claim template asking for no storage: the size pattern takes a positive
# quantity only.
# API rejects: "spec.volumeClaimTemplates[0].spec.resources[storage]: Invalid value: "0": must be greater than zero"
workloads:
  db:
    kind: StatefulSet
    image: nginx:1.25
    volumeMounts:
      - name: data
        mountPath: /data
    volumeClaimTemplates:
      - name: data
        size: "0Gi"
