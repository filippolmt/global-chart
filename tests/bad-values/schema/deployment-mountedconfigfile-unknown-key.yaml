# covers: mountedConfigFiles/properties/files/items
# An unknown key inside a mountedConfigFiles.files entry (typo of targetPath).
# Without the closure the file has no target path and is mounted somewhere
# other than where the values file says.
deployments:
  web:
    image: nginx:1.25
    mountedConfigFiles:
      files:
        - name: app-conf
          filename: app.conf
          tagretPath: /etc/app/app.conf
          content: |
            key = value
