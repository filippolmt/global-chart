# covers: jwtProvider/properties/localJWKS
# API rejects: "unknown field "spec.jwt.providers[0].localJWKS.inlne""
httpRoute:
  enabled: true
  parentRefs: [{name: gw}]
  rules: [{backendRefs: [{service: {name: web, port: 80}}]}]
  jwt:
    enabled: true
    providers:
      - name: idp
        issuer: https://idp.example.com
        audiences: [app]
        localJWKS: {type: Inline, inline: '{"keys": []}', inlne: x}
