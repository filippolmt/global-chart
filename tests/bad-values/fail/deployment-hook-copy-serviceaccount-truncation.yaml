# A deployment creating a 63-character ServiceAccount read by a pre-* hook: the
# copy <sa>-hook truncates back onto the real SA's name, and a copy sharing the
# real name would delete it under hook-succeeded (ADR 0011).
deployments:
  app:
    image: busybox:1.36
    serviceAccount: { name: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa }
    hooks:
      pre-install:
        migrate:
          command: ["true"]
