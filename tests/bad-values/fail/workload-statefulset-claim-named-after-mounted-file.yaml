# A claim template named after the volume a mounted config file generates: the
# pod would carry two volumes of one name (ADR 0020).
# Expected fail substring: "workloads.db.volumeClaimTemplates[0]: 'md-cm-file-app' is also the name of the pod volume of workloads.db.mountedConfigFiles.files[0]"
workloads:
  db:
    kind: StatefulSet
    image: nginx:1.25
    mountedConfigFiles:
      files:
        - name: app
          filename: app.yaml
          targetPath: /etc/app.yaml
          content: "a: 1"
    volumeMounts:
      - name: md-cm-file-app
        mountPath: /data
    volumeClaimTemplates:
      - name: md-cm-file-app
        size: 1Gi
