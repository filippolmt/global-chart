# A mountedConfigFiles entry with no filename rendered the ConfigMap key as
# `: |` and failed with a bare YAML parse error (issue #157).
# Expected fail substring: "workloads.web.mountedConfigFiles.files[0].filename: required"
workloads:
  web:
    image: nginx:1.25
    mountedConfigFiles:
      files:
        - name: app-conf
          targetPath: /etc/app/app.conf
          content: "a: b"
