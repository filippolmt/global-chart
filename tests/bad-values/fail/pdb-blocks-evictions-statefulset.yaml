# A StatefulSet with one pod and minAvailable: 1 allows no voluntary eviction,
# as a Deployment does (issue #216, ADR 0021).
# Expected fail substring: "deployments.app.pdb.minAvailable: 1 allows no voluntary eviction with deployments.app.replicaCount: 1"
deployments:
  app:
    kind: StatefulSet
    image: nginx:1.25
    replicaCount: 1
    pdb:
      enabled: true
      minAvailable: 1
