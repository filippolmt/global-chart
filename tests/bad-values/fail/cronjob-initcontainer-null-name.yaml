# A null name on a cronjob's init container: the schema leaves a container
# open, and validatePodFailurePolicy reads the name, so the null fails naming
# its path instead of being skipped (issue #285).
# Expected fail substring: "cronJobs.report.initContainers[0].name: null"
cronJobs:
  report:
    schedule: "0 3 * * *"
    image: busybox:1.36
    initContainers:
      - name: null
        image: busybox:1.36
    podFailurePolicy:
      rules:
        - action: FailJob
          onExitCodes:
            containerName: report
            operator: In
            values: [42]
