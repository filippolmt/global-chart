# Renamed in 4.0.0 (issue #221, ADR 0023): the schema declares the old key
# with no constraint, and global-chart.rejectRemovedKeys fails naming the new one.
# Expected fail substring: "workloads.web.cronJobs.sync.inheritDeploymentEnvFromConfigMaps: removed in 4.0.0, use inheritWorkloadEnvFromConfigMaps"
workloads:
  web:
    image: nginx:1.25
    cronJobs:
      sync:
        schedule: "0 * * * *"
        command: ["./sync.sh"]
        inheritDeploymentEnvFromConfigMaps: false
