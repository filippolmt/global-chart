# autoscaling.enabled with no positive target (issue #151, ADR 0012). The
# workload drops spec.replicas, no HPA renders, and Kubernetes runs one pod.
# Must be rejected by global-chart.validateAutoscalingConflict.
# Expected fail substring: "workloads.app.autoscaling: enabled, but neither"
workloads:
  app:
    image: nginx:1.25
    replicaCount: 3
    autoscaling:
      enabled: true
      minReplicas: 3
      maxReplicas: 10
