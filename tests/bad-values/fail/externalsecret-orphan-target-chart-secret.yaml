# An Orphan ExternalSecret named after a deployment that also declares secret:
# Orphan clears data down to its own keys like Owner, so ESO and Helm
# overwrite each other's data on every upgrade and every refresh — only
# without the garbage collection (issue #161, ADR 0013).
# Expected fail substring: "generated by externalSecrets.app conflicts with deployments.app.secret"
externalSecrets:
  app:
    secretstore: { kind: ClusterSecretStore, name: store }
    secretkey: K
    remote: { key: k }
    target: { creationPolicy: Orphan }
deployments:
  app:
    image: nginx:1.25
    secret: { API_KEY: abc }
