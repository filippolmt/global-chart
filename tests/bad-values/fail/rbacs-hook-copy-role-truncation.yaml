# A 253-character role read by a pre-* hook: the Role copy <role>-hook is
# truncated to 253 like the real Role, back onto the real Role's name, and a
# copy sharing the real name would delete it under hook-succeeded (ADR 0010).
rbacs:
  roles:
    - name: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      serviceAccount: { create: false, name: existing }
      rules: []
hooks:
  pre-upgrade:
    migrate:
      image: busybox:1.36
      serviceAccountName: existing
