# An Owner ExternalSecret named after a deployment that also declares secret:
# both default to <fullname>-<key>, so ESO adopts the Helm Secret, the two
# overwrite each other's data, and deleting the ExternalSecret garbage-collects
# the Secret (issue #153, ADR 0013).
# Expected fail substring: "generated by externalSecrets.app conflicts with deployments.app.secret"
externalSecrets:
  app:
    secretstore: { kind: ClusterSecretStore, name: store }
    secretkey: K
    remote: { key: k }
deployments:
  app:
    image: nginx:1.25
    secret: { API_KEY: abc }
