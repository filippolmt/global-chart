# podFailurePolicy containerName naming no container of the Job's pod: the
# main container takes the job's key, which the schema cannot know; the API
# server rejects it at install (issue #285).
# Expected fail substring: "cronJobs.report.podFailurePolicy.rules[0].onExitCodes.containerName: 'worker' names no container of the job's pod"
cronJobs:
  report:
    schedule: "0 3 * * *"
    image: busybox:1.36
    initContainers:
      - name: wait-db
        image: busybox:1.36
    podFailurePolicy:
      rules:
        - action: FailJob
          onExitCodes:
            containerName: worker
            operator: In
            values: [42]
