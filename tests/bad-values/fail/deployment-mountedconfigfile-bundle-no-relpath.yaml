# A bundle file with no relPath rendered its ConfigMap key as "." and its
# projected path as null (issue #157).
# Expected fail substring: "deployments.web.mountedConfigFiles.bundles[0].files[0] (app-conf): 'relPath' is required"
deployments:
  web:
    image: nginx:1.25
    mountedConfigFiles:
      bundles:
        - mountDir: /etc/app
          files:
            - name: app-conf
              content: "a: b"
