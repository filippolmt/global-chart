# A minAvailable percentage below 100% that rounds up to the replica count:
# ceil(60% of 2) = 2, so no pod can be evicted (issue #216, ADR 0021).
# Expected fail substring: "deployments.app.pdb.minAvailable: 60% allows no voluntary eviction with deployments.app.replicaCount: 2"
deployments:
  app:
    image: nginx:1.25
    replicaCount: 2
    pdb:
      enabled: true
      minAvailable: "60%"
