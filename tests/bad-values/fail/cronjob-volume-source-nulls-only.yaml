# A cronjob volume whose source holds nulls only (issues #294, #300): a map of
# nulls is the map left out, which leaves the volume no source, so
# renderVolume fails naming it rather than letting the API server make it an
# emptyDir.
# Expected fail substring: "cronJobs.backup.volumes[0].emptyDir: holds nulls only, which leaves the volume no source besides its name"
cronJobs:
  backup:
    image: busybox:1.36
    schedule: "0 2 * * *"
    command: ["/bin/true"]
    volumes:
      - name: data
        emptyDir:
          medium: null
