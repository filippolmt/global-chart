# Renamed in 4.0.0 (issue #221, ADR 0023): the schema declares the old key
# with no constraint, and global-chart.validateRemovedKeys fails naming the new one.
# Expected fail substring: "workloads.web.hooks.pre-install.migrate.inheritDeploymentSecret: removed in 4.0.0, use inheritWorkloadSecret"
workloads:
  web:
    image: nginx:1.25
    hooks:
      pre-install:
        migrate:
          command: ["./migrate.sh"]
          inheritDeploymentSecret: false
