# A role creating a 63-character ServiceAccount read by a pre-* hook: the copy
# <sa>-hook truncates back onto the real SA's name, and a copy sharing the real
# name would delete it under hook-succeeded (ADR 0010).
# Expected fail substring: "created for rbacs.roles[0] ('scaler') (hook prerequisite copy) conflicts with the one created for rbacs.roles[0]"
rbacs:
  roles:
    - name: scaler
      serviceAccount: { name: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa }
      rules: []
hooks:
  pre-upgrade:
    migrate:
      image: busybox:1.36
      serviceAccountName: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
