# Two role names over 60 characters sharing a prefix: the default ServiceAccount
# <name>-sa is truncated to 63, so both roles would bind one SA (issue #122).
rbacs:
  roles:
    - { name: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa1, serviceAccount: {}, rules: [] }
    - { name: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa2, serviceAccount: {}, rules: [] }
