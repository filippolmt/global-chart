# A hook naming its ServiceAccount in both serviceAccountName and
# serviceAccount.name, with different values: serviceAccountName used to win in
# silence, and the SA was created as `runner` with the annotations meant for
# `migrator` (issue #133). JSON Schema cannot compare two fields, so only the
# render catches it.
hooks:
  pre-install:
    migrate:
      image: busybox:1.36
      serviceAccountName: runner
      serviceAccount:
        name: migrator
        create: true
