# endPort below port (issue #271). The schema cannot compare two fields; the
# API server rejects the NetworkPolicy at apply.
# Must be rejected by global-chart.validateNetworkPolicyPorts.
# Expected fail substring: "workloads.app.networkPolicy.ingress[0].ports[0].endPort: 7999 is below port 8000"
workloads:
  app:
    image: nginx:1.25
    networkPolicy:
      enabled: true
      ingress:
        - ports:
            - port: 8000
              endPort: 7999
