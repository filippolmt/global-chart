# nodePort on a ClusterIP Service: the API server answers `nodePort: Forbidden`
# (issue #155).
# Expected fail substring: "deployments.web.service.extraPorts[0].nodePort: set on a ClusterIP Service, which the API server rejects: only a NodePort or LoadBalancer Service takes a nodePort"
deployments:
  web:
    image: nginx:1.25
    service:
      extraPorts:
        - name: metrics
          port: 9090
          targetPort: 9090
          nodePort: 30090
