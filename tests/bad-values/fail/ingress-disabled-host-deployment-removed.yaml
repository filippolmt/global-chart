# Renamed in 4.0.0 (issue #221, ADR 0023): the schema declares the old key
# with no constraint, and global-chart.validateRemovedKeys fails naming the new one.
# A disabled Ingress renders nothing; the old key fails all the same, so it
# cannot wait for the next enable.
# Expected fail substring: "ingress.hosts[0].deployment: removed in 4.0.0, use workload"
ingress:
  enabled: false
  hosts:
    - host: example.com
      deployment: web
      paths:
        - path: /
          pathType: Prefix
