# Renamed in 4.0.0 (issue #221, ADR 0023): the schema declares the old key
# with no constraint, and global-chart.rejectRemovedKeys fails naming the new one.
# Expected fail substring: "httpRoute.rules[0].backendRefs[0].deployment: removed in 4.0.0, use workload"
workloads:
  web:
    image: nginx:1.25
httpRoute:
  enabled: true
  parentRefs:
    - name: public-gw
  rules:
    - backendRefs:
        - deployment: web
