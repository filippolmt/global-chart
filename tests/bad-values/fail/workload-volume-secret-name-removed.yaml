# The secret.name alias of the legacy volume format, removed in 4.0.0 (issue
# #230, ADR 0022). Kubernetes would drop it as an unknown field of the source.
# Expected fail substring: "workloads.web.volumes[0].secret.name: removed in 4.0.0, use secret.secretName"
workloads:
  web:
    image: nginx:1.25
    volumes:
      - name: creds
        secret:
          name: app-creds
