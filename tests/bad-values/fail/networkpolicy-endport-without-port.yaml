# endPort with no port (issue #271): a range starts at a numeric port, and the
# API server rejects the NetworkPolicy at apply.
# Must be rejected by global-chart.validateNetworkPolicyPorts.
# Expected fail substring: "workloads.app.networkPolicy.ingress[0].ports[0].endPort: 8100 is set without port"
workloads:
  app:
    image: nginx:1.25
    networkPolicy:
      enabled: true
      ingress:
        - ports:
            - protocol: TCP
              endPort: 8100
