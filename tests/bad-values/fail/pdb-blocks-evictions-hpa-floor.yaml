# An HPA owns the replicas: at minReplicas, where the workload idles, the PDB
# allows no voluntary eviction (issue #216, ADR 0021).
# Expected fail substring: "deployments.app.pdb.minAvailable: 1 allows no voluntary eviction with deployments.app.autoscaling.minReplicas: 1"
deployments:
  app:
    image: nginx:1.25
    autoscaling:
      enabled: true
      minReplicas: 1
      maxReplicas: 5
      targetCPUUtilizationPercentage: 80
    pdb:
      enabled: true
      minAvailable: 1
