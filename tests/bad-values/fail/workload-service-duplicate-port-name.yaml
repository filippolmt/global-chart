# An extra port named like the primary port: two Service ports named `http`,
# rejected by the API server (issue #155).
# Expected fail substring: "workloads.web.service.extraPorts[0].name: 'http' repeats the port name of service.portName"
workloads:
  web:
    image: nginx:1.25
    service:
      extraPorts:
        - name: http
          port: 81
          targetPort: 8081
