# A role creating the ServiceAccount a deployment also creates: two manifests,
# one name, and the install dies on "already exists" (issue #122).
# Expected fail substring: "Name collision: ServiceAccount 'shared' created for rbacs.roles[0] ('reader') conflicts with the one created for deployments.web"
deployments:
  web:
    image: nginx:1.25
    serviceAccount: { name: shared }
rbacs:
  roles:
    - name: reader
      serviceAccount: { name: shared }
      rules: []
