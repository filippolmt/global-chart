# Renamed in 4.0.0 (issue #221, ADR 0023): the schema declares the old key
# with no constraint, and global-chart.rejectRemovedKeys fails naming the new one.
# Expected fail substring: "hooks.pre-install.migrate.fromDeployment: removed in 4.0.0, use fromWorkload"
workloads:
  web:
    image: nginx:1.25
hooks:
  pre-install:
    migrate:
      fromDeployment: web
      command: ["./migrate.sh"]
