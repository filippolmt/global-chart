# A hook references an externalSecrets key that does not exist — here the
# Secret name it produces instead of the key. Rejected by the template
# (resolveExternalSecretRefs), not the schema: the schema cannot see the keys
# of another map. Expected fail substring: "which is not a key of externalSecrets"
externalSecrets:
  app-env:
    secretstore: { kind: ClusterSecretStore, name: store }
    secretkey: PASSWORD
    remote: { key: app/password }
hooks:
  pre-install:
    migrate:
      image: busybox:1.36
      externalSecrets:
        - name: global-chart-bad-values-app-env
