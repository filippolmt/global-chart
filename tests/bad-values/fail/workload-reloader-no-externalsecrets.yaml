# reloader.externalSecrets with no referenced externalSecrets (issue #175,
# ADR 0016): the annotation would have nothing to watch.
# Must be rejected by global-chart.deploymentOwnAnnotations.
# Expected fail substring: "workloads.web.reloader.externalSecrets: true, but the workload references no externalSecrets"
workloads:
  web:
    image: nginx:1.25
    reloader:
      externalSecrets: true
