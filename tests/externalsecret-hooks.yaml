# ExternalSecrets read by hooks and cronjobs (issue #110, ADR 0007): the pre-*
# hooks read the hook-prerequisite copy, everything else the real Secret.
externalSecrets:
  app-env:
    secretstore: { kind: ClusterSecretStore, name: default-store }
    data:
      - secretkey: DB_PASSWORD
        remote: { key: apps/prod/db, property: password }
  app-conf:
    secretstore: { kind: ClusterSecretStore, name: default-store }
    secretkey: app.conf
    remote: { key: apps/prod/conf }
    target:
      name: app-conf
deployments:
  app:
    image: nginx:1.25
    externalSecrets:
      - name: app-env
      - name: app-conf
        mountPath: /etc/app
    hooks:
      pre-upgrade:
        migrate:
          command: ["sh", "-c", "test -n \"$DB_PASSWORD\" && test -s /etc/app/app.conf"]
      post-install:
        notify:
          command: ["true"]
    cronJobs:
      nightly:
        schedule: "0 3 * * *"
        command: ["true"]
        externalSecrets:
          - name: app-env
hooks:
  pre-install:
    seed:
      image: busybox:1.36
      weight: -2
      command: ["sh", "-c", "test -n \"$DB_PASSWORD\""]
      externalSecrets:
        - name: app-env
