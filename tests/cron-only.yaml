# CronJobs only - no workloads
workloads: {}
cronJobs:
  nightly:
    schedule: "0 3 * * *"
    image: busybox:1.36
    command: ["sh", "-c"]
    args: ["echo night run"]
    # A preemption is retried without spending backoffLimit (issue #282)
    podFailurePolicy:
      rules:
        - action: Ignore
          onPodConditions:
            - type: DisruptionTarget
              status: "True"
        - action: Count
          onExitCodes:
            operator: NotIn
            values: [0]
    envFromSecrets:
      - shared-secret
    resources: {}
