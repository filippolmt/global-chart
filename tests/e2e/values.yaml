# End-to-end scenario for `make e2e` — runs against a throwaway kind cluster.
#
# Deliberately small and image-light (busybox only) because this is the one
# scenario that actually installs: it verifies the hook lifecycle, which
# helm-unittest cannot see (it renders YAML, it does not run Helm).
#
# Covers:
# - pre-install and pre-upgrade hooks bound to a chart-created ServiceAccount
#   (issue #71, ADR 0011): the SA is a normal resource, created AFTER the pre-*
#   hooks, so the chart emits a hook-prerequisite copy <sa>-hook and the Job
#   runs as it. Its own name, so the pre-upgrade copy lives beside the real SA
#   and its deletion leaves it alone (issue #141): the SA UID survives the upgrade
# - the prereq ConfigMap/Secret copies feeding the hook's env
# - deployment-level command/args (issue #72)
# - a root-level hook, which creates its own ServiceAccount
# - a root-level cronJob with no serviceAccount at all: same class of bug as
#   issue #82 — the manifest is valid, kubeconform passes, and the pod simply
#   never schedules because the SA it names was never created
# - Service target ports actually resolving to container ports (issue #82). This
#   is the only check that can see it: a targetPort naming a port nothing
#   declares renders valid YAML and passes kubeconform, and Kubernetes creates
#   the Service without complaint — the port just never gets an endpoint. Only a
#   live endpoints controller reveals it.
# - a KEDA-scaled deployment: only the CRDs are installed, no operator, so what
#   is asserted is the chart's own invariant — with an autoscaler owning
#   spec.replicas, `helm upgrade` must not reset the live replica count
# - pre-* hooks reading a Secret the release's own ExternalSecret produces
#   (issue #110): the ExternalSecret is a normal resource, applied AFTER the
#   pre-* hooks, so the hooks must read the hook-prerequisite copy (ADR 0007).
#   Both forms — envFrom and a mounted volume — against ESO's fake provider
# - pre-* and post-delete hooks running as the ServiceAccount of an rbacs.roles
#   entry (ADR 0010): the SA, Role and RoleBinding are normal resources, applied
#   AFTER the pre-* hooks and deleted BEFORE post-delete, so the hooks must run
#   as the <name>-hook copies. The hooks call the API with their token, so a
#   missing permission fails them, not only a missing SA
# - a pre-rollback hook (issue #143) running as that same SA and reading an
#   ExternalSecret: `helm rollback` exercises both copies in the one phase
#   helm-unittest cannot order
externalSecrets:
  e2e-env:
    secretstore: { kind: ClusterSecretStore, name: e2e-fake }
    secretkey: E2E_TOKEN
    remote: { key: e2e/token }
  e2e-conf:
    secretstore: { kind: ClusterSecretStore, name: e2e-fake }
    secretkey: app.conf
    remote: { key: e2e/conf }

rbacs:
  roles:
    - name: e2e-hook-reader
      serviceAccount:
        name: e2e-hook-reader
      rules:
        - apiGroups: [""]
          resources: ["configmaps"]
          verbs: ["list"]

kedaTriggerAuthentications:
  e2e-auth:
    secretTargetRef:
      - parameter: username
        name: e2e-keda-credentials
        key: username

deployments:
  app:
    image: busybox:1.36
    command: ["sh", "-c"]
    args: ["sleep 3600"]
    replicaCount: 1
    # No targetPort: it defaults to portName, so the Service targets "admin" and
    # the container port is named "admin". Defaulting to the literal "http", as
    # the chart used to, left this Service with no endpoints at all.
    service:
      port: 8081
      portName: admin
    serviceAccount:
      create: true
      annotations:
        e2e/marker: chart-created
    configMap:
      FOO: bar
    secret:
      DB_PASSWORD: supersecret
    # Inherited by every hook below. The Deployment reads the real Secrets — a
    # missing one leaves it unavailable and `rollout status` fails.
    externalSecrets:
      - name: e2e-env
      - name: e2e-conf
        mountPath: /etc/e2e-es
    # Runtime coverage for the mounted config file names. No assertion of its
    # own is needed: a volume pointing at a ConfigMap the chart did not render
    # leaves the pod in ContainerCreating, and the existing
    # `rollout status deploy/<rel>-global-chart-app` fails with "deployment 'app'
    # never became available". NOT the "release deployed" assertion — `helm
    # install` here carries no `--wait`, so the release reports deployed whatever
    # the pods do. One `files` entry and one bundle, because the two branches
    # derive the ConfigMap name through the same helper and share one name space.
    mountedConfigFiles:
      files:
        - name: e2e-file
          filename: app.conf
          targetPath: /etc/e2e/app.conf
          content: |
            mounted = file
      bundles:
        - mountDir: /etc/e2e-bundle
          files:
            - name: e2e-bundle-entry
              relPath: bundle.conf
              content: |
                mounted = bundle
    hooks:
      # The hook asserts the values rather than echoing them: `echo` exits 0
      # whatever the env holds, so an empty FOO would still have marked the Job
      # succeeded. A non-zero exit here fails the hook, and with it the release.
      pre-install:
        migration:
          command: ["sh", "-c"]
          args: ['[ "$FOO" = bar ] && [ "$DB_PASSWORD" = supersecret ] && [ "$E2E_TOKEN" = s3cr3t ] && [ "$(cat /etc/e2e-es/app.conf)" = conf ]']
        # Negative weight on purpose. minJobWeight becomes -5, so the derived
        # prereq ConfigMap/Secret and the SA copy land at -12. Were those
        # ever floored at 0 they would sort AFTER this Job, which would then
        # start without the ConfigMap it reads. Guards the weight invariant in
        # CLAUDE.md pattern 6 at runtime, where helm-unittest cannot see it.
        early:
          weight: "-5"
          command: ["sh", "-c"]
          args: ['[ "$FOO" = bar ] && [ "$E2E_TOKEN" = s3cr3t ]']
      pre-upgrade:
        migration:
          command: ["sh", "-c"]
          args: ['[ "$FOO" = bar ] && [ "$E2E_TOKEN" = s3cr3t ] && [ "$(cat /etc/e2e-es/app.conf)" = conf ]']

  worker:
    image: busybox:1.36
    command: ["sh", "-c"]
    args: ["sleep 3600"]
    service:
      enabled: false
    keda:
      enabled: true
      minReplicaCount: 1
      maxReplicaCount: 10
      # cron needs no network and no external metric source. The window runs
      # 00:00–23:59 UTC: a run started in the 23:59–00:00 minute would find the
      # trigger inactive and the scale-to-3 assertion would fail.
      triggers:
        - type: cron
          metadata:
            timezone: UTC
            start: "0 0 * * *"
            end: "59 23 * * *"
            desiredReplicas: "3"
          authenticationRef:
            name: e2e-auth

  # Every shape of Service port the chart supports, on one pod. The container
  # listens on nothing — endpoints depend on pod readiness and on targetPort
  # resolving, not on anything being bound, so busybox is enough to tell a
  # resolved port from a dangling one.
  web:
    image: busybox:1.36
    command: ["sh", "-c"]
    args: ["sleep 3600"]
    replicaCount: 1
    service:
      # Numeric targetPort differing from the Service port: the reported bug.
      # The container port must follow targetPort, not port.
      port: 80
      portName: api
      targetPort: 8080
      extraPorts:
        # Numeric: declared on the container under this entry's name.
        - name: metrics
          port: 9090
          targetPort: 9090
        # Named: resolves only because the entry above declares "metrics".
        - name: metrics-alias
          port: 9191
          targetPort: metrics

hooks:
  # Lists ConfigMaps with the pod's own token: 403 without the Role copy, and
  # the pod never schedules without the SA copy (ADR 0010). curl, not busybox:
  # busybox 1.36's built-in TLS dies with SIGPIPE on amd64, so the hook failed
  # in CI whatever the RBAC said, while passing on arm64
  pre-install:
    rbac-read:
      image: curlimages/curl:8.16.0
      serviceAccountName: e2e-hook-reader
      activeDeadlineSeconds: 120
      command: ["sh", "-c"]
      args: ['d=/var/run/secrets/kubernetes.io/serviceaccount; curl -sSf -o /dev/null --cacert $d/ca.crt -H "Authorization: Bearer $(cat $d/token)" "https://kubernetes.default.svc/api/v1/namespaces/$(cat $d/namespace)/configmaps"']
  pre-upgrade:
    rbac-read:
      image: curlimages/curl:8.16.0
      serviceAccountName: e2e-hook-reader
      activeDeadlineSeconds: 120
      command: ["sh", "-c"]
      args: ['d=/var/run/secrets/kubernetes.io/serviceaccount; curl -sSf -o /dev/null --cacert $d/ca.crt -H "Authorization: Bearer $(cat $d/token)" "https://kubernetes.default.svc/api/v1/namespaces/$(cat $d/namespace)/configmaps"']
  # Also reads the ExternalSecret: pre-rollback is a copy phase for the
  # ExternalSecret copy (ADR 0007) as well as the rbacs.roles one (issue #143)
  pre-rollback:
    rbac-read:
      image: curlimages/curl:8.16.0
      serviceAccountName: e2e-hook-reader
      activeDeadlineSeconds: 120
      externalSecrets:
        - name: e2e-env
      command: ["sh", "-c"]
      args: ['[ "$E2E_TOKEN" = s3cr3t ] || exit 1; d=/var/run/secrets/kubernetes.io/serviceaccount; curl -sSf -o /dev/null --cacert $d/ca.crt -H "Authorization: Bearer $(cat $d/token)" "https://kubernetes.default.svc/api/v1/namespaces/$(cat $d/namespace)/configmaps"']
  post-install:
    notify:
      image: busybox:1.36
      command: ["sh", "-c"]
      args: ["echo notified"]
  # Runs after Helm has deleted the real ExternalSecret, and the GC its Secret:
  # only the hook copy can feed it. A failure here fails `helm uninstall`.
  post-delete:
    farewell:
      image: busybox:1.36
      activeDeadlineSeconds: 120
      command: ["sh", "-c"]
      args: ['[ "$E2E_TOKEN" = s3cr3t ]']
      externalSecrets:
        - name: e2e-env
    # Runs after Helm has deleted the real SA, Role and RoleBinding: without
    # the copies the pod never schedules, or its call is forbidden (ADR 0010)
    rbac-read:
      image: curlimages/curl:8.16.0
      serviceAccountName: e2e-hook-reader
      activeDeadlineSeconds: 120
      command: ["sh", "-c"]
      args: ['d=/var/run/secrets/kubernetes.io/serviceaccount; curl -sSf -o /dev/null --cacert $d/ca.crt -H "Authorization: Bearer $(cat $d/token)" "https://kubernetes.default.svc/api/v1/namespaces/$(cat $d/namespace)/configmaps"']

# No serviceAccount key on purpose: the chart must create the SA the pod
# references. Suspended — nothing here needs it to actually run.
cronJobs:
  cleanup:
    image: busybox:1.36
    schedule: "0 0 1 1 *"
    suspend: true
    command: ["sh", "-c"]
    args: ["true"]
