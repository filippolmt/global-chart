# End-to-end scenario for `make e2e` — runs against a throwaway kind cluster.
#
# Deliberately small and image-light (busybox only) because this is the one
# scenario that actually installs: it verifies the hook lifecycle, which
# helm-unittest cannot see (it renders YAML, it does not run Helm).
#
# Covers:
# - a pre-install hook bound to a chart-created ServiceAccount (issue #71):
#   the SA is a normal resource, created AFTER pre-install hooks, so the chart
#   must emit a hook-prerequisite copy or the Job can never schedule
# - the prereq ConfigMap/Secret copies feeding the hook's env
# - deployment-level command/args (issue #72)
# - a root-level hook, which creates its own ServiceAccount
# - Service target ports actually resolving to container ports (issue #82). This
#   is the only check that can see it: a targetPort naming a port nothing
#   declares renders valid YAML and passes kubeconform, and Kubernetes creates
#   the Service without complaint — the port just never gets an endpoint. Only a
#   live endpoints controller reveals it.
# - a KEDA-scaled deployment: only the CRDs are installed, no operator, so what
#   is asserted is the chart's own invariant — with an autoscaler owning
#   spec.replicas, `helm upgrade` must not reset the live replica count
kedaTriggerAuthentications:
  e2e-auth:
    secretTargetRef:
      - parameter: username
        name: e2e-keda-credentials
        key: username

deployments:
  app:
    image: busybox:1.36
    command: ["sh", "-c"]
    args: ["sleep 3600"]
    replicaCount: 1
    # No targetPort: it defaults to portName, so the Service targets "admin" and
    # the container port is named "admin". Defaulting to the literal "http", as
    # the chart used to, left this Service with no endpoints at all.
    service:
      port: 8081
      portName: admin
    serviceAccount:
      create: true
      annotations:
        e2e/marker: chart-created
    configMap:
      FOO: bar
    secret:
      DB_PASSWORD: supersecret
    hooks:
      # The hook asserts the values rather than echoing them: `echo` exits 0
      # whatever the env holds, so an empty FOO would still have marked the Job
      # succeeded. A non-zero exit here fails the hook, and with it the release.
      pre-install:
        migration:
          command: ["sh", "-c"]
          args: ['[ "$FOO" = bar ] && [ "$DB_PASSWORD" = supersecret ]']
        # Negative weight on purpose. minJobWeight becomes -5, so the derived
        # prereq ConfigMap/Secret land at -12 and the SA copy at -10. Were those
        # ever floored at 0 they would sort AFTER this Job, which would then
        # start without the ConfigMap it reads. Guards the weight invariant in
        # CLAUDE.md pattern 6 at runtime, where helm-unittest cannot see it.
        early:
          weight: "-5"
          command: ["sh", "-c"]
          args: ['[ "$FOO" = bar ]']
      pre-upgrade:
        migration:
          command: ["sh", "-c"]
          args: ['[ "$FOO" = bar ]']

  worker:
    image: busybox:1.36
    command: ["sh", "-c"]
    args: ["sleep 3600"]
    service:
      enabled: false
    keda:
      enabled: true
      minReplicaCount: 1
      maxReplicaCount: 10
      # cron needs no network and no external metric source. The window runs
      # 00:00–23:59 UTC: a run started in the 23:59–00:00 minute would find the
      # trigger inactive and the scale-to-3 assertion would fail.
      triggers:
        - type: cron
          metadata:
            timezone: UTC
            start: "0 0 * * *"
            end: "59 23 * * *"
            desiredReplicas: "3"
          authenticationRef:
            name: e2e-auth

  # Every shape of Service port the chart supports, on one pod. The container
  # listens on nothing — endpoints depend on pod readiness and on targetPort
  # resolving, not on anything being bound, so busybox is enough to tell a
  # resolved port from a dangling one.
  web:
    image: busybox:1.36
    command: ["sh", "-c"]
    args: ["sleep 3600"]
    replicaCount: 1
    service:
      # Numeric targetPort differing from the Service port: the reported bug.
      # The container port must follow targetPort, not port.
      port: 80
      portName: api
      targetPort: 8080
      extraPorts:
        # Numeric: declared on the container under this entry's name.
        - name: metrics
          port: 9090
          targetPort: 9090
        # Named: resolves only because the entry above declares "metrics".
        - name: metrics-alias
          port: 9191
          targetPort: metrics

hooks:
  post-install:
    notify:
      image: busybox:1.36
      command: ["sh", "-c"]
      args: ["echo notified"]
