# The store the e2e ExternalSecrets read from, applied by `make kind-eso`. The
# fake provider serves these values from its own spec: no network, no cloud
# account, and ESO still runs its real reconcile loop — which is what the hook
# copy of ADR 0007 needs to prove, the Secret appearing while the hook waits.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: e2e-fake
spec:
  provider:
    fake:
      data:
        - key: e2e/token
          value: s3cr3t
        - key: e2e/conf
          value: conf
