# ExternalSecrets only - no deployments
deployments: {}
externalSecrets:
  # Single-key form (one remote key -> one Secret key)
  app-config:
    secretkey: app-config
    remote:
      key: "apps/prod/config"
    secretstore:
      kind: ClusterSecretStore
      name: default-store
  # data list form: many keys collapsed into one Secret
  app:
    secretstore:
      kind: ClusterSecretStore
      name: default-store
    refreshInterval: 1h
    target:
      name: app-secrets
    data:
      - secretkey: DB_PASSWORD
        remote:
          key: MY_DB_PASSWORD
      - secretkey: API_TOKEN
        remote:
          key: MY_API_TOKEN
  # property/version: one key out of a JSON bundle, at a pinned version
  app-bundle:
    secretstore:
      kind: ClusterSecretStore
      name: default-store
    data:
      - secretkey: DB_PASSWORD
        remote:
          key: apps/prod/bundle
          property: db_password
      - secretkey: API_TOKEN
        remote:
          key: apps/prod/bundle
          property: api_token
          version: "3"
  # dataFrom form: extract / find
  app-bulk:
    secretstore:
      kind: ClusterSecretStore
      name: default-store
    dataFrom:
      - find:
          name:
            regexp: "^APP_.*"
  # generator form: the value is produced by an ESO generator, so there is no
  # store to point at and secretstore is omitted
  basicauth:
    dataFrom:
      - sourceRef:
          generatorRef:
            apiVersion: generators.external-secrets.io/v1alpha1
            kind: Password
            name: stage-basicauth
    target:
      immutable: false
      template:
        engineVersion: v2
        data:
          .htpasswd: '{{ htpasswd "stage" .password "bcrypt" }}'
  # data + dataFrom together (both rendered, ESO supports both)
  app-mixed:
    secretstore:
      kind: ClusterSecretStore
      name: default-store
    data:
      - secretkey: EXTRA_TOKEN
        remote:
          key: MY_EXTRA_TOKEN
    dataFrom:
      - extract:
          key: shared/app
