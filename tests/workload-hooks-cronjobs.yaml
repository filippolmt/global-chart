# Test: Hooks and CronJobs inside workloads
# Tests that hooks and cronJobs defined inside workloads inherit:
# - image
# - configMap (envFrom)
# - secret (envFrom)
# - serviceAccount
# - nodeSelector, tolerations, affinity
# - imagePullSecrets, hostAliases
# - envFromConfigMaps, envFromSecrets, additionalEnvs
# - global.imagePullSecrets, in both forms
# and that a job's own serviceAccount and tolerations replace the workload's
# (seed-queues, queue-audit), and a root job's own serviceAccount (issue #320)

global:
  imagePullSecrets:
    - global-registry
    - name: global-mirror

workloads:
  # Backend workload with hooks and cronJobs inside
  backend:
    replicaCount: 2
    image:
      repository: myapp/backend
      tag: "v2.0.0"
      pullPolicy: IfNotPresent

    imagePullSecrets:
      - name: registry-secret
      # The string form, which the schema accepts beside the map (issue #235)
      - mirror-secret

    serviceAccount:
      create: true
      name: backend-sa
      annotations:
        eks.amazonaws.com/role-arn: arn:aws:iam::123456789:role/backend-role

    service:
      port: 3000

    configMap:
      DB_HOST: postgres.db.svc
      DB_PORT: "5432"
      DB_NAME: myapp
      LOG_LEVEL: info
      # non-string values: the branch that renders through toYaml, at both the real
      # ConfigMap and its hook-prerequisite copy
      pool.yaml:
        min: 2
        max: 10
      FEATURE_FLAGS:
        - tracing
        - retries

    secret:
      DB_PASSWORD: supersecret123
      API_KEY: apikey456
      # non-string value: toYaml | b64enc, real Secret and prerequisite copy alike
      tls.yaml:
        verify: true

    envFromConfigMaps:
      - shared-config
    envFromSecrets:
      - shared-secrets

    additionalEnvs:
      - name: POD_NAME
        valueFrom:
          fieldRef:
            fieldPath: metadata.name

    nodeSelector:
      node-type: backend

    tolerations:
      - key: "workload"
        operator: "Equal"
        value: "backend"
        effect: "NoSchedule"
      - key: "node.kubernetes.io/unreachable"
        operator: "Exists"
        effect: "NoExecute"
        tolerationSeconds: 300

    # Hooks inside workload - inherit everything from parent
    hooks:
      pre-upgrade:
        migrate:
          command: ["./migrate", "up"]
          weight: "5"
          deletePolicy: before-hook-creation
          # Additional env only for this hook
          env:
            - name: MIGRATION_DRY_RUN
              value: "false"
          # A native sidecar: the hook's own, never the workload's extraInitContainers
          initContainers:
            - name: db-proxy
              image: busybox:1.36
              restartPolicy: Always
              command: ["sleep", "infinity"]
              env:
                - name: PROXY_PORT
                  value: "5432"
                - name: POD_NAME
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.name
              volumeMounts:
                - name: proxy-socket
                  mountPath: /cloudsql
          volumes:
            - name: proxy-socket
              emptyDir: {}

      post-upgrade:
        warm-cache:
          command: ["./warm-cache.sh"]
          weight: "10"
          resources:
            requests:
              cpu: 200m
              memory: 256Mi

    # CronJobs inside workload - inherit everything from parent
    cronJobs:
      db-backup:
        schedule: "0 2 * * *"
        command: ["./backup.sh"]
        args: ["--full"]
        successfulJobsHistoryLimit: 3
        failedJobsHistoryLimit: 1
        # The cronjob's own, never inherited (issue #282): exit 42 is a bug
        # retries cannot fix; a preempted pod is retried without spending backoffLimit
        podFailurePolicy:
          rules:
            - action: FailJob
              onExitCodes:
                containerName: db-backup
                operator: In
                values: [42]
            # An init container is a container of the Job's pod too (issue #285)
            - action: FailJob
              onExitCodes:
                containerName: wait-for-db
                operator: In
                values: [1, 2]
            - action: Ignore
              onPodConditions:
                - type: DisruptionTarget
                  status: "True"
        # The cronjob's own: never the workload's extraInitContainers
        initContainers:
          - name: wait-for-db
            image: busybox:1.36
            command: ["sh", "-c", "until nc -z $DB_HOST 5432; do sleep 2; done"]
            env:
              - name: DB_HOST
                value: postgres.db.svc
              - name: POD_NAME
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.name
            volumeMounts:
              - name: backup-scratch
                mountPath: /scratch
        volumes:
          - name: backup-scratch
            emptyDir: {}

      cleanup:
        schedule: "0 4 * * *"
        command: ["./cleanup.sh"]
        args: ["--older-than", "7d"]
        # Override resources for this specific cronjob
        resources:
          requests:
            cpu: 50m
            memory: 64Mi

  # Worker workload with different config
  worker:
    replicaCount: 1
    image: myapp/worker:v2.0.0

    serviceAccount:
      create: true

    service:
      enabled: false

    configMap:
      QUEUE_URL: redis://redis:6379
      CONCURRENCY: "5"

    secret:
      QUEUE_PASSWORD: queuepass

    tolerations:
      - key: "workload"
        operator: "Equal"
        value: "worker"
        effect: "NoSchedule"

    # Worker hooks
    hooks:
      post-install:
        init-queues:
          command: ["./init-queues.sh"]
          weight: "5"
        # Its own ServiceAccount, created, and tolerations, replacing the worker's (issue #320)
        seed-queues:
          command: ["./seed-queues.sh"]
          serviceAccount:
            create: true
            name: queue-admin
            annotations:
              example.com/role: queue-admin
          tolerations:
            - key: node.kubernetes.io/not-ready
              operator: Exists
              effect: NoExecute
              tolerationSeconds: 60

    # Worker cronjobs
    cronJobs:
      queue-cleanup:
        schedule: "0 */6 * * *"
        command: ["./queue-cleanup.sh"]
        args: ["--stale"]
      # An existing ServiceAccount (create: false), and tolerations replacing the worker's (issue #320)
      queue-audit:
        schedule: "30 3 * * *"
        command: ["./queue-audit.sh"]
        serviceAccount:
          create: false
          name: queue-auditor
        tolerations:
          - key: node.kubernetes.io/unreachable
            operator: Exists
            effect: NoExecute
            tolerationSeconds: 120

# Root-level hooks (standalone, must specify image or fromWorkload)
hooks:
  post-upgrade:
    notify:
      image: curlimages/curl:latest
      command: ["curl", "-X", "POST"]
      args: ["-d", '{"text":"Deployment complete"}', "https://hooks.slack.com/xxx"]
      weight: "100"
      # A native sidecar: the Job completes when the main container exits (issue #262)
      initContainers:
        - name: log-shipper
          image: busybox:1.36
          restartPolicy: Always
          command: ["sleep", "infinity"]
          env:
            - name: SHIP_TO
              value: https://logs.example.com
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          volumeMounts:
            - name: logs
              mountPath: /var/log/notify
      volumes:
        - name: logs
          emptyDir: {}
    # A ServiceAccount of its own, by name (issue #320)
    audit:
      image: curlimages/curl:latest
      command: ["curl", "https://audit.example.com/deployed"]
      serviceAccount:
        create: true
        name: auditor
        annotations:
          example.com/role: auditor

# Root-level cronJobs (standalone, must specify image or fromWorkload)
cronJobs:
  # A ServiceAccount of its own, by name (issue #320)
  usage-export:
    schedule: "0 2 * * *"
    image: myapp/reports:latest
    command: ["export-usage"]
    serviceAccount:
      create: true
      name: report-reader
      annotations:
        example.com/role: report-reader
  report-generator:
    schedule: "0 8 * * 1"
    image: myapp/reports:latest
    command: ["generate-report"]
    args: ["--weekly"]
    initContainers:
      - name: fetch-templates
        image: busybox:1.36
        command: ["sh", "-c", "echo fetching from $TEMPLATES_URL"]
        env:
          - name: TEMPLATES_URL
            value: https://templates.example.com
          - name: POD_NAME
            valueFrom:
              fieldRef:
                fieldPath: metadata.name
        volumeMounts:
          - name: templates
            mountPath: /templates
    volumes:
      - name: templates
        emptyDir: {}
