# Test deployment with multi-port Service (Odoo HTTP + gevent pattern, see issue #52)
deployments:
  odoo:
    image:
      repository: odoo
      tag: "17"
    service:
      type: ClusterIP
      port: 8069
      targetPort: 8069
      portName: odoo
      protocol: TCP
      extraPorts:
        - name: gevent
          port: 8072
          targetPort: 8072
          protocol: TCP
          appProtocol: http
        # Numeric targetPort: the container declares port 9090 under this entry's
        # name, so `metrics` becomes a name other ports may target.
        - name: metrics
          port: 9090
          targetPort: 9090
          protocol: TCP
        # Named targetPort, resolving against the entry above.
        - name: metrics-alias
          port: 9191
          targetPort: metrics
          protocol: TCP
