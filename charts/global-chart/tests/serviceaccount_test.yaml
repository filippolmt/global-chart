suite: serviceaccount template tests
templates:
  - templates/serviceaccount.yaml
tests:
  # ====== Workload enabled flag ======
  - it: should not render serviceaccount when workload enabled is false
    set:
      workloads:
        main:
          enabled: false
          image: nginx:1.25
    asserts:
      - hasDocuments:
          count: 0

  - it: should create serviceaccount by default
    set:
      workloads:
        main:
          image: nginx:1.25
    asserts:
      - isKind:
          of: ServiceAccount
      - matchRegex:
          path: metadata.name
          pattern: ".*main.*"

  - it: should not create serviceaccount when create is false
    set:
      workloads:
        main:
          image: nginx:1.25
          serviceAccount:
            create: false
    asserts:
      - hasDocuments:
          count: 0

  - it: should set automountServiceAccountToken to true by default
    set:
      workloads:
        main:
          image: nginx:1.25
    asserts:
      - equal:
          path: automountServiceAccountToken
          value: true

  - it: should respect automount false
    set:
      workloads:
        main:
          image: nginx:1.25
          serviceAccount:
            create: true
            automount: false
    asserts:
      - equal:
          path: automountServiceAccountToken
          value: false

  - it: should render annotations when provided
    set:
      workloads:
        main:
          image: nginx:1.25
          serviceAccount:
            create: true
            annotations:
              eks.amazonaws.com/role-arn: arn:aws:iam::role/my-role
    asserts:
      - equal:
          path: metadata.annotations["eks.amazonaws.com/role-arn"]
          value: "arn:aws:iam::role/my-role"

  - it: should set namespace
    set:
      workloads:
        main:
          image: nginx:1.25
    asserts:
      - isNotEmpty:
          path: metadata.namespace

  # The hook-prerequisite copy (#71) lives in hook.yaml; the normal SA must stay
  # a plain, unannotated resource so Helm still owns and cleans it up.
  - it: should keep the normal SA free of hook annotations when a pre-install hook exists
    set:
      workloads:
        main:
          image: nginx:1.25
          serviceAccount:
            create: true
          hooks:
            pre-install:
              migration:
                command: ["./migrate.sh"]
    asserts:
      - hasDocuments:
          count: 1
      - isNull:
          path: metadata.annotations
      - equal:
          path: automountServiceAccountToken
          value: true

  - it: should create multiple SAs for multiple workloads
    set:
      workloads:
        frontend:
          image: nginx:1.25
        backend:
          image: myapp:v1
    asserts:
      - hasDocuments:
          count: 2

  # ====== global.commonAnnotations ======
  - it: should merge serviceAccount annotations over global.commonAnnotations
    set:
      global:
        commonAnnotations:
          owner: platform
          shared: from-global
      workloads:
        main:
          image: nginx:1.25
          serviceAccount:
            annotations:
              eks.amazonaws.com/role-arn: arn:aws:iam::000000000000:role/example
              shared: from-sa
    asserts:
      - equal:
          path: metadata.annotations.shared
          value: from-sa
      - equal:
          path: metadata.annotations.owner
          value: platform
      - equal:
          path: metadata.annotations["eks.amazonaws.com/role-arn"]
          value: arn:aws:iam::000000000000:role/example

  # ====== Workload annotations stay on the workload (issue #112) ======
  - it: should not propagate the workload's own annotations to its ServiceAccount
    set:
      workloads:
        web:
          image: nginx:1.25
          annotations:
            argocd.argoproj.io/sync-wave: "1"
    asserts:
      - notExists:
          path: metadata.annotations

  # ====== Names YAML reads as another type (issue #251) ======
  - it: renders a ServiceAccount name YAML reads as a number as a string
    set:
      workloads:
        main:
          image: nginx:1.25
          serviceAccount:
            name: "1e3"
    asserts:
      - equal:
          path: metadata.name
          value: "1e3"

  # A rule that holds for every kind is tested on every kind (CODING_STANDARDS.md)
  - it: should render the ServiceAccount of a StatefulSet workload under its fullname
    set:
      workloads:
        db:
          kind: StatefulSet
          image: nginx:1.25
          serviceAccount:
            create: true
    asserts:
      - isKind:
          of: ServiceAccount
      - equal:
          path: metadata.name
          value: RELEASE-NAME-global-chart-db
