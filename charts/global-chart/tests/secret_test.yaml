suite: secret template tests
templates:
  - templates/secret.yaml
tests:
  # ====== Workload enabled flag ======
  - it: should not render secret when workload enabled is false
    set:
      workloads:
        main:
          enabled: false
          image: nginx:1.25
          secret:
            DB_PASSWORD: mysecret
    asserts:
      - hasDocuments:
          count: 0

  - it: should not render secret when not defined
    set:
      workloads:
        main:
          image: nginx:1.25
    asserts:
      - hasDocuments:
          count: 0

  - it: should render secret with string values
    set:
      workloads:
        main:
          image: nginx:1.25
          secret:
            DB_PASSWORD: mysecret
            API_KEY: mykey123
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: type
          value: Opaque
      - isNotEmpty:
          path: data.DB_PASSWORD
      - isNotEmpty:
          path: data.API_KEY

  - it: should render secret with correct name
    set:
      workloads:
        backend:
          image: nginx:1.25
          secret:
            KEY: value
    asserts:
      - matchRegex:
          path: metadata.name
          pattern: ".*backend.*"

  - it: should base64 the YAML of non-string secret values
    set:
      workloads:
        main:
          image: nginx:1.25
          secret:
            CONFIG:
              user: admin
            PORT: 8080
            DEBUG: true
    asserts:
      - equal:
          path: data.CONFIG
          value: "dXNlcjogYWRtaW4="
      - equal:
          path: data.PORT
          value: "ODA4MA=="
      - equal:
          path: data.DEBUG
          value: "dHJ1ZQ=="

  - it: should render multiple secrets for multiple workloads
    set:
      workloads:
        frontend:
          image: nginx:1.25
          secret:
            KEY1: val1
        backend:
          image: myapp:v1
          secret:
            KEY2: val2
    asserts:
      - hasDocuments:
          count: 2

  # A bare key is reparsed as a YAML 1.1 scalar on its way to the API server:
  # yes became "true" (issue #152). Keys are quoted.
  - it: should quote keys YAML 1.1 would rewrite
    set:
      workloads:
        main:
          image: nginx:1.25
          secret: { "yes": s }
    asserts:
      - equal:
          path: data
          value: { "yes": cw== }

  # A null value rendered the base64 of the string "null", read by the app as
  # its secret (issue #166). It fails like a null ConfigMap value.
  - it: should fail on a null secret value
    set:
      workloads:
        main:
          image: nginx:1.25
          secret:
            EMPTY: null
    asserts:
      - failedTemplate:
          errorPattern: "workloads.main.secret.EMPTY: a null value reached a Secret"

  # A rule that holds for every kind is tested on every kind (CODING_STANDARDS.md)
  - it: should render the Secret of a StatefulSet workload under its fullname
    set:
      workloads:
        db:
          kind: StatefulSet
          image: nginx:1.25
          secret:
            B: "2"
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: RELEASE-NAME-global-chart-db
      - equal:
          path: data.B
          value: Mg==
