suite: secret template tests
templates:
  - templates/secret.yaml
tests:
  # ====== Deployment enabled flag ======
  - it: should not render secret when deployment enabled is false
    set:
      deployments:
        main:
          enabled: false
          image: nginx:1.25
          secret:
            DB_PASSWORD: mysecret
    asserts:
      - hasDocuments:
          count: 0

  - it: should not render secret when not defined
    set:
      deployments:
        main:
          image: nginx:1.25
    asserts:
      - hasDocuments:
          count: 0

  - it: should render secret with string values
    set:
      deployments:
        main:
          image: nginx:1.25
          secret:
            DB_PASSWORD: mysecret
            API_KEY: mykey123
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: type
          value: Opaque
      - isNotEmpty:
          path: data.DB_PASSWORD
      - isNotEmpty:
          path: data.API_KEY

  - it: should render secret with correct name
    set:
      deployments:
        backend:
          image: nginx:1.25
          secret:
            KEY: value
    asserts:
      - matchRegex:
          path: metadata.name
          pattern: ".*backend.*"

  - it: should base64 the YAML of non-string secret values
    set:
      deployments:
        main:
          image: nginx:1.25
          secret:
            CONFIG:
              user: admin
            PORT: 8080
            DEBUG: true
    asserts:
      - equal:
          path: data.CONFIG
          value: "dXNlcjogYWRtaW4="
      - equal:
          path: data.PORT
          value: "ODA4MA=="
      - equal:
          path: data.DEBUG
          value: "dHJ1ZQ=="

  - it: should render multiple secrets for multiple deployments
    set:
      deployments:
        frontend:
          image: nginx:1.25
          secret:
            KEY1: val1
        backend:
          image: myapp:v1
          secret:
            KEY2: val2
    asserts:
      - hasDocuments:
          count: 2

  # A bare key is reparsed as a YAML 1.1 scalar on its way to the API server:
  # yes became "true" (issue #152). Keys are quoted.
  - it: should quote keys YAML 1.1 would rewrite
    set:
      deployments:
        main:
          image: nginx:1.25
          secret: { "yes": s }
    asserts:
      - equal:
          path: data
          value: { "yes": cw== }
