      - equal:
          path: metadata.annotations["helm.sh/hook"]
          value: "pre-install,pre-upgrade"
        documentIndex: 0

  # ====== hasKey default conversions ======
  - it: should render restartPolicy Never by default on root-level hook
    set:
      hooks:
        post-install:
          setup:
            image: busybox:1.36
            command: ["./setup.sh"]
    asserts:
      - equal:
          path: spec.template.spec.restartPolicy
          value: "Never"
        documentIndex: 1

  - it: should render deletePolicy before-hook-creation by default on root-level hook
    set:
      hooks:
        post-install:
          setup:
            image: busybox:1.36
            command: ["./setup.sh"]
    asserts:
      - equal:
          path: metadata.annotations["helm.sh/hook-delete-policy"]
          value: "before-hook-creation"
        documentIndex: 1

  # ====== Seven-category: default assertions ======

  - it: should render no nodeSelector when neither deployment nor hook sets it
    set:
      deployments:
        backend:
          image: myapp:v1
          serviceAccount:
            create: true
          hooks:
            pre-install:
              migrate:
                command: ["./migrate.sh"]
    asserts:
      # documentIndex 0 is the hook-prerequisite copy of the deployment SA (#71)
      - isKind:
          of: Job
        documentIndex: 1
      - isNull:
          path: spec.template.spec.nodeSelector
        documentIndex: 1

  # ====== Hook prerequisite partial tests ======

  - it: should not create prerequisite ConfigMap when deployment has no configMap
    set:
      deployments:
        backend:
          image: myapp:v2
          serviceAccount:
            create: true
          secret:
            DB_PASSWORD: secret123
          hooks:
            pre-install:
              migrate:
                command: ["./migrate.sh"]
    asserts:
      # Documents: Secret prereq (0), SA copy (1), Job (2) — no ConfigMap prereq
      - hasDocuments:
          count: 3
      - isKind:
          of: Secret
        documentIndex: 0
      - isKind:
          of: ServiceAccount
        documentIndex: 1
      - isKind:
          of: Job
        documentIndex: 2

  - it: should create only ConfigMap prereq when deployment has configMap but no secret
    set:
      deployments:
        backend:
          image: myapp:v2
          serviceAccount:
            create: true
          configMap:
            DB_HOST: postgres
          hooks:
            pre-install:
              migrate:
                command: ["./migrate.sh"]
    asserts:
      # Documents: ConfigMap prereq (0), SA copy (1), Job (2) — no Secret prereq
      - hasDocuments:
          count: 3
      - isKind:
          of: ConfigMap
        documentIndex: 0
      - equal:
          path: metadata.annotations["helm.sh/hook"]
          value: "pre-install"
        documentIndex: 0
      - isKind:
          of: ServiceAccount
        documentIndex: 1
      - isKind:
          of: Job
        documentIndex: 2

  - it: should create only Secret prereq when deployment has secret but no configMap
    set:
      deployments:
        backend:
          image: myapp:v2
          serviceAccount:
            create: true
          secret:
            DB_PASSWORD: secret123
          hooks:
            pre-install:
              migrate:
                command: ["./migrate.sh"]
    asserts:
      # Documents: Secret prereq (0), SA copy (1), Job (2) — no ConfigMap prereq
      - hasDocuments:
          count: 3
      - isKind:
          of: Secret
        documentIndex: 0
      - equal:
          path: metadata.annotations["helm.sh/hook"]
          value: "pre-install"
        documentIndex: 0
      - isKind:
          of: ServiceAccount
        documentIndex: 1
      - isKind:
          of: Job
        documentIndex: 2

  - it: should share single prereq set across multiple hook commands
    set:
      deployments:
        backend:
          image: myapp:v2
          serviceAccount:
            create: true
          configMap:
            DB_HOST: postgres
          secret:
            DB_PASSWORD: secret123
          hooks:
            pre-install:
              migrate:
                command: ["./migrate.sh"]
              seed:
                command: ["./seed.sh"]
    asserts:
      # Documents: ConfigMap prereq (0), Secret prereq (1), SA copy (2),
      # Job migrate (3), Job seed (4)
      # Only 1 ConfigMap + 1 Secret prereq and 1 SA copy, NOT 2 each
      - hasDocuments:
          count: 5
      - isKind:
          of: ConfigMap
        documentIndex: 0
      - isKind:
          of: Secret
        documentIndex: 1
      - isKind:
          of: ServiceAccount
        documentIndex: 2
      - isKind:
          of: Job
        documentIndex: 3
      - isKind:
          of: Job
        documentIndex: 4

  # Full weight ordering with a negative Job weight: prereq (w-7) < SA (w-5) < Job (w).
  # Flooring any of the three at 0 would sort it after the Job.
  - it: should keep the prereq/SA/Job weight ordering for a negative hook weight
    set:
      deployments:
        backend:
          image: myapp:v2
          serviceAccount:
            create: true
          configMap:
            DB_HOST: postgres
          hooks:
            pre-install:
              migrate:
                command: ["./migrate.sh"]
                weight: -3
    asserts:
      - equal:
          path: metadata.annotations["helm.sh/hook-weight"]
          value: "-10"
        documentIndex: 0
      - equal:
          path: metadata.annotations["helm.sh/hook-weight"]
          value: "-8"
        documentIndex: 1
      - equal:
          path: metadata.annotations["helm.sh/hook-weight"]
          value: "-3"
        documentIndex: 2

  # Same for a root-level hook, whose SA is created at w-5 by PART 1
  - it: should keep the root-level hook SA below its Job for a negative weight
    set:
      hooks:
        pre-install:
          migrate:
            image: myapp:v1
            command: ["./migrate.sh"]
            weight: -3
    asserts:
      - isKind:
          of: ServiceAccount
        documentIndex: 0
      - equal:
          path: metadata.annotations["helm.sh/hook-weight"]
          value: "-8"
        documentIndex: 0
      - equal:
          path: metadata.annotations["helm.sh/hook-weight"]
          value: "-3"
        documentIndex: 1

  # Hook resources are not part of the release manifest, so Helm never removes
  # them at uninstall. Plumbing resources (prereq ConfigMap/Secret, created SAs)
  # therefore clean themselves up with hook-succeeded; Jobs deliberately do not,
  # they are the record of what ran.
  - it: should clean up prereq ConfigMap and Secret after the hook phase
    set:
      deployments:
        backend:
          image: myapp:v2
          serviceAccount:
            create: true
          configMap:
            DB_HOST: postgres
          secret:
            DB_PASSWORD: secret123
          hooks:
            post-install:
              migrate:
                command: ["./migrate.sh"]
    asserts:
      - isKind:
          of: ConfigMap
        documentIndex: 0
      - equal:
          path: metadata.annotations["helm.sh/hook-delete-policy"]
          value: "before-hook-creation,hook-succeeded"
        documentIndex: 0
      - isKind:
          of: Secret
        documentIndex: 1
      - equal:
          path: metadata.annotations["helm.sh/hook-delete-policy"]
          value: "before-hook-creation,hook-succeeded"
        documentIndex: 1
      # the Job keeps the old default: a completed hook Job is the audit trail
      - isKind:
          of: Job
        documentIndex: 2
      - equal:
          path: metadata.annotations["helm.sh/hook-delete-policy"]
          value: "before-hook-creation"
        documentIndex: 2

  - it: should clean up a created root-level hook SA after the hook phase
    set:
      hooks:
        post-install:
          migrate:
            image: myapp:v1
            command: ["./migrate.sh"]
    asserts:
      - isKind:
          of: ServiceAccount
        documentIndex: 0
      - equal:
          path: metadata.annotations["helm.sh/hook-delete-policy"]
          value: "before-hook-creation,hook-succeeded"
        documentIndex: 0

  - it: should let deletePolicy override the SA cleanup default
    set:
      hooks:
        post-install:
          migrate:
            image: myapp:v1
            command: ["./migrate.sh"]
            deletePolicy: hook-failed
    asserts:
      - equal:
          path: metadata.annotations["helm.sh/hook-delete-policy"]
          value: "hook-failed"
        documentIndex: 0
      - equal:
          path: metadata.annotations["helm.sh/hook-delete-policy"]
          value: "hook-failed"
        documentIndex: 1

  # ====== global.commonLabels ======
  - it: should render global.commonLabels on hook job metadata
    set:
      global:
        commonLabels:
          team: platform
      hooks:
        post-install:
          migrate:
            image: myapp:v1
            command: ["./migrate.sh"]
    asserts:
      - equal:
          path: metadata.labels.team
          value: platform
        documentIndex: 1

  # ====== Negative tests: fail/required paths ======

  # ====== dnsConfig NOT inherited in deployment-level hooks ======
  - it: should not inherit dnsConfig from deployment in deployment-level hook
    set:
      deployments:
        backend:
          image: myapp:v2
          dnsConfig:
            nameservers:
              - 8.8.8.8
          hooks:
            post-upgrade:
              migrate:
                command: ["./migrate.sh"]
    documentIndex: 0
    asserts:
      - isKind:
          of: Job
      - isNull:
          path: spec.template.spec.dnsConfig

  # ====== restartPolicy null-safe ======
  - it: should default restartPolicy to Never for root-level hook
    set:
      hooks:
        post-install:
          migrate:
            image: myapp:v2
            command: ["./migrate.sh"]
    documentIndex: 1
    asserts:
      - equal:
          path: spec.template.spec.restartPolicy
          value: Never

  - it: should fail when root-level hook has no image and no fromDeployment
    set:
      hooks:
        post-install:
          migrate:
            command: ["./run.sh"]
    asserts:
      - failedTemplate:
          errorPattern: "image is required for hooks.post-install.migrate"

  # ====== Root-level SA parity with root-level cronJobs (see cronjob_test.yaml) ======
  - it: should create the ServiceAccount the pod references when root hook sets none
    release:
      name: t
    set:
      hooks:
        pre-install:
          cleanup:
            image: busybox:1.36
    asserts:
      - hasDocuments:
          count: 2
      - equal:
          path: metadata.name
          value: t-global-chart-pre-install-cleanup
        documentSelector:
          path: kind
          value: ServiceAccount
      - equal:
          path: spec.template.spec.serviceAccountName
          value: t-global-chart-pre-install-cleanup
        documentSelector:
          path: kind
          value: Job

  - it: should honor serviceAccount.name on a root-level hook
    set:
      hooks:
        pre-install:
          cleanup:
            image: busybox:1.36
            serviceAccount:
              name: existing-sa
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Job
      - equal:
          path: spec.template.spec.serviceAccountName
          value: existing-sa

  - it: should honor serviceAccount.automount on a created root-level hook SA
    set:
      hooks:
        pre-install:
          cleanup:
            image: busybox:1.36
            serviceAccount:
              automount: false
    asserts:
      - equal:
          path: automountServiceAccountToken
          value: false
        documentSelector:
          path: kind
          value: ServiceAccount

  - it: should leave the pod on the namespace default SA when create is false and nothing names one
    set:
      hooks:
        pre-install:
          cleanup:
            image: busybox:1.36
            serviceAccount:
              create: false
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Job
      # Not the generated name: nothing would create it, and the pod would never
      # schedule. No name at all means the namespace default.
      - isNull:
          path: spec.template.spec.serviceAccountName

  - it: should create the SA under an explicit serviceAccountName when create is true
    set:
      hooks:
        pre-install:
          cleanup:
            image: busybox:1.36
            serviceAccountName: custom-sa
            serviceAccount:
              create: true
    asserts:
      - hasDocuments:
          count: 2
      - equal:
          path: metadata.name
          value: custom-sa
        documentSelector:
          path: kind
          value: ServiceAccount
      - equal:
          path: spec.template.spec.serviceAccountName
          value: custom-sa
        documentSelector:
          path: kind
          value: Job

  - it: should create the deployment-level hook SA under an explicit serviceAccountName
    set:
      deployments:
        backend:
          image: myapp:v1
          hooks:
            pre-install:
              migrate:
                command: ["./migrate.sh"]
                serviceAccountName: custom-hook-sa
                serviceAccount:
                  create: true
    asserts:
      - equal:
          path: metadata.name
          value: custom-hook-sa
        documentSelector:
          path: kind
          value: ServiceAccount
      - equal:
          path: spec.template.spec.serviceAccountName
          value: custom-hook-sa
        documentSelector:
          path: kind
          value: Job

  # ====== hookAnnotations role table ======
  # One render covering all four roles of the helper. Both hooks carry an
  # explicit deletePolicy: it reaches the resources they own (their Job, and the
  # ServiceAccount the chart creates for one of them) and never reaches the
  # plumbing copies, which keep the fixed policy of their role. The plumbing
  # roles are called with a weight and no command, so the assertion is on what
  # renders, not on a flag inside the helper.
  - it: should apply the hookAnnotations role table to every hook resource
    set:
      deployments:
        backend:
          image: myapp:v2
          serviceAccount:
            create: true
          configMap:
            DB_HOST: postgres
          secret:
            DB_PASSWORD: secret123
          hooks:
            pre-install:
              migrate:
                command: ["./migrate.sh"]
                deletePolicy: hook-failed
            post-install:
              notify:
                command: ["./notify.sh"]
                deletePolicy: hook-failed
                serviceAccount:
                  create: true
    asserts:
      # role prereq: w-7, fixed policy, explicit deletePolicy ignored
      - isKind:
          of: ConfigMap
        documentIndex: 0
      - equal:
          path: metadata.annotations["helm.sh/hook-weight"]
          value: "3"
        documentIndex: 0
      - equal:
          path: metadata.annotations["helm.sh/hook-delete-policy"]
          value: before-hook-creation,hook-succeeded
        documentIndex: 0
      - isKind:
          of: Secret
        documentIndex: 1
      - equal:
          path: metadata.annotations["helm.sh/hook-weight"]
          value: "3"
        documentIndex: 1
      - equal:
          path: metadata.annotations["helm.sh/hook-delete-policy"]
          value: before-hook-creation,hook-succeeded
        documentIndex: 1
      # role pre-install-sa: w-5, fixed policy, explicit deletePolicy ignored
      - isKind:
          of: ServiceAccount
        documentIndex: 2
      - equal:
          path: metadata.annotations["helm.sh/hook"]
          value: pre-install
        documentIndex: 2
      - equal:
          path: metadata.annotations["helm.sh/hook-weight"]
          value: "5"
        documentIndex: 2
      - equal:
          path: metadata.annotations["helm.sh/hook-delete-policy"]
          value: hook-succeeded,hook-failed
        documentIndex: 2
      # role sa: w-5, explicit deletePolicy honoured
      - isKind:
          of: ServiceAccount
        documentIndex: 3
      - equal:
          path: metadata.annotations["helm.sh/hook"]
          value: post-install
        documentIndex: 3
      - equal:
          path: metadata.annotations["helm.sh/hook-weight"]
          value: "5"
        documentIndex: 3
      - equal:
          path: metadata.annotations["helm.sh/hook-delete-policy"]
          value: hook-failed
        documentIndex: 3
      # role job: w, explicit deletePolicy honoured
      - isKind:
          of: Job
        documentIndex: 4
      - equal:
          path: metadata.annotations["helm.sh/hook-weight"]
          value: "10"
        documentIndex: 4
      - equal:
          path: metadata.annotations["helm.sh/hook-delete-policy"]
          value: hook-failed
        documentIndex: 4

  # A weight the schema accepts as a string but that is not canonical must render
  # the same number on the Job and on every resource derived from it.
  - it: should coerce a non-canonical string weight consistently across roles
    set:
      deployments:
        backend:
          image: myapp:v2
          serviceAccount:
            create: true
          configMap:
            DB_HOST: postgres
          hooks:
            pre-install:
              migrate:
                command: ["./migrate.sh"]
                weight: "007"
    asserts:
      - equal:
          path: metadata.annotations["helm.sh/hook-weight"]
          value: "0"
        documentIndex: 0
      - equal:
          path: metadata.annotations["helm.sh/hook-weight"]
          value: "2"
        documentIndex: 1
      - equal:
          path: metadata.annotations["helm.sh/hook-weight"]
          value: "7"
        documentIndex: 2

  # The pre-install SA copy sorts against the hooks that actually bind the
  # deployment SA, not against every pre-install hook.
  - it: should derive the pre-install SA copy weight only from SA-binding hooks
    set:
      deployments:
        backend:
          image: myapp:v2
          serviceAccount:
            create: true
          hooks:
            pre-install:
              migrate:
                command: ["./migrate.sh"]
                weight: 4
              seed:
                command: ["./seed.sh"]
                weight: 2
                serviceAccountName: someone-elses-sa
    asserts:
      - isKind:
          of: ServiceAccount
        documentIndex: 0
      - equal:
          path: metadata.annotations["helm.sh/hook-weight"]
          value: "-1"
        documentIndex: 0

  # ====== Root-level hooks inherit nothing from deployments ======
  # Guards the omission of "deploy" in hook.yaml PART 1's jobPodSpec call: the
  # helper carries the whole inheritance chain, and only the missing key keeps
  # it inactive for root-level hooks (CLAUDE.md pattern 5, "Asymmetry").
  - it: should inherit nothing from a deployment for a root-level hook
    documentSelector:
      path: kind
      value: Job
    set:
      deployments:
        backend:
          image: myapp:v1
          imagePullSecrets:
            - name: deploy-pull-secret
          hostAliases:
            - ip: "127.0.0.1"
              hostnames:
                - "foo.local"
          podSecurityContext:
            runAsUser: 1000
          securityContext:
            readOnlyRootFilesystem: true
          dnsConfig:
            nameservers:
              - "10.0.0.1"
          nodeSelector:
            disktype: ssd
          tolerations:
            - key: "node-role"
              operator: "Exists"
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: kubernetes.io/os
                        operator: In
                        values: ["linux"]
          additionalEnvs:
            - name: FROM_DEPLOYMENT
              value: "yes"
          configMap:
            DEPLOY_KEY: deploy-value
          secret:
            DEPLOY_SECRET: deploy-secret-value
          envFromConfigMaps:
            - deploy-external-cm
          envFromSecrets:
            - deploy-external-secret
      hooks:
        post-install:
          standalone:
            image: myapp:v1
            command: ["./standalone.sh"]
    asserts:
      - isNull:
          path: spec.template.spec.imagePullSecrets
      - isNull:
          path: spec.template.spec.hostAliases
      - isNull:
          path: spec.template.spec.securityContext
      - isNull:
          path: spec.template.spec.dnsConfig
      - isNull:
          path: spec.template.spec.nodeSelector
      - isNull:
          path: spec.template.spec.tolerations
      - isNull:
          path: spec.template.spec.affinity
      - isNull:
          path: spec.template.spec.containers[0].securityContext
      - isNull:
          path: spec.template.spec.containers[0].env
      - isNull:
          path: spec.template.spec.containers[0].envFrom

  # ====== global.commonAnnotations ======
  - it: should merge hook and SA annotations over global.commonAnnotations, hook annotations last
    set:
      global:
        commonAnnotations:
          owner: platform
          shared: from-global
      hooks:
        post-install:
          migrate:
            image: myapp:v1
            command: ["./migrate.sh"]
            annotations:
              shared: from-hook
            serviceAccount:
              create: true
              annotations:
                shared: from-sa
    asserts:
      - equal:
          path: metadata.annotations.shared
          value: from-sa
        documentIndex: 0
      - equal:
          path: metadata.annotations.owner
          value: platform
        documentIndex: 0
      - equal:
          path: metadata.annotations["helm.sh/hook"]
          value: post-install
        documentIndex: 0
      - equal:
          path: metadata.annotations.shared
          value: from-hook
        documentIndex: 1
      - equal:
          path: metadata.annotations.owner
          value: platform
        documentIndex: 1
      - equal:
          path: metadata.annotations["helm.sh/hook"]
          value: post-install
        documentIndex: 1

  - it: should render annotations of a deployment-level hook on its Job
    set:
      global:
        commonAnnotations:
          shared: from-global
      deployments:
        main:
          image: nginx:1.25
          serviceAccount:
            create: false
          hooks:
            post-install:
              migrate:
                command: ["./migrate.sh"]
                annotations:
                  shared: from-hook
                  sidecar.istio.io/inject: "false"
    asserts:
      - isKind:
          of: Job
        documentIndex: 1
      - equal:
          path: metadata.annotations.shared
          value: from-hook
        documentIndex: 1
      - equal:
          path: metadata.annotations["sidecar.istio.io/inject"]
          value: "false"
        documentIndex: 1
      - equal:
          path: metadata.annotations["helm.sh/hook"]
          value: post-install
        documentIndex: 1

  - it: should drop a helm.sh/hook key coming from global.commonAnnotations
    set:
      global:
        commonAnnotations:
          helm.sh/hook-weight: "99"
          shared: from-global
      hooks:
        post-install:
          migrate:
            image: myapp:v1
            weight: 3
            command: ["./migrate.sh"]
    asserts:
      - equal:
          path: metadata.annotations["helm.sh/hook-weight"]
          value: "3"
        documentIndex: 1
      - equal:
          path: metadata.annotations.shared
          value: from-global
        documentIndex: 1

  # ====== externalSecrets references (issue #110, ADR 0007) ======
  - it: should read the hook copy of an inherited externalSecrets entry, placed with the inherited sources
    set:
      externalSecrets:
        app-env:
          secretstore: { kind: ClusterSecretStore, name: store }
          secretkey: PASSWORD
          remote: { key: app/password }
      deployments:
        app:
          image: nginx:1.25
          secret:
            TOKEN: abc
          envFromSecrets:
            - literal-secret
          externalSecrets:
            - name: app-env
          hooks:
            pre-upgrade:
              migrate:
                command: ["true"]
                envFromSecrets:
                  - job-secret
    asserts:
      - equal:
          path: spec.template.spec.containers[0].envFrom
          value:
            - secretRef:
                name: RELEASE-NAME-global-chart-app-hook-secret
            - secretRef:
                name: literal-secret
            - secretRef:
                name: RELEASE-NAME-global-chart-app-env-hook
            - secretRef:
                name: job-secret
        documentSelector:
          path: kind
          value: Job

  - it: should place a hook's own externalSecrets entries after its own envFromSecrets
    set:
      externalSecrets:
        app-env:
          secretstore: { kind: ClusterSecretStore, name: store }
          secretkey: PASSWORD
          remote: { key: app/password }
        other:
          secretstore: { kind: ClusterSecretStore, name: store }
          secretkey: PASSWORD
          remote: { key: other/password }
      deployments:
        app:
          image: nginx:1.25
          envFromSecrets:
            - literal-secret
          externalSecrets:
            - name: app-env
          hooks:
            pre-install:
              migrate:
                command: ["true"]
                envFromSecrets:
                  - job-secret
                externalSecrets:
                  - name: other
    asserts:
      - equal:
          path: spec.template.spec.containers[0].envFrom
          value:
            - secretRef:
                name: literal-secret
            - secretRef:
                name: job-secret
            - secretRef:
                name: RELEASE-NAME-global-chart-other-hook
        documentSelector:
          path: kind
          value: Job

  - it: should mount the hook copy as a volume when the entry carries a mountPath
    set:
      externalSecrets:
        app-conf:
          secretstore: { kind: ClusterSecretStore, name: store }
          secretkey: app.conf
          remote: { key: app/conf }
      hooks:
        pre-install:
          migrate:
            image: busybox:1.36
            volumes:
              - name: scratch
                emptyDir: {}
            volumeMounts:
              - name: scratch
                mountPath: /tmp
            externalSecrets:
              - name: app-conf
                mountPath: /etc/app
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].envFrom
        documentSelector:
          path: kind
          value: Job
      - equal:
          path: spec.template.spec.containers[0].volumeMounts
          value:
            - name: scratch
              mountPath: /tmp
            - name: es-app-conf
              mountPath: /etc/app
              readOnly: true
        documentSelector:
          path: kind
          value: Job
      - equal:
          path: spec.template.spec.volumes
          value:
            - name: scratch
              emptyDir: {}
            - name: es-app-conf
              secret:
                secretName: RELEASE-NAME-global-chart-app-conf-hook
        documentSelector:
          path: kind
          value: Job

  - it: should read the real Secret from a post-* hook, which runs after the ExternalSecret exists
    set:
      externalSecrets:
        app-env:
          secretstore: { kind: ClusterSecretStore, name: store }
          secretkey: PASSWORD
          remote: { key: app/password }
      hooks:
        post-install:
          notify:
            image: busybox:1.36
            externalSecrets:
              - name: app-env
    asserts:
      - equal:
          path: spec.template.spec.containers[0].envFrom
          value:
            - secretRef:
                name: RELEASE-NAME-global-chart-app-env
        documentSelector:
          path: kind
          value: Job

  - it: should read the copy of a custom target.name
    set:
      externalSecrets:
        app-env:
          secretstore: { kind: ClusterSecretStore, name: store }
          secretkey: PASSWORD
          remote: { key: app/password }
          target:
            name: my-app-env
      hooks:
        pre-install:
          migrate:
            image: busybox:1.36
            externalSecrets:
              - name: app-env
    asserts:
      - equal:
          path: spec.template.spec.containers[0].envFrom[0].secretRef.name
          value: my-app-env-hook
        documentSelector:
          path: kind
          value: Job

  - it: should fail when an externalSecrets entry names a key that externalSecrets does not define
    set:
      hooks:
        pre-install:
          migrate:
            image: busybox:1.36
            externalSecrets:
              - name: missing
    asserts:
      - failedTemplate:
          errorPattern: "hooks.pre-install.migrate.externalSecrets references 'missing', which is not a key of externalSecrets"
