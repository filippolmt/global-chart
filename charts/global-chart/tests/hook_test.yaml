suite: hook template tests
templates:
  - templates/hook.yaml
tests:
  # ====== Root-level hook basic ======
  - it: should render root-level hook with explicit image
    set:
      hooks:
        post-install:
          migrate:
            image: myapp:v1
            command: ["./migrate.sh"]
    asserts:
      - isKind:
          of: ServiceAccount
        documentIndex: 0
      - isKind:
          of: Job
        documentIndex: 1
      - equal:
          path: metadata.annotations["helm.sh/hook"]
          value: post-install
        documentIndex: 1

  - it: should render root-level hook with fromDeployment image
    set:
      deployments:
        backend:
          image: myapp:v2
      hooks:
        post-upgrade:
          migrate:
            fromDeployment: backend
            command: ["./migrate.sh"]
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: "myapp:v2"
        documentIndex: 1

  - it: should fail when fromDeployment references non-existent deployment
    set:
      deployments:
        backend:
          image: myapp:v1
      hooks:
        post-install:
          migrate:
            fromDeployment: nonexistent
            command: ["./migrate.sh"]
    asserts:
      - failedTemplate:
          errorMessage: "hooks.post-install.migrate.fromDeployment references deployment 'nonexistent' which does not exist in .Values.deployments"

  # ====== Root-level hook naming ======
  - it: should name root-level hook using hookfullname pattern
    set:
      hooks:
        post-install:
          migrate:
            image: myapp:v1
            command: ["./migrate.sh"]
    asserts:
      - equal:
          path: metadata.name
          value: RELEASE-NAME-global-chart-post-install-migrate
        documentIndex: 1

  # ====== Root-level hook annotations ======
  - it: should set default hook-weight and delete-policy
    set:
      hooks:
        post-install:
          migrate:
            image: myapp:v1
            command: ["./migrate.sh"]
    asserts:
      - equal:
          path: metadata.annotations["helm.sh/hook-weight"]
          value: "10"
        documentIndex: 1
      - equal:
          path: metadata.annotations["helm.sh/hook-delete-policy"]
          value: before-hook-creation
        documentIndex: 1

  - it: should set default SA hook-weight to 5
    set:
      hooks:
        post-install:
          migrate:
            image: myapp:v1
            command: ["./migrate.sh"]
    asserts:
      - equal:
          path: metadata.annotations["helm.sh/hook-weight"]
          value: "5"
        documentIndex: 0

  - it: should use custom weight and deletePolicy
    set:
      hooks:
        pre-install:
          setup:
            image: myapp:v1
            command: ["./setup.sh"]
            weight: "5"
            deletePolicy: hook-succeeded
    asserts:
      - equal:
          path: metadata.annotations["helm.sh/hook-weight"]
          value: "5"
        documentIndex: 1
      - equal:
          path: metadata.annotations["helm.sh/hook-delete-policy"]
          value: hook-succeeded
        documentIndex: 1

  # ====== Root-level hook SA annotations ======
  - it: should set hook type annotation on SA for root-level hook
    set:
      hooks:
        post-install:
          migrate:
            image: myapp:v1
            command: ["./migrate.sh"]
    asserts:
      - equal:
          path: metadata.annotations["helm.sh/hook"]
          value: post-install
        documentIndex: 0

  # ====== Root-level hook securityContext ======
  - it: should render podSecurityContext on root-level hook
    set:
      hooks:
        post-install:
          migrate:
            image: myapp:v1
            command: ["./migrate.sh"]
            podSecurityContext:
              runAsUser: 1000
              fsGroup: 2000
    asserts:
      - equal:
          path: spec.template.spec.securityContext.runAsUser
          value: 1000
        documentIndex: 1
      - equal:
          path: spec.template.spec.securityContext.fsGroup
          value: 2000
        documentIndex: 1

  - it: should render container securityContext on root-level hook
    set:
      hooks:
        post-install:
          migrate:
            image: myapp:v1
            command: ["./migrate.sh"]
            securityContext:
              runAsNonRoot: true
              readOnlyRootFilesystem: true
    asserts:
      - equal:
          path: spec.template.spec.containers[0].securityContext.runAsNonRoot
          value: true
        documentIndex: 1
      - equal:
          path: spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem
          value: true
        documentIndex: 1

  - it: should not render securityContext when not set on root-level hook
    set:
      hooks:
        post-install:
          migrate:
            image: myapp:v1
            command: ["./migrate.sh"]
    asserts:
      - isNull:
          path: spec.template.spec.securityContext
        documentIndex: 1
      - isNull:
          path: spec.template.spec.containers[0].securityContext
        documentIndex: 1

  # ====== Root-level hook hostAliases ======
  - it: should render hostAliases on root-level hook
    set:
      hooks:
        post-install:
          migrate:
            image: myapp:v1
            command: ["./migrate.sh"]
            hostAliases:
              - ip: "127.0.0.1"
                hostnames:
                  - "foo.local"
    asserts:
      - equal:
          path: spec.template.spec.hostAliases[0].ip
          value: "127.0.0.1"
        documentIndex: 1
      - equal:
          path: spec.template.spec.hostAliases[0].hostnames[0]
          value: "foo.local"
        documentIndex: 1

  - it: should not render hostAliases when not set on root-level hook
    set:
      hooks:
        post-install:
          migrate:
            image: myapp:v1
            command: ["./migrate.sh"]
    asserts:
      - isNull:
          path: spec.template.spec.hostAliases
        documentIndex: 1

  # ====== Root-level hook resources ======
  - it: should use default resources when not specified
    set:
      hooks:
        post-install:
          migrate:
            image: myapp:v1
            command: ["./migrate.sh"]
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources.requests.cpu
          value: 100m
        documentIndex: 1
      - equal:
          path: spec.template.spec.containers[0].resources.requests.memory
          value: 128Mi
        documentIndex: 1

  - it: should use custom resources when specified
    set:
      hooks:
        post-install:
          migrate:
            image: myapp:v1
            command: ["./migrate.sh"]
            resources:
              requests:
                cpu: 200m
                memory: 256Mi
              limits:
                cpu: 500m
                memory: 512Mi
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources.requests.cpu
          value: 200m
        documentIndex: 1
      - equal:
          path: spec.template.spec.containers[0].resources.limits.cpu
          value: 500m
        documentIndex: 1

  # ====== Root-level hook restartPolicy ======
  - it: should default restartPolicy to Never
    set:
      hooks:
        post-install:
          migrate:
            image: myapp:v1
            command: ["./migrate.sh"]
    asserts:
      - equal:
          path: spec.template.spec.restartPolicy
          value: "Never"
        documentIndex: 1

  - it: should allow custom restartPolicy
    set:
      hooks:
        post-install:
          migrate:
            image: myapp:v1
            command: ["./migrate.sh"]
            restartPolicy: OnFailure
    asserts:
      - equal:
          path: spec.template.spec.restartPolicy
          value: "OnFailure"
        documentIndex: 1

  # ====== Root-level hook command and args ======
  - it: should render command and args on root-level hook
    set:
      hooks:
        post-install:
          migrate:
            image: myapp:v1
            command: ["./migrate.sh", "--up"]
            args: ["--verbose"]
    asserts:
      - equal:
          path: spec.template.spec.containers[0].command
          value: ["./migrate.sh", "--up"]
        documentIndex: 1
      - equal:
          path: spec.template.spec.containers[0].args
          value: ["--verbose"]
        documentIndex: 1

  # ====== Root-level hook envFrom ======
  - it: should render envFrom with envFromConfigMaps and envFromSecrets on root-level hook
    set:
      hooks:
        post-install:
          migrate:
            image: myapp:v1
            command: ["./migrate.sh"]
            envFromConfigMaps:
              - my-config
            envFromSecrets:
              - my-secret
    asserts:
      - contains:
          path: spec.template.spec.containers[0].envFrom
          content:
            configMapRef:
              name: "my-config"
        documentIndex: 1
      - contains:
          path: spec.template.spec.containers[0].envFrom
          content:
            secretRef:
              name: "my-secret"
        documentIndex: 1

  # ====== Root-level hook env ======
  - it: should render env vars on root-level hook
    set:
      hooks:
        post-install:
          migrate:
            image: myapp:v1
            command: ["./migrate.sh"]
            env:
              - name: FOO
                value: bar
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: FOO
            value: bar
        documentIndex: 1

  # ====== Root-level hook imagePullSecrets ======
  - it: should render imagePullSecrets on root-level hook
    set:
      hooks:
        post-install:
          migrate:
            image: myapp:v1
            command: ["./migrate.sh"]
            imagePullSecrets:
              - name: my-registry-secret
    asserts:
      - contains:
          path: spec.template.spec.imagePullSecrets
          content:
            name: "my-registry-secret"
        documentIndex: 1

  # ====== Root-level hook nodeSelector, tolerations, affinity ======
  - it: should render nodeSelector on root-level hook
    set:
      hooks:
        post-install:
          migrate:
            image: myapp:v1
            command: ["./migrate.sh"]
            nodeSelector:
              disktype: ssd
    asserts:
      - equal:
          path: spec.template.spec.nodeSelector.disktype
          value: ssd
        documentIndex: 1

  - it: should render tolerations on root-level hook
    set:
      hooks:
        post-install:
          migrate:
            image: myapp:v1
            command: ["./migrate.sh"]
            tolerations:
              - key: "node-role"
                operator: "Equal"
                value: "ci"
                effect: "NoSchedule"
    asserts:
      - contains:
          path: spec.template.spec.tolerations
          content:
            key: "node-role"
            operator: "Equal"
            value: "ci"
            effect: "NoSchedule"
        documentIndex: 1

  - it: should render affinity on root-level hook
    set:
      hooks:
        post-install:
          migrate:
            image: myapp:v1
            command: ["./migrate.sh"]
            affinity:
              nodeAffinity:
                requiredDuringSchedulingIgnoredDuringExecution:
                  nodeSelectorTerms:
                    - matchExpressions:
                        - key: zone
                          operator: In
                          values: ["us-east-1"]
    asserts:
      - isNotNull:
          path: spec.template.spec.affinity.nodeAffinity
        documentIndex: 1

  # ====== Root-level hook volumes and volumeMounts ======
  - it: should render volumes and volumeMounts on root-level hook
    set:
      hooks:
        post-install:
          migrate:
            image: myapp:v1
            command: ["./migrate.sh"]
            volumeMounts:
              - name: data
                mountPath: /data
            volumes:
              - name: data
                type: emptyDir
    asserts:
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: data
            mountPath: /data
        documentIndex: 1
      - contains:
          path: spec.template.spec.volumes
          content:
            name: data
            emptyDir: {}
        documentIndex: 1

  # ====== Root-level hook with explicit serviceAccountName ======
  - it: should skip SA creation when serviceAccountName is explicitly set
    set:
      hooks:
        post-install:
          migrate:
            image: myapp:v1
            command: ["./migrate.sh"]
            serviceAccountName: my-existing-sa
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Job
        documentIndex: 0
      - equal:
          path: spec.template.spec.serviceAccountName
          value: "my-existing-sa"
        documentIndex: 0

  # ====== Root-level hook with no hooks set ======
  - it: should render nothing when hooks are not set
    set:
      deployments:
        main:
          image: nginx:1.25
    asserts:
      - hasDocuments:
          count: 0

  # ====== Root-level hook with image map ======
  - it: should render root-level hook with image map (repository and tag)
    set:
      hooks:
        post-install:
          migrate:
            image:
              repository: myapp/backend
              tag: "v2.0.0"
            command: ["./migrate.sh"]
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: "myapp/backend:v2.0.0"
        documentIndex: 1

  # ====== Multiple root-level hooks ======
  - it: should render multiple root-level hooks under same hook type
    set:
      hooks:
        pre-upgrade:
          job-a:
            image: myapp:v1
            command: ["./a.sh"]
          job-b:
            image: myapp:v1
            command: ["./b.sh"]
    asserts:
      - hasDocuments:
          count: 4

  # ====== Deployment enabled flag ======
  - it: should not render deployment-level hook when deployment enabled is false
    set:
      deployments:
        backend:
          enabled: false
          image: myapp:v2
          hooks:
            pre-upgrade:
              migrate:
                command: ["./migrate.sh"]
    asserts:
      - hasDocuments:
          count: 0

  # ====== Deployment-level hooks ======
  # Note: When deployment has serviceAccount.create: true (explicitly set),
  # the hook inherits the SA and only produces 1 document (Job at index 0).
  # When deployment has no SA config, the hook creates its own SA (SA=0, Job=1).

  - it: should render deployment-level hook inheriting image
    set:
      deployments:
        backend:
          image: myapp:v2
          serviceAccount:
            create: true
          hooks:
            post-upgrade:
              migrate:
                command: ["./migrate.sh"]
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Job
        documentIndex: 0
      - equal:
          path: spec.template.spec.containers[0].image
          value: "myapp:v2"
        documentIndex: 0

  - it: should name deployment-level hook with deployment name included
    set:
      deployments:
        backend:
          image: myapp:v2
          serviceAccount:
            create: true
          hooks:
            post-upgrade:
              migrate:
                command: ["./migrate.sh"]
    asserts:
      - equal:
          path: metadata.name
          value: RELEASE-NAME-global-chart-backend-post-upgrade-migrate
        documentIndex: 0

  # Locks the canonical name shape: deployment-level hook name is a SINGLE
  # trunc 63 over the full 4-part name (deploymentHookName helper, shared with
  # validateNameCollisions). Guards against a future revert to a per-site
  # printf|trunc that could re-introduce the validator/template decomposition split.
  - it: should truncate deployment-level hook name to 63 chars via single trunc
    release:
      name: rel-abcdefghijklmnop
    set:
      deployments:
        backend-service-worker-component:
          image: nginx:1.25
          hooks:
            pre-install:
              db:
                command: ["./m.sh"]
    asserts:
      # documentIndex 0 is the hook-prerequisite copy of the deployment SA (#71)
      - isKind:
          of: Job
        documentIndex: 1
      - matchRegex:
          path: metadata.name
          pattern: "^.{1,63}$"
      - equal:
          path: metadata.name
          value: rel-abcdefghijklmnop-global-chart-backend-service-worker-compon
        documentIndex: 1

  - it: should set component label for deployment-level hook
    set:
      deployments:
        backend:
          image: myapp:v2
          serviceAccount:
            create: true
          hooks:
            post-upgrade:
              migrate:
                command: ["./migrate.sh"]
    asserts:
      - equal:
          path: metadata.labels["app.kubernetes.io/component"]
          value: backend-hook
        documentIndex: 0

  # ====== Deployment-level hook can override image ======
  - it: should allow deployment-level hook to override image
    set:
      deployments:
        backend:
          image: myapp:v2
          serviceAccount:
            create: true
          hooks:
            post-upgrade:
              migrate:
                image: custom-migrator:latest
                command: ["./migrate.sh"]
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: "custom-migrator:latest"
        documentIndex: 0

  # ====== Deployment-level hook SA inheritance ======
  - it: should inherit SA from deployment when deployment creates SA
    set:
      deployments:
        backend:
          image: myapp:v2
          serviceAccount:
            create: true
          hooks:
            post-upgrade:
              migrate:
                command: ["./migrate.sh"]
    asserts:
      - hasDocuments:
          count: 1
      - matchRegex:
          path: spec.template.spec.serviceAccountName
          pattern: ".*backend.*"
        documentIndex: 0

  - it: should inherit SA from deployment when deployment has existing SA name
    set:
      deployments:
        backend:
          image: myapp:v2
          serviceAccount:
            create: false
            name: my-existing-sa
          hooks:
            post-upgrade:
              migrate:
                command: ["./migrate.sh"]
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: spec.template.spec.serviceAccountName
          value: "my-existing-sa"
        documentIndex: 0

  - it: should create hook-specific SA when deployment has no SA
    set:
      deployments:
        backend:
          image: myapp:v2
          serviceAccount:
            create: false
          hooks:
            post-upgrade:
              migrate:
                command: ["./migrate.sh"]
    asserts:
      - hasDocuments:
          count: 2
      - isKind:
          of: ServiceAccount
        documentIndex: 0
      - isKind:
          of: Job
        documentIndex: 1

  - it: should allow explicit serviceAccountName override in deployment-level hook
    set:
      deployments:
        backend:
          image: myapp:v2
          serviceAccount:
            create: true
          hooks:
            post-upgrade:
              migrate:
                command: ["./migrate.sh"]
                serviceAccountName: "custom-hook-sa"
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: spec.template.spec.serviceAccountName
          value: "custom-hook-sa"
        documentIndex: 0

  # ====== issue #71: hook-prerequisite copy of the deployment SA ======
  # Helm creates normal resources after pre-install hooks, so a pre-install Job
  # binding a chart-created deployment SA needs a hook-annotated copy of it.
  - it: should emit a hook copy of the deployment SA for a pre-install hook
    set:
      deployments:
        app:
          image: myapp:v1
          serviceAccount:
            create: true
          hooks:
            pre-install:
              migration:
                command: ["./migrate.sh"]
    asserts:
      - hasDocuments:
          count: 2
      - isKind:
          of: ServiceAccount
        documentIndex: 0
      - equal:
          path: metadata.name
          value: RELEASE-NAME-global-chart-app
        documentIndex: 0
      - equal:
          path: metadata.annotations["helm.sh/hook"]
          value: "pre-install"
        documentIndex: 0
      - equal:
          path: metadata.annotations["helm.sh/hook-weight"]
          value: "5"
        documentIndex: 0
      - equal:
          path: metadata.annotations["helm.sh/hook-delete-policy"]
          value: "hook-succeeded,hook-failed"
        documentIndex: 0
      - equal:
          path: metadata.labels["app.kubernetes.io/component"]
          value: app-hook
        documentIndex: 0
      - equal:
          path: automountServiceAccountToken
          value: true
        documentIndex: 0
      # the Job binds exactly that SA
      - equal:
          path: spec.template.spec.serviceAccountName
          value: RELEASE-NAME-global-chart-app
        documentIndex: 1

  - it: should copy annotations and automount onto the hook SA copy
    set:
      deployments:
        app:
          image: myapp:v1
          serviceAccount:
            create: true
            automount: false
            annotations:
              iam.gke.io/gcp-service-account: app@proj.iam.gserviceaccount.com
          hooks:
            pre-install:
              migration:
                command: ["./migrate.sh"]
    asserts:
      - equal:
          path: metadata.annotations["iam.gke.io/gcp-service-account"]
          value: app@proj.iam.gserviceaccount.com
        documentIndex: 0
      - equal:
          path: automountServiceAccountToken
          value: false
        documentIndex: 0

  # Weight invariant: prereq (w-7) < SA (w-5) < Job (w), on the LOWEST
  # pre-install Job weight so the SA precedes every one of them.
  - it: should derive the hook SA copy weight from the lowest pre-install hook weight
    set:
      deployments:
        app:
          image: myapp:v1
          serviceAccount:
            create: true
          hooks:
            pre-install:
              early:
                command: ["./early.sh"]
                weight: 8
              late:
                command: ["./late.sh"]
                weight: 20
    asserts:
      - equal:
          path: metadata.annotations["helm.sh/hook-weight"]
          value: "3"
        documentIndex: 0

  # Helm allows negative hook weights. The SA copy must stay 5 below the Job even
  # then — flooring at 0 would sort it AFTER the Job and reintroduce #71.
  - it: should keep the hook SA copy below the Job for a low positive weight
    set:
      deployments:
        app:
          image: myapp:v1
          serviceAccount:
            create: true
          hooks:
            pre-install:
              migration:
                command: ["./migrate.sh"]
                weight: 2
    asserts:
      - equal:
          path: metadata.annotations["helm.sh/hook-weight"]
          value: "-3"
        documentIndex: 0
      - equal:
          path: metadata.annotations["helm.sh/hook-weight"]
          value: "2"
        documentIndex: 1

  - it: should keep the hook SA copy below the Job for a negative weight
    set:
      deployments:
        app:
          image: myapp:v1
          serviceAccount:
            create: true
          hooks:
            pre-install:
              migration:
                command: ["./migrate.sh"]
                weight: -3
    asserts:
      - equal:
          path: metadata.annotations["helm.sh/hook-weight"]
          value: "-8"
        documentIndex: 0
      - equal:
          path: metadata.annotations["helm.sh/hook-weight"]
          value: "-3"
        documentIndex: 1

  - it: should not emit a hook SA copy when the deployment SA is externally managed
    set:
      deployments:
        app:
          image: myapp:v1
          serviceAccount:
            create: false
            name: my-existing-sa
          hooks:
            pre-install:
              migration:
                command: ["./migrate.sh"]
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Job
        documentIndex: 0

  - it: should not emit a hook SA copy when the hook overrides serviceAccountName
    set:
      deployments:
        app:
          image: myapp:v1
          serviceAccount:
            create: true
          hooks:
            pre-install:
              migration:
                command: ["./migrate.sh"]
                serviceAccountName: custom-hook-sa
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Job
        documentIndex: 0

  - it: should not emit a hook SA copy when the hook creates its own SA
    set:
      deployments:
        app:
          image: myapp:v1
          serviceAccount:
            create: true
          hooks:
            pre-install:
              migration:
                command: ["./migrate.sh"]
                serviceAccount:
                  create: true
    asserts:
      - hasDocuments:
          count: 2
      - equal:
          path: metadata.name
          value: RELEASE-NAME-global-chart-app-pre-install-migration
        documentIndex: 0
      - equal:
          path: metadata.annotations["helm.sh/hook-delete-policy"]
          value: "before-hook-creation,hook-succeeded"
        documentIndex: 0

  # pre-upgrade/pre-rollback run against a release whose SA already exists;
  # emitting a copy there would fail with AlreadyExists.
  - it: should not emit a hook SA copy for non pre-install hooks
    set:
      deployments:
        app:
          image: myapp:v1
          serviceAccount:
            create: true
          hooks:
            pre-upgrade:
              migration:
                command: ["./migrate.sh"]
            post-install:
              notify:
                command: ["./notify.sh"]
    asserts:
      - hasDocuments:
          count: 2
