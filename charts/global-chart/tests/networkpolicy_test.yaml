suite: networkpolicy template tests
templates:
  - templates/networkpolicy.yaml
tests:
  - it: should not render NetworkPolicy by default
    set:
      workloads:
        main:
          image: "nginx:1.25"
    asserts:
      - hasDocuments:
          count: 0

  - it: should render NetworkPolicy when enabled
    set:
      workloads:
        main:
          image: "nginx:1.25"
          networkPolicy:
            enabled: true
            ingress:
              - from:
                  - podSelector: {}
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: apiVersion
          value: networking.k8s.io/v1
      - equal:
          path: kind
          value: NetworkPolicy

  - it: should use correct pod selector labels
    set:
      workloads:
        main:
          image: "nginx:1.25"
          networkPolicy:
            enabled: true
            ingress:
              - from:
                  - podSelector: {}
    asserts:
      - equal:
          path: spec.podSelector.matchLabels["app.kubernetes.io/component"]
          value: main

  - it: should render ingress rules when specified
    set:
      workloads:
        main:
          image: "nginx:1.25"
          networkPolicy:
            enabled: true
            ingress:
              - from:
                  - namespaceSelector:
                      matchLabels:
                        name: ingress-nginx
                ports:
                  - port: 8080
                    protocol: TCP
    asserts:
      - equal:
          path: spec.ingress[0].from[0].namespaceSelector.matchLabels.name
          value: ingress-nginx
      - equal:
          path: spec.ingress[0].ports[0].port
          value: 8080

  - it: should render egress rules when specified
    set:
      workloads:
        main:
          image: "nginx:1.25"
          networkPolicy:
            enabled: true
            egress:
              - to:
                  - ipBlock:
                      cidr: 10.0.0.0/8
                ports:
                  - port: 5432
                    protocol: TCP
    asserts:
      - equal:
          path: spec.egress[0].to[0].ipBlock.cidr
          value: 10.0.0.0/8

  - it: should render policyTypes based on rules
    set:
      workloads:
        main:
          image: "nginx:1.25"
          networkPolicy:
            enabled: true
            ingress:
              - from:
                  - podSelector: {}
            egress:
              - to:
                  - podSelector: {}
    asserts:
      - contains:
          path: spec.policyTypes
          content: Ingress
      - contains:
          path: spec.policyTypes
          content: Egress

  - it: should fail when enabled with no rules and no policyTypes
    set:
      workloads:
        main:
          image: "nginx:1.25"
          networkPolicy:
            enabled: true
    asserts:
      - failedTemplate:
          errorMessage: "workloads.main.networkPolicy: at least one of policyTypes, ingress, or egress must be set when networkPolicy.enabled is true."

  - it: should render explicit policyTypes when provided
    set:
      workloads:
        main:
          image: "nginx:1.25"
          networkPolicy:
            enabled: true
            policyTypes:
              - Ingress
              - Egress
            ingress:
              - from:
                  - podSelector: {}
    asserts:
      - hasDocuments:
          count: 1
      - contains:
          path: spec.policyTypes
          content: Ingress
      - contains:
          path: spec.policyTypes
          content: Egress

  - it: should render policyTypes for default deny with explicit policyTypes
    set:
      workloads:
        main:
          image: "nginx:1.25"
          networkPolicy:
            enabled: true
            policyTypes:
              - Ingress
    asserts:
      - hasDocuments:
          count: 1
      - contains:
          path: spec.policyTypes
          content: Ingress

  - it: should not render NetworkPolicy when enabled is false
    set:
      workloads:
        main:
          image: "nginx:1.25"
          networkPolicy:
            enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: should not render NetworkPolicy for disabled workload
    set:
      workloads:
        main:
          enabled: false
          image: "nginx:1.25"
          networkPolicy:
            enabled: true
            ingress:
              - from:
                  - podSelector: {}
    asserts:
      - hasDocuments:
          count: 0

  - it: should render NetworkPolicy for multiple workloads
    set:
      workloads:
        frontend:
          image: "nginx:1.25"
          networkPolicy:
            enabled: true
            ingress:
              - from:
                  - podSelector: {}
        backend:
          image: "myapp:v1"
          networkPolicy:
            enabled: true
            ingress:
              - from:
                  - podSelector: {}
    asserts:
      - hasDocuments:
          count: 2

  # A rule that holds for every kind is tested on every kind (CODING_STANDARDS.md)
  - it: should select a StatefulSet workload's pods by their component label
    set:
      workloads:
        db:
          kind: StatefulSet
          image: nginx:1.25
          networkPolicy:
            enabled: true
            policyTypes: [Ingress]
    asserts:
      - equal:
          path: spec.podSelector.matchLabels
          value:
            app.kubernetes.io/name: global-chart
            app.kubernetes.io/instance: RELEASE-NAME
            app.kubernetes.io/component: db

  # issue #271: endPort as the API server validates it
  - it: should render an endPort at or above a numeric port
    set:
      workloads:
        main:
          image: "nginx:1.25"
          networkPolicy:
            enabled: true
            ingress:
              - ports:
                  - port: 8000
                    endPort: 8100
                  - port: 9000
                    endPort: 9000
    asserts:
      - equal:
          path: spec.ingress[0].ports
          value:
            - port: 8000
              endPort: 8100
            - port: 9000
              endPort: 9000

  - it: should fail when endPort is below port
    set:
      workloads:
        main:
          image: "nginx:1.25"
          networkPolicy:
            enabled: true
            ingress:
              - ports:
                  - port: 80
                  - port: 8000
                    endPort: 7999
    asserts:
      - failedTemplate:
          errorMessage: "workloads.main.networkPolicy.ingress[0].ports[1].endPort: 7999 is below port 8000, which the API server rejects: the range ends at or after its first port."

  - it: should fail when endPort is set with a named port, on a StatefulSet too
    set:
      workloads:
        main:
          kind: StatefulSet
          image: "nginx:1.25"
          networkPolicy:
            enabled: true
            egress:
              - ports:
                  - port: http
                    endPort: 8100
    asserts:
      - failedTemplate:
          errorMessage: "workloads.main.networkPolicy.egress[0].ports[0].endPort: 8100 is set with the port 'http', a string, which the API server reads as a port name and rejects: a range starts at a numeric port. Set port to a number, or drop endPort."

  - it: should fail when endPort is set without port
    set:
      workloads:
        main:
          image: "nginx:1.25"
          networkPolicy:
            enabled: true
            egress:
              - to:
                  - ipBlock:
                      cidr: 10.0.0.0/8
              - ports:
                  - protocol: UDP
                    endPort: 8100
    asserts:
      - failedTemplate:
          errorMessage: "workloads.main.networkPolicy.egress[1].ports[0].endPort: 8100 is set without port, which the API server rejects: a range starts at a numeric port. Set port, or drop endPort."

  - it: should fail when endPort is below port on egress
    set:
      workloads:
        main:
          image: "nginx:1.25"
          networkPolicy:
            enabled: true
            egress:
              - ports:
                  - port: 9000
                    endPort: 8999
    asserts:
      - failedTemplate:
          errorMessage: "workloads.main.networkPolicy.egress[0].ports[0].endPort: 8999 is below port 9000, which the API server rejects: the range ends at or after its first port."

  - it: should fail when endPort is set with a named port on ingress
    set:
      workloads:
        main:
          image: "nginx:1.25"
          networkPolicy:
            enabled: true
            ingress:
              - ports:
                  - port: metrics
                    endPort: 9100
    asserts:
      - failedTemplate:
          errorMessage: "workloads.main.networkPolicy.ingress[0].ports[0].endPort: 9100 is set with the port 'metrics', a string, which the API server reads as a port name and rejects: a range starts at a numeric port. Set port to a number, or drop endPort."
