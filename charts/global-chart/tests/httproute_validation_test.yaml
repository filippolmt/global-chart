suite: httproute validation tests
templates:
  - templates/httproute.yaml
  - templates/validate.yaml
  - templates/ingress.yaml
# The CRD-missing path lives in gateway-api-crd-check_test.yaml.
capabilities:
  apiVersions:
    - gateway.networking.k8s.io/v1/HTTPRoute
tests:
  # ====== 1. parentRefs missing (key absent) ======
  - it: should fail when httpRoute.enabled is true and parentRefs is missing
    set:
      workloads:
        api:
          image: nginx:1.25
      httpRoute:
        enabled: true
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /
            backendRefs:
              - workload: api
    asserts:
      - failedTemplate:
          errorMessage: "httpRoute.parentRefs: empty while httpRoute.enabled is true. Provide at least one parentRef pointing to an existing Gateway (the chart does not create Gateways)."
        template: templates/httproute.yaml

  # ====== 2. parentRefs explicitly empty list ======
  - it: should fail when httpRoute.parentRefs is an empty list
    set:
      workloads:
        api:
          image: nginx:1.25
      httpRoute:
        enabled: true
        parentRefs: []
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /
            backendRefs:
              - workload: api
    asserts:
      - failedTemplate:
          errorMessage: "httpRoute.parentRefs: empty while httpRoute.enabled is true. Provide at least one parentRef pointing to an existing Gateway (the chart does not create Gateways)."
        template: templates/httproute.yaml

  # ====== 3. rules missing (key absent) ======
  - it: should fail when httpRoute.enabled is true and rules is missing
    set:
      workloads:
        api:
          image: nginx:1.25
      httpRoute:
        enabled: true
        parentRefs:
          - name: gw
    asserts:
      - failedTemplate:
          errorMessage: "httpRoute.rules: empty while httpRoute.enabled is true. Provide at least one rule."
        template: templates/httproute.yaml

  # ====== 4. rules explicitly empty list ======
  - it: should fail when httpRoute.rules is an empty list
    set:
      workloads:
        api:
          image: nginx:1.25
      httpRoute:
        enabled: true
        parentRefs:
          - name: gw
        rules: []
    asserts:
      - failedTemplate:
          errorMessage: "httpRoute.rules: empty while httpRoute.enabled is true. Provide at least one rule."
        template: templates/httproute.yaml

  # ====== 5. rule with empty backendRefs ======
  - it: should fail when a rule has empty backendRefs
    set:
      workloads:
        api:
          image: nginx:1.25
      httpRoute:
        enabled: true
        parentRefs:
          - name: gw
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /
            backendRefs: []
    asserts:
      - failedTemplate:
          errorMessage: "httpRoute.rules[0].backendRefs: empty — provide at least one backendRef (workload or service)."
        template: templates/httproute.yaml

  # ====== 6. backendRef → nonexistent workload ======
  - it: should fail when backendRef references a non-existent workload
    set:
      workloads:
        backend:
          image: myapp:v2
      httpRoute:
        enabled: true
        parentRefs:
          - name: gw
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /
            backendRefs:
              - workload: frontend
    asserts:
      - failedTemplate:
          errorMessage: "httpRoute.rules[0].backendRefs[0].workload: references workload 'frontend', which does not exist in .Values.workloads"
        template: templates/httproute.yaml

  # ====== 7. backendRef → workload with enabled: false ======
  - it: should fail when backendRef references a workload with enabled false
    set:
      workloads:
        frontend:
          enabled: false
          image: nginx:1.25
      httpRoute:
        enabled: true
        parentRefs:
          - name: gw
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /
            backendRefs:
              - workload: frontend
    asserts:
      - failedTemplate:
          errorMessage: "httpRoute.rules[0].backendRefs[0].workload: references workload 'frontend', which has enabled: false (its Service will not be created)"
        template: templates/httproute.yaml

  # ====== 8. backendRef → workload with service.enabled: false ======
  - it: should fail when backendRef references a workload with service.enabled false
    set:
      workloads:
        backend:
          image: myapp:v2
          service:
            enabled: false
      httpRoute:
        enabled: true
        parentRefs:
          - name: gw
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /
            backendRefs:
              - workload: backend
    asserts:
      - failedTemplate:
          errorMessage: "httpRoute.rules[0].backendRefs[0].workload: references workload 'backend', which has service.enabled: false. Enable the service or remove the reference."
        template: templates/httproute.yaml

  # ====== 9. backendRef → neither workload nor service.name ======
  - it: should fail when backendRef has neither workload nor service.name
    set:
      workloads:
        api:
          image: nginx:1.25
      httpRoute:
        enabled: true
        parentRefs:
          - name: gw
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /
            backendRefs:
              - {}
    asserts:
      - failedTemplate:
          errorMessage: "httpRoute.rules[0].backendRefs[0]: must specify either 'workload' (name of a workload) or 'service.name' (explicit service name)"
        template: templates/httproute.yaml

  # ====== 10. ingress.enabled and httpRoute.enabled both true (routing conflict) ======
  - it: should fail when both ingress.enabled and httpRoute.enabled are true
    set:
      workloads:
        api:
          image: nginx:1.25
          service:
            port: 8080
      ingress:
        enabled: true
        hosts:
          - host: app.example.com
            workload: api
            paths:
              - path: /
                pathType: Prefix
      httpRoute:
        enabled: true
        parentRefs:
          - name: gw
        hostnames:
          - app.example.com
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /
            backendRefs:
              - workload: api
    asserts:
      - failedTemplate:
          errorMessage: "Both .Values.ingress.enabled and .Values.httpRoute.enabled are true. The chart supports only one HTTP routing layer per release. Disable one (set enabled: false) to proceed."
        template: templates/validate.yaml

  # ====== 11. ingress only — no fail, Ingress rendered ======
  - it: should render Ingress only when ingress.enabled is true and httpRoute.enabled is false
    set:
      workloads:
        api:
          image: nginx:1.25
          service:
            port: 8080
      ingress:
        enabled: true
        hosts:
          - host: app.example.com
            workload: api
            paths:
              - path: /
                pathType: Prefix
      httpRoute:
        enabled: false
    asserts:
      - notFailedTemplate: {}
        template: templates/validate.yaml
      - notFailedTemplate: {}
        template: templates/ingress.yaml
      - notFailedTemplate: {}
        template: templates/httproute.yaml
      - isKind:
          of: Ingress
        template: templates/ingress.yaml
      - hasDocuments:
          count: 0
        template: templates/httproute.yaml

  # ====== 12. httpRoute only — no fail, HTTPRoute rendered ======
  - it: should render HTTPRoute only when httpRoute.enabled is true and ingress.enabled is false
    set:
      workloads:
        api:
          image: nginx:1.25
          service:
            port: 8080
      ingress:
        enabled: false
      httpRoute:
        enabled: true
        parentRefs:
          - name: gw
        hostnames:
          - app.example.com
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /
            backendRefs:
              - workload: api
    asserts:
      - notFailedTemplate: {}
        template: templates/validate.yaml
      - notFailedTemplate: {}
        template: templates/httproute.yaml
      - notFailedTemplate: {}
        template: templates/ingress.yaml
      - isKind:
          of: HTTPRoute
        template: templates/httproute.yaml
      - hasDocuments:
          count: 0
        template: templates/ingress.yaml

  - it: should fail naming an empty backendRef workload as empty, not missing
    set:
      workloads:
        backend:
          image: myapp:v2
        frontend: {}
      httpRoute:
        enabled: true
        parentRefs:
          - name: gw
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /
            backendRefs:
              - workload: frontend
    asserts:
      - failedTemplate:
          errorPattern: "httpRoute\\.rules\\[0\\]\\.backendRefs\\[0\\]\\.workload: references workload 'frontend', which is empty: an empty workloads entry renders nothing"
        template: templates/httproute.yaml
