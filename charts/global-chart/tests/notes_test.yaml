suite: NOTES.txt template tests
templates:
  - templates/NOTES.txt
tests:
  # ====== Deployment enabled flag ======
  - it: should not list disabled deployment in NOTES
    set:
      deployments:
        main:
          enabled: false
          image: nginx:1.25
    asserts:
      - notMatchRegexRaw:
          pattern: "main"

  - it: should render NOTES.txt with deployment info
    set:
      deployments:
        main:
          image: nginx:1.25
    asserts:
      - matchRegexRaw:
          pattern: "Deployments created:"
      - matchRegexRaw:
          pattern: "main"

  - it: should list services
    set:
      deployments:
        api:
          image: nginx:1.25
          service:
            port: 3000
    asserts:
      - matchRegexRaw:
          pattern: "Services:"

  - it: should show ingress info when enabled
    set:
      deployments:
        main:
          image: nginx:1.25
      ingress:
        enabled: true
        className: nginx
        hosts:
          - host: example.com
            deployment: main
            paths:
              - path: /
                pathType: Prefix
    asserts:
      - matchRegexRaw:
          pattern: "Ingress is enabled"
      - matchRegexRaw:
          pattern: "example.com"

  - it: should show cronjob info
    set:
      cronJobs:
        backup:
          schedule: "0 2 * * *"
          image: busybox:latest
          command: ["echo"]
    asserts:
      - matchRegexRaw:
          pattern: "CronJobs:"
      - matchRegexRaw:
          pattern: "backup"

  # ====== Helm floor warning (issue #116) ======
  # helm-unittest reports its own Helm (>= 3.18.6) and cannot override it, so
  # only the absence is testable here; `make check-helm-floor` covers presence.
  - it: should not warn about the Helm floor on a recent Helm
    set:
      deployments:
        main:
          image: nginx:1.25
    asserts:
      - notMatchRegexRaw:
          pattern: "3\\.18\\.6"

  # ====== Legacy volumes[].type deprecation (issue #183) ======
  - it: should list every legacy volume of every scope in a deprecation line
    set:
      deployments:
        web:
          image: nginx:1.25
          volumes:
            - name: native
              emptyDir: {}
            - name: data
              type: emptyDir
          hooks:
            pre-install:
              migrate:
                command: ["true"]
                volumes:
                  - name: creds
                    type: secret
                    secret: { name: creds }
          cronJobs:
            report:
              schedule: "0 0 * * *"
              command: ["true"]
              volumes:
                - name: cache
                  type: persistentVolumeClaim
                  persistentVolumeClaim: { name: cache }
      hooks:
        post-install:
          seed:
            image: myapp:v1
            command: ["true"]
            volumes:
              - name: conf
                type: configMap
                configMap: { name: conf }
      cronJobs:
        cleanup:
          image: myapp:v1
          schedule: "0 0 * * *"
          command: ["true"]
          volumes:
            - name: tmp
              type: emptyDir
    asserts:
      - matchRegexRaw:
          pattern: "DEPRECATED: the legacy volumes\\[\\]\\.type format"
      - matchRegexRaw:
          pattern: "- deployments\\.web\\.volumes\\[1\\] \\(data\\)"
      - matchRegexRaw:
          pattern: "- deployments\\.web\\.hooks\\.pre-install\\.migrate\\.volumes\\[0\\] \\(creds\\)"
      - matchRegexRaw:
          pattern: "- deployments\\.web\\.cronJobs\\.report\\.volumes\\[0\\] \\(cache\\)"
      - matchRegexRaw:
          pattern: "- hooks\\.post-install\\.seed\\.volumes\\[0\\] \\(conf\\)"
      - matchRegexRaw:
          pattern: "- cronJobs\\.cleanup\\.volumes\\[0\\] \\(tmp\\)"
      - notMatchRegexRaw:
          pattern: "\\(native\\)"
      - matchRegexRaw:
          pattern: "https://github\\.com/filippolmt/global-chart#deprecated-the-legacy-volumestype-format"

  - it: should not print the deprecation line when every volume is native
    set:
      deployments:
        web:
          image: nginx:1.25
          volumes:
            - name: native
              emptyDir: {}
    asserts:
      - notMatchRegexRaw:
          pattern: "DEPRECATED"
