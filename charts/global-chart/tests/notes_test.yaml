suite: NOTES.txt template tests
templates:
  - templates/NOTES.txt
tests:
  # ====== Deployment enabled flag ======
  - it: should not list disabled deployment in NOTES
    set:
      deployments:
        main:
          enabled: false
          image: nginx:1.25
    asserts:
      - notMatchRegexRaw:
          pattern: "main"

  - it: should render NOTES.txt with deployment info
    set:
      deployments:
        main:
          image: nginx:1.25
    asserts:
      - matchRegexRaw:
          pattern: "Deployments created:"
      - matchRegexRaw:
          pattern: "main"

  - it: should list services
    set:
      deployments:
        api:
          image: nginx:1.25
          service:
            port: 3000
    asserts:
      - matchRegexRaw:
          pattern: "Services:"

  - it: should show ingress info when enabled
    set:
      deployments:
        main:
          image: nginx:1.25
      ingress:
        enabled: true
        className: nginx
        hosts:
          - host: example.com
            deployment: main
            paths:
              - path: /
                pathType: Prefix
    asserts:
      - matchRegexRaw:
          pattern: "Ingress is enabled"
      - matchRegexRaw:
          pattern: "example.com"

  - it: should show cronjob info
    set:
      cronJobs:
        backup:
          schedule: "0 2 * * *"
          image: busybox:latest
          command: ["echo"]
    asserts:
      - matchRegexRaw:
          pattern: "CronJobs:"
      - matchRegexRaw:
          pattern: "backup"

  # ====== Helm floor warning (issue #116) ======
  # helm-unittest reports its own Helm (>= 3.18.6) and cannot override it, so
  # only the absence is testable here; `make check-helm-floor` covers presence.
  - it: should not warn about the Helm floor on a recent Helm
    set:
      deployments:
        main:
          image: nginx:1.25
    asserts:
      - notMatchRegexRaw:
          pattern: "3\\.18\\.6"

  # ====== Legacy volumes[].type deprecation (issue #183) ======
  - it: should list every legacy volume of every scope in a deprecation line
    set:
      deployments:
        web:
          image: nginx:1.25
          volumes:
            - name: native
              emptyDir: {}
            - name: data
              type: emptyDir
          hooks:
            pre-install:
              migrate:
                command: ["true"]
                volumes:
                  - name: creds
                    type: secret
                    secret: { name: creds }
          cronJobs:
            report:
              schedule: "0 0 * * *"
              command: ["true"]
              volumes:
                - name: cache
                  type: persistentVolumeClaim
                  persistentVolumeClaim: { name: cache }
      hooks:
        post-install:
          seed:
            image: myapp:v1
            command: ["true"]
            volumes:
              - name: conf
                type: configMap
                configMap: { name: conf }
      cronJobs:
        cleanup:
          image: myapp:v1
          schedule: "0 0 * * *"
          command: ["true"]
          volumes:
            - name: tmp
              type: emptyDir
    asserts:
      - matchRegexRaw:
          pattern: "DEPRECATED: the legacy volumes\\[\\]\\.type format"
      - matchRegexRaw:
          pattern: "- deployments\\.web\\.volumes\\[1\\] \\(data\\)"
      - matchRegexRaw:
          pattern: "- deployments\\.web\\.hooks\\.pre-install\\.migrate\\.volumes\\[0\\] \\(creds\\)"
      - matchRegexRaw:
          pattern: "- deployments\\.web\\.cronJobs\\.report\\.volumes\\[0\\] \\(cache\\)"
      - matchRegexRaw:
          pattern: "- hooks\\.post-install\\.seed\\.volumes\\[0\\] \\(conf\\)"
      - matchRegexRaw:
          pattern: "- cronJobs\\.cleanup\\.volumes\\[0\\] \\(tmp\\)"
      - notMatchRegexRaw:
          pattern: "\\(native\\)"
      - matchRegexRaw:
          pattern: "https://github\\.com/filippolmt/global-chart#deprecated-the-legacy-volumestype-format"

  - it: should not print the deprecation line when every volume is native
    set:
      deployments:
        web:
          image: nginx:1.25
          volumes:
            - name: native
              emptyDir: {}
    asserts:
      - notMatchRegexRaw:
          pattern: "DEPRECATED"

  # ====== L4 routes (issue #194) ======
  - it: should list each L4 route with its Gateway listeners
    release:
      name: myrel
    set:
      tcpRoutes:
        gps:
          parentRefs:
            - name: direct-gw
              namespace: gateway-system
              sectionName: gps-5027
          rules: [{ backendRefs: [{ service: { name: x, port: 5027 } }] }]
      udpRoutes:
        dns:
          parentRefs: [{ name: dns-gw }]
          rules: [{ backendRefs: [{ service: { name: y, port: 53 } }] }]
    asserts:
      - matchRegexRaw:
          pattern: "TCPRoute myrel-global-chart-gps is bound to Gateway\\(s\\):\\n  - direct-gw \\(namespace: gateway-system\\) \\(listener: gps-5027\\)"
      - matchRegexRaw:
          pattern: "UDPRoute myrel-global-chart-dns is bound to Gateway\\(s\\):\\n  - dns-gw"

  - it: should list each HTTPRoute, the single one and the httpRoutes entries (issue #195)
    release:
      name: myrel
    set:
      httpRoute:
        enabled: true
        parentRefs: [{ name: shared-gw }]
        hostnames: [app.example.com]
        rules: [{ backendRefs: [{ service: { name: x } }] }]
      httpRoutes:
        traccar:
          parentRefs: [{ name: direct-gw, sectionName: https }]
          hostnames: [traccar.example.com]
          rules: [{ backendRefs: [{ service: { name: y } }] }]
    asserts:
      - matchRegexRaw:
          pattern: "HTTPRoute myrel-global-chart \\(httpRoute\\)\\. Hostnames:\\n  - app\\.example\\.com"
      - matchRegexRaw:
          pattern: "HTTPRoute myrel-global-chart-traccar \\(httpRoutes\\.traccar\\)\\. Hostnames:\\n  - traccar\\.example\\.com\\n\\nBound to Gateway\\(s\\):\\n  - direct-gw \\(listener: https\\)"

  - it: should not print a Hostnames header for an HTTPRoute without hostnames
    set:
      httpRoutes:
        api:
          parentRefs: [{ name: gw }]
          rules: [{ backendRefs: [{ service: { name: x } }] }]
    asserts:
      - notMatchRegexRaw:
          pattern: "Hostnames:"
      - matchRegexRaw:
          pattern: "\\(httpRoutes\\.api\\)\\.\\n\\nBound to Gateway\\(s\\):\\n  - gw"
