suite: deployment checksum/external-secrets (issue #174)
templates:
  - templates/deployment.yaml
# The checksum hashes the rendered spec, whose target.name carries the release
# name: pin it, so the pinned hash below does not depend on the runner default.
release:
  name: rel
set:
  externalSecrets:
    app-conf:
      secretstore: { kind: ClusterSecretStore, name: store }
      secretkey: KEY
      remote: { key: app/conf }
      target:
        template:
          data:
            app.conf: "addons_path = /a"
    other:
      secretstore: { kind: ClusterSecretStore, name: store }
      secretkey: KEY
      remote: { key: other }
  deployments:
    main:
      image: "nginx:1.25"
      externalSecrets:
        - name: app-conf
          mountPath: /etc/app
tests:
  - it: should not render the checksum without references
    set:
      deployments.main.externalSecrets: []
    asserts:
      - notExists:
          path: spec.template.metadata.annotations["checksum/external-secrets"]

  # The one pinned value: every other test compares against it through the
  # anchor, so a change to the rendered spec's form is one re-pin, here.
  - it: should render the checksum of the referenced entries
    asserts:
      - equal:
          path: spec.template.metadata.annotations["checksum/external-secrets"]
          value: &baseChecksum fe57d785f3543dc49ad3b6cffdab8737ab38ddde98a4d80f5b21e811dd34695f

  - it: should change the checksum with target.template
    set:
      externalSecrets.app-conf.target.template.data:
        app.conf: "addons_path = /b"
    asserts:
      - notEqual:
          path: spec.template.metadata.annotations["checksum/external-secrets"]
          value: *baseChecksum

  - it: should change the checksum with remote.key
    set:
      externalSecrets.app-conf.remote.key: app/conf-v2
    asserts:
      - notEqual:
          path: spec.template.metadata.annotations["checksum/external-secrets"]
          value: *baseChecksum

  - it: should change the checksum when the list of references changes
    set:
      deployments.main.externalSecrets:
        - name: app-conf
          mountPath: /etc/app
        - name: other
    asserts:
      - notEqual:
          path: spec.template.metadata.annotations["checksum/external-secrets"]
          value: *baseChecksum

  - it: should keep the checksum when an unreferenced entry changes
    set:
      externalSecrets.other.remote.key: other-v2
    asserts:
      - equal:
          path: spec.template.metadata.annotations["checksum/external-secrets"]
          value: *baseChecksum

  - it: should keep the checksum when only the mountPath changes
    set:
      deployments.main.externalSecrets:
        - name: app-conf
          mountPath: /etc/elsewhere
    asserts:
      - equal:
          path: spec.template.metadata.annotations["checksum/external-secrets"]
          value: *baseChecksum

  - it: should let podAnnotations override the checksum
    set:
      deployments.main.podAnnotations:
        checksum/external-secrets: pinned-by-hand
    asserts:
      - equal:
          path: spec.template.metadata.annotations["checksum/external-secrets"]
          value: pinned-by-hand

  - it: should reject a reference naming no key with its own message
    set:
      deployments.main.externalSecrets:
        - name: missing
    asserts:
      - failedTemplate:
          errorPattern: "deployments.main.externalSecrets references 'missing', which is not a key of externalSecrets"
