suite: externalsecret template tests
templates:
  - templates/externalsecret.yaml
tests:
  - it: should not render when externalSecrets is empty
    set:
      externalSecrets: {}
    asserts:
      - hasDocuments:
          count: 0

  - it: should render ExternalSecret with required fields
    set:
      externalSecrets:
        my-secret:
          secretkey: password
          remote:
            key: /prod/db/password
          secretstore:
            kind: ClusterSecretStore
            name: aws-secrets-manager
    asserts:
      - isKind:
          of: ExternalSecret
      - equal:
          path: spec.data[0].remoteRef.key
          value: "/prod/db/password"
      - equal:
          path: spec.data[0].secretKey
          value: "password"
      - equal:
          path: spec.secretStoreRef.kind
          value: "ClusterSecretStore"
      - equal:
          path: spec.secretStoreRef.name
          value: "aws-secrets-manager"

  - it: should use default values for optional fields
    set:
      externalSecrets:
        my-secret:
          secretkey: password
          remote:
            key: /prod/db/password
          secretstore:
            kind: ClusterSecretStore
            name: aws-sm
    asserts:
      - equal:
          path: spec.refreshInterval
          value: "1h"
      - equal:
          path: spec.target.creationPolicy
          value: "Owner"
      - equal:
          path: spec.target.deletionPolicy
          value: "Retain"
      - equal:
          path: spec.data[0].remoteRef.conversionStrategy
          value: "Default"
      - equal:
          path: spec.data[0].remoteRef.decodingStrategy
          value: "None"

  - it: should fail when remote.key is missing
    set:
      externalSecrets:
        my-secret:
          secretkey: password
          remote: {}
          secretstore:
            kind: ClusterSecretStore
            name: aws-sm
    asserts:
      - failedTemplate:
          errorMessage: "externalSecrets.my-secret.remote.key is mandatory"

  - it: should render multiple ExternalSecrets
    set:
      externalSecrets:
        secret-one:
          secretkey: key1
          remote:
            key: /path/one
          secretstore:
            kind: SecretStore
            name: store1
        secret-two:
          secretkey: key2
          remote:
            key: /path/two
          secretstore:
            kind: SecretStore
            name: store2
    asserts:
      - hasDocuments:
          count: 2

  # ====== Negative tests: fail/required paths ======

  - it: should fail when remote is missing
    set:
      externalSecrets:
        my-secret:
          secretkey: password
          secretstore:
            kind: ClusterSecretStore
            name: aws-sm
    asserts:
      - failedTemplate:
          errorPattern: "externalSecrets.my-secret.remote is mandatory"

  - it: should fail when secretstore is missing
    set:
      externalSecrets:
        my-secret:
          secretkey: password
          remote:
            key: /prod/db/password
    asserts:
      - failedTemplate:
          errorPattern: "externalSecrets.my-secret.secretstore is mandatory"

  - it: should fail when secretkey is missing
    set:
      externalSecrets:
        my-secret:
          remote:
            key: /prod/db/password
          secretstore:
            kind: ClusterSecretStore
            name: aws-sm
    asserts:
      - failedTemplate:
          errorMessage: "secretkey is mandatory"

  - it: should fail when secretstore.kind is missing
    set:
      externalSecrets:
        my-secret:
          secretkey: password
          remote:
            key: /prod/db/password
          secretstore:
            name: aws-sm
    asserts:
      - failedTemplate:
          errorPattern: "externalSecrets.my-secret.secretstore.kind is mandatory"

  - it: should fail when secretstore.name is missing
    set:
      externalSecrets:
        my-secret:
          secretkey: password
          remote:
            key: /prod/db/password
          secretstore:
            kind: ClusterSecretStore
    asserts:
      - failedTemplate:
          errorPattern: "externalSecrets.my-secret.secretstore.name is mandatory"

  # ====== data list form (many keys, one Secret) ======

  - it: should render multiple data entries from the data list
    set:
      externalSecrets:
        app:
          secretstore:
            kind: ClusterSecretStore
            name: my-store
          data:
            - secretkey: DB_PASSWORD
              remote:
                key: MY_DB_PASSWORD
            - secretkey: API_TOKEN
              remote:
                key: MY_API_TOKEN
    asserts:
      - isKind:
          of: ExternalSecret
      - equal:
          path: spec.data[0].secretKey
          value: "DB_PASSWORD"
      - equal:
          path: spec.data[0].remoteRef.key
          value: "MY_DB_PASSWORD"
      - equal:
          path: spec.data[1].secretKey
          value: "API_TOKEN"
      - equal:
          path: spec.data[1].remoteRef.key
          value: "MY_API_TOKEN"
      - notExists:
          path: spec.dataFrom

  - it: should apply default strategies to data list items
    set:
      externalSecrets:
        app:
          secretstore:
            kind: ClusterSecretStore
            name: my-store
          data:
            - secretkey: DB_PASSWORD
              remote:
                key: MY_DB_PASSWORD
    asserts:
      - equal:
          path: spec.data[0].remoteRef.conversionStrategy
          value: "Default"
      - equal:
          path: spec.data[0].remoteRef.decodingStrategy
          value: "None"
      - equal:
          path: spec.data[0].remoteRef.metadataPolicy
          value: "None"

  - it: should render both data and dataFrom when both are set
    set:
      externalSecrets:
        app:
          secretstore:
            kind: ClusterSecretStore
            name: my-store
          data:
            - secretkey: DB_PASSWORD
              remote:
                key: MY_DB_PASSWORD
          dataFrom:
            - find:
                name:
                  regexp: "^APP_.*"
    asserts:
      - equal:
          path: spec.data[0].secretKey
          value: "DB_PASSWORD"
      - equal:
          path: spec.dataFrom[0].find.name.regexp
          value: "^APP_.*"

  - it: should not fall through to the legacy branch on an empty data list
    set:
      externalSecrets:
        app:
          secretstore:
            kind: ClusterSecretStore
            name: my-store
          data: []
    asserts:
      - isKind:
          of: ExternalSecret
      - notExists:
          path: spec.data[0]

  - it: should fail when single-key form is combined with data
    set:
      externalSecrets:
        app:
          secretstore:
            kind: ClusterSecretStore
            name: my-store
          secretkey: DB_PASSWORD
          remote:
            key: MY_DB_PASSWORD
          data:
            - secretkey: API_TOKEN
              remote:
                key: MY_API_TOKEN
    asserts:
      - failedTemplate:
          errorPattern: "single-key form .* cannot be combined with 'data' or 'dataFrom'"

  - it: should fail when a data item is missing remote.key
    set:
      externalSecrets:
        app:
          secretstore:
            kind: ClusterSecretStore
            name: my-store
          data:
            - secretkey: DB_PASSWORD
              remote: {}
    asserts:
      - failedTemplate:
          errorPattern: "externalSecrets.app.data\\[\\].remote.key is mandatory"

  - it: should fail when a data item is missing secretkey
    set:
      externalSecrets:
        app:
          secretstore:
            kind: ClusterSecretStore
            name: my-store
          data:
            - remote:
                key: MY_DB_PASSWORD
    asserts:
      - failedTemplate:
          errorPattern: "externalSecrets.app.data\\[\\].secretkey is mandatory"

  # ====== dataFrom form (extract / find) ======

  - it: should render dataFrom verbatim and omit data
    set:
      externalSecrets:
        app:
          secretstore:
            kind: ClusterSecretStore
            name: my-store
          dataFrom:
            - find:
                name:
                  regexp: "^APP_.*"
            - extract:
                key: shared/app
    asserts:
      - isKind:
          of: ExternalSecret
      - equal:
          path: spec.dataFrom[0].find.name.regexp
          value: "^APP_.*"
      - equal:
          path: spec.dataFrom[1].extract.key
          value: "shared/app"
      - notExists:
          path: spec.data

  # ====== generator-backed / per-item store (no spec-level secretstore) ======

  - it: should render a generator-backed dataFrom without a secretStoreRef
    set:
      externalSecrets:
        basicauth:
          dataFrom:
            - sourceRef:
                generatorRef:
                  apiVersion: generators.external-secrets.io/v1alpha1
                  kind: Password
                  name: stage-basicauth
    asserts:
      - isKind:
          of: ExternalSecret
      - equal:
          path: spec.dataFrom[0].sourceRef.generatorRef.kind
          value: "Password"
      - equal:
          path: spec.dataFrom[0].sourceRef.generatorRef.name
          value: "stage-basicauth"
      - notExists:
          path: spec.secretStoreRef

  - it: should render a per-item storeRef without a secretStoreRef
    set:
      externalSecrets:
        app:
          dataFrom:
            - sourceRef:
                storeRef:
                  kind: ClusterSecretStore
                  name: my-store
              extract:
                key: shared/app
    asserts:
      - equal:
          path: spec.dataFrom[0].sourceRef.storeRef.name
          value: "my-store"
      - notExists:
          path: spec.secretStoreRef

  - it: should render target.template verbatim
    set:
      externalSecrets:
        basicauth:
          dataFrom:
            - sourceRef:
                generatorRef:
                  apiVersion: generators.external-secrets.io/v1alpha1
                  kind: Password
                  name: stage-basicauth
          target:
            template:
              engineVersion: v2
              data:
                .htpasswd: '{{ htpasswd "stage" .password "bcrypt" }}'
    asserts:
      - equal:
          path: spec.target.template.engineVersion
          value: "v2"
      - equal:
          path: spec.target.template.data[".htpasswd"]
          value: '{{ htpasswd "stage" .password "bcrypt" }}'

  - it: should render target.immutable false without turning it into true
    set:
      externalSecrets:
        app:
          secretstore:
            kind: ClusterSecretStore
            name: my-store
          secretkey: password
          remote:
            key: /prod/db/password
          target:
            immutable: false
    asserts:
      - equal:
          path: spec.target.immutable
          value: false

  - it: should omit target.immutable when unset
    set:
      externalSecrets:
        app:
          secretstore:
            kind: ClusterSecretStore
            name: my-store
          secretkey: password
          remote:
            key: /prod/db/password
    asserts:
      - notExists:
          path: spec.target.immutable

  - it: should still demand secretstore.kind when secretstore is an empty map
    set:
      externalSecrets:
        app:
          secretkey: password
          remote:
            key: /prod/db/password
          secretstore: {}
    asserts:
      - failedTemplate:
          errorPattern: "externalSecrets.app.secretstore.kind is mandatory"

  - it: should keep a spec-level secretstore alongside a self-contained dataFrom
    set:
      externalSecrets:
        app:
          secretstore:
            kind: ClusterSecretStore
            name: my-store
          dataFrom:
            - sourceRef:
                generatorRef:
                  apiVersion: generators.external-secrets.io/v1alpha1
                  kind: Password
                  name: stage-basicauth
    asserts:
      - equal:
          path: spec.secretStoreRef.name
          value: "my-store"

  - it: should fail when only some dataFrom entries carry a sourceRef
    set:
      externalSecrets:
        app:
          dataFrom:
            - sourceRef:
                generatorRef:
                  apiVersion: generators.external-secrets.io/v1alpha1
                  kind: Password
                  name: stage-basicauth
            - find:
                name:
                  regexp: "^APP_.*"
    asserts:
      - failedTemplate:
          errorPattern: "externalSecrets.app.secretstore is mandatory"

  - it: should fail on an empty dataFrom list without a secretstore
    set:
      externalSecrets:
        app:
          dataFrom: []
    asserts:
      - failedTemplate:
          errorPattern: "externalSecrets.app.secretstore is mandatory"

  - it: should still demand a secretstore for a store-backed dataFrom
    set:
      externalSecrets:
        app:
          dataFrom:
            - find:
                name:
                  regexp: "^APP_.*"
    asserts:
      - failedTemplate:
          errorPattern: "externalSecrets.app.secretstore is mandatory"

  - it: should render remote.property alone
    set:
      externalSecrets:
        app:
          secretstore:
            kind: ClusterSecretStore
            name: gcp-store
          secretkey: DB_PASSWORD
          remote:
            key: apps/prod/bundle
            property: db_password
    asserts:
      - equal:
          path: spec.data[0].remoteRef.property
          value: "db_password"
      - notExists:
          path: spec.data[0].remoteRef.version

  - it: should render remote.version alone
    set:
      externalSecrets:
        app:
          secretstore:
            kind: ClusterSecretStore
            name: gcp-store
          secretkey: DB_PASSWORD
          remote:
            key: apps/prod/bundle
            version: "3"
    asserts:
      - equal:
          path: spec.data[0].remoteRef.version
          value: "3"
      - notExists:
          path: spec.data[0].remoteRef.property

  - it: should render both property and version on a data list item
    set:
      externalSecrets:
        app:
          secretstore:
            kind: ClusterSecretStore
            name: gcp-store
          data:
            - secretkey: DB_PASSWORD
              remote:
                key: apps/prod/bundle
                property: db_password
                version: "3"
            - secretkey: API_TOKEN
              remote:
                key: apps/prod/bundle
                property: api_token
    asserts:
      - equal:
          path: spec.data[0].remoteRef.property
          value: "db_password"
      - equal:
          path: spec.data[0].remoteRef.version
          value: "3"
      - equal:
          path: spec.data[1].remoteRef.property
          value: "api_token"
      - notExists:
          path: spec.data[1].remoteRef.version

  - it: should omit property and version when unset
    set:
      externalSecrets:
        app:
          secretstore:
            kind: ClusterSecretStore
            name: gcp-store
          secretkey: DB_PASSWORD
          remote:
            key: apps/prod/db-password
    asserts:
      - notExists:
          path: spec.data[0].remoteRef.property
      - notExists:
          path: spec.data[0].remoteRef.version
