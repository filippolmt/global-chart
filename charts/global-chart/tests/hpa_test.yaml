suite: hpa template tests
templates:
  - templates/hpa.yaml
tests:
  # ====== Deployment enabled flag ======
  - it: should not render HPA when deployment enabled is false
    set:
      deployments:
        main:
          enabled: false
          image: nginx:1.25
          autoscaling:
            enabled: true
            minReplicas: 1
            maxReplicas: 5
            targetCPUUtilizationPercentage: 80
    asserts:
      - hasDocuments:
          count: 0

  # ====== Nil safety: deployment without autoscaling key ======
  - it: should not render HPA when autoscaling is not defined
    set:
      deployments:
        main:
          image: nginx:1.25
    asserts:
      - hasDocuments:
          count: 0

  # ====== Nil safety: autoscaling enabled without metrics ======
  - it: should not render HPA when enabled but no metrics set
    set:
      deployments:
        main:
          image: nginx:1.25
          autoscaling:
            enabled: true
            minReplicas: 2
            maxReplicas: 5
    asserts:
      - hasDocuments:
          count: 0

  # ====== Basic HPA with CPU metric ======
  - it: should render HPA with CPU metric
    set:
      deployments:
        main:
          image: nginx:1.25
          autoscaling:
            enabled: true
            minReplicas: 2
            maxReplicas: 10
            targetCPUUtilizationPercentage: 80
    asserts:
      - isKind:
          of: HorizontalPodAutoscaler
      - equal:
          path: spec.minReplicas
          value: 2
      - equal:
          path: spec.maxReplicas
          value: 10
      - equal:
          path: spec.metrics[0].resource.name
          value: cpu
      - equal:
          path: spec.metrics[0].resource.target.averageUtilization
          value: 80

  # ====== HPA with both CPU and Memory metrics ======
  - it: should render HPA with both CPU and memory metrics
    set:
      deployments:
        main:
          image: nginx:1.25
          autoscaling:
            enabled: true
            minReplicas: 1
            maxReplicas: 5
            targetCPUUtilizationPercentage: 70
            targetMemoryUtilizationPercentage: 85
    asserts:
      - isKind:
          of: HorizontalPodAutoscaler
      - equal:
          path: spec.metrics[0].resource.name
          value: cpu
      - equal:
          path: spec.metrics[1].resource.name
          value: memory

  # ====== Negative tests: fail/required paths ======

  - it: should fail when autoscaling.minReplicas is not set
    set:
      deployments:
        main:
          image: nginx:1.25
          autoscaling:
            enabled: true
            maxReplicas: 10
            targetCPUUtilizationPercentage: 80
    asserts:
      - failedTemplate:
          errorMessage: "deployments.main.autoscaling.minReplicas is required when HPA is enabled"

  - it: should fail when autoscaling.maxReplicas is not set
    set:
      deployments:
        main:
          image: nginx:1.25
          autoscaling:
            enabled: true
            minReplicas: 2
            targetCPUUtilizationPercentage: 80
    asserts:
      - failedTemplate:
          errorMessage: "deployments.main.autoscaling.maxReplicas is required when HPA is enabled"

  # ====== Deployment annotations stay on the Deployment (issue #112) ======
  - it: should not propagate the Deployment's own annotations to its HPA
    set:
      deployments:
        web:
          image: nginx:1.25
          annotations:
            argocd.argoproj.io/sync-wave: "1"
          autoscaling:
            enabled: true
            minReplicas: 1
            maxReplicas: 3
    asserts:
      - notExists:
          path: metadata.annotations

  # ====== Integers from values (issue #132) ======
  # A number read from a values file is a float64, which the default format
  # prints as 1e+07 from a million up: an integer field the API server rejects.
  # set: values reach the template as float64 too, so these fail without
  # global-chart.printScalar.
  - it: should render large replica bounds in plain digits
    set:
      deployments:
        main:
          image: nginx:1.25
          autoscaling:
            enabled: true
            minReplicas: 10000000
            maxReplicas: 10000000
            targetCPUUtilizationPercentage: 80
    asserts:
      - equal:
          path: spec.minReplicas
          value: 10000000
      - equal:
          path: spec.maxReplicas
          value: 10000000

  - it: should render a large averageUtilization in plain digits
    set:
      deployments:
        main:
          image: nginx:1.25
          autoscaling:
            enabled: true
            minReplicas: 1
            maxReplicas: 3
            targetCPUUtilizationPercentage: 10000000
            targetMemoryUtilizationPercentage: 10000000
    asserts:
      - equal:
          path: spec.metrics[0].resource.target.averageUtilization
          value: 10000000
      - equal:
          path: spec.metrics[1].resource.target.averageUtilization
          value: 10000000
