suite: configmap template tests
templates:
  - templates/configmap.yaml
tests:
  # ====== Deployment enabled flag ======
  - it: should not render configmap when deployment enabled is false
    set:
      deployments:
        main:
          enabled: false
          image: nginx:1.25
          configMap:
            APP_ENV: production
    asserts:
      - hasDocuments:
          count: 0

  - it: should not render configmap when not defined
    set:
      deployments:
        main:
          image: nginx:1.25
    asserts:
      - hasDocuments:
          count: 0

  - it: should render configmap with string values
    set:
      deployments:
        main:
          image: nginx:1.25
          configMap:
            APP_ENV: production
            LOG_LEVEL: info
    asserts:
      - isKind:
          of: ConfigMap
      - equal:
          path: data.APP_ENV
          value: "production"
      - equal:
          path: data.LOG_LEVEL
          value: "info"

  - it: should render configmap with correct name
    set:
      deployments:
        backend:
          image: nginx:1.25
          configMap:
            KEY: value
    asserts:
      - matchRegex:
          path: metadata.name
          pattern: ".*backend.*"

  - it: should render configmap with numeric values as strings
    set:
      deployments:
        main:
          image: nginx:1.25
          configMap:
            PORT: 8080
            ENABLED: true
    asserts:
      - isKind:
          of: ConfigMap
      - equal:
          path: data.PORT
          value: "8080"
      - equal:
          path: data.ENABLED
          value: "true"

  - it: should render map and slice values as YAML strings
    set:
      deployments:
        main:
          image: nginx:1.25
          configMap:
            app.yaml:
              server:
                port: 8080
            FEATURES:
              - alpha
              - beta
    asserts:
      - isKind:
          of: ConfigMap
      # ConfigMap.data is map[string]string: a nested mapping here would be a
      # manifest the API server rejects
      - equal:
          path: data["app.yaml"]
          value: |-
            server:
              port: 8080
      - equal:
          path: data.FEATURES
          value: |-
            - alpha
            - beta

  - it: should render multiple configmaps for multiple deployments
    set:
      deployments:
        frontend:
          image: nginx:1.25
          configMap:
            KEY1: val1
        backend:
          image: myapp:v1
          configMap:
            KEY2: val2
    asserts:
      - hasDocuments:
          count: 2

  # ====== global.commonLabels ======
  - it: should render global.commonLabels on configmap metadata
    set:
      global:
        commonLabels:
          team: platform
      deployments:
        main:
          image: nginx:1.25
          configMap:
            APP_ENV: production
    asserts:
      - equal:
          path: metadata.labels.team
          value: platform

  # ====== Numbers from values in string fields (issue #132) ======
  # A values-file number is a float64, and toString prints it as 1e+07 from a
  # million up: the API server accepts that in a string field and the
  # application silently reads the wrong value. A non-integral float keeps its
  # form (1.5 is never truncated). set: values reach the template as float64.
  - it: should render a large number in plain digits and keep a fraction
    set:
      deployments:
        main:
          image: nginx:1.25
          configMap:
            LIMIT: 10000000
            RATIO: 1.5
    asserts:
      - equal:
          path: data.LIMIT
          value: "10000000"
      - equal:
          path: data.RATIO
          value: "1.5"

  # A null used to render as "<nil>", a value nobody wrote.
  - it: should fail on a null value
    set:
      deployments:
        main:
          image: nginx:1.25
          configMap:
            EMPTY: null
    asserts:
      - failedTemplate:
          errorPattern: "printScalar: a null value reached a field the chart prints"

  # A bare key is reparsed as a YAML 1.1 scalar on its way to the API server:
  # on became "true", 0x1F "31", 1.10 "1.1" (issue #152). Keys are quoted.
  - it: should quote keys YAML 1.1 would rewrite
    set:
      deployments:
        main:
          image: nginx:1.25
          configMap: { "on": a, "no": b, "1.10": c, "0x1F": d, "007": e }
    asserts:
      - equal:
          path: data
          value: { "on": a, "no": b, "1.10": c, "0x1F": d, "007": e }
