suite: pdb template tests
templates:
  - templates/pdb.yaml
tests:
  - it: should not render PDB by default
    set:
      deployments:
        main:
          image: "nginx:1.25"
    asserts:
      - hasDocuments:
          count: 0

  - it: should render PDB with minAvailable
    set:
      deployments:
        main:
          image: "nginx:1.25"
          pdb:
            enabled: true
            minAvailable: 1
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: apiVersion
          value: policy/v1
      - equal:
          path: kind
          value: PodDisruptionBudget
      - equal:
          path: spec.minAvailable
          value: 1
      - notExists:
          path: spec.maxUnavailable

  - it: should render PDB with maxUnavailable
    set:
      deployments:
        main:
          image: "nginx:1.25"
          pdb:
            enabled: true
            maxUnavailable: 1
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: spec.maxUnavailable
          value: 1
      - notExists:
          path: spec.minAvailable

  - it: should not render PDB when enabled is false
    set:
      deployments:
        main:
          image: "nginx:1.25"
          pdb:
            enabled: false
            minAvailable: 1
    asserts:
      - hasDocuments:
          count: 0

  - it: should use correct selector labels
    set:
      deployments:
        main:
          image: "nginx:1.25"
          pdb:
            enabled: true
            minAvailable: 1
    asserts:
      - equal:
          path: spec.selector.matchLabels["app.kubernetes.io/component"]
          value: main

  - it: should render PDB for multiple deployments
    set:
      deployments:
        frontend:
          image: "nginx:1.25"
          pdb:
            enabled: true
            minAvailable: 1
        backend:
          image: "myapp:v1"
          pdb:
            enabled: true
            maxUnavailable: 1
    asserts:
      - hasDocuments:
          count: 2

  - it: should fail when both minAvailable and maxUnavailable are set
    set:
      deployments:
        main:
          image: "nginx:1.25"
          pdb:
            enabled: true
            minAvailable: 1
            maxUnavailable: 1
    asserts:
      - failedTemplate:
          errorMessage: "PDB for deployment 'main': minAvailable and maxUnavailable are mutually exclusive — set only one."

  - it: should fail when neither minAvailable nor maxUnavailable is set
    set:
      deployments:
        main:
          image: "nginx:1.25"
          pdb:
            enabled: true
    asserts:
      - failedTemplate:
          errorMessage: "PDB for deployment 'main': one of minAvailable or maxUnavailable is required when pdb.enabled is true."

  - it: should render PDB with minAvailable 0
    set:
      deployments:
        main:
          image: "nginx:1.25"
          pdb:
            enabled: true
            minAvailable: 0
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: spec.minAvailable
          value: 0
      - notExists:
          path: spec.maxUnavailable

  - it: should not render PDB for disabled deployment
    set:
      deployments:
        main:
          enabled: false
          image: "nginx:1.25"
          pdb:
            enabled: true
            minAvailable: 1
    asserts:
      - hasDocuments:
          count: 0

  # ====== Integers from values (issue #132) ======
  # A number read from a values file is a float64, which the default format
  # prints as 1e+07 from a million up: an integer field the API server rejects.
  - it: should render a large minAvailable in plain digits
    set:
      deployments:
        main:
          image: "nginx:1.25"
          pdb:
            enabled: true
            minAvailable: 10000000
    asserts:
      - equal:
          path: spec.minAvailable
          value: 10000000

  # The int-or-string branch: a percentage passes through unchanged.
  - it: should render a percentage maxUnavailable unchanged
    set:
      deployments:
        main:
          image: "nginx:1.25"
          pdb:
            enabled: true
            maxUnavailable: "50%"
    asserts:
      - equal:
          path: spec.maxUnavailable
          value: "50%"

  # ====== A string bound is a count or a percentage ======
  # A string prints unquoted: "010" reached the API server as the YAML 1.1
  # octal 8, and "two" passed lint and was rejected at apply.
  - it: should reject a string minAvailable with a leading zero
    set:
      deployments:
        main:
          image: "nginx:1.25"
          pdb:
            enabled: true
            minAvailable: "010"
    asserts:
      - failedTemplate:
          errorPattern: "minAvailable"

  - it: should reject a string maxUnavailable that is neither a count nor a percentage
    set:
      deployments:
        main:
          image: "nginx:1.25"
          pdb:
            enabled: true
            maxUnavailable: "two"
    asserts:
      - failedTemplate:
          errorPattern: "maxUnavailable"

  # A digit string is a count spelled as a string: the schema takes a count
  # as an integer only (issue #156).
  - it: should reject a digit string with no percent sign
    set:
      deployments:
        main:
          image: "nginx:1.25"
          pdb:
            enabled: true
            minAvailable: "2"
    asserts:
      - failedTemplate:
          errorPattern: "minAvailable"

  - it: should accept a percentage
    set:
      deployments:
        main:
          image: "nginx:1.25"
          pdb:
            enabled: true
            maxUnavailable: "25%"
    asserts:
      - equal:
          path: spec.maxUnavailable
          value: 25%
