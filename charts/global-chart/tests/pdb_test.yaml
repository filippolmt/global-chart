suite: pdb template tests
templates:
  - templates/pdb.yaml
tests:
  - it: should not render PDB by default
    set:
      deployments:
        main:
          image: "nginx:1.25"
    asserts:
      - hasDocuments:
          count: 0

  - it: should render PDB with minAvailable
    set:
      deployments:
        main:
          image: "nginx:1.25"
          pdb:
            enabled: true
            minAvailable: 1
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: apiVersion
          value: policy/v1
      - equal:
          path: kind
          value: PodDisruptionBudget
      - equal:
          path: spec.minAvailable
          value: 1
      - notExists:
          path: spec.maxUnavailable

  - it: should render PDB with maxUnavailable
    set:
      deployments:
        main:
          image: "nginx:1.25"
          pdb:
            enabled: true
            maxUnavailable: 1
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: spec.maxUnavailable
          value: 1
      - notExists:
          path: spec.minAvailable

  - it: should not render PDB when enabled is false
    set:
      deployments:
        main:
          image: "nginx:1.25"
          pdb:
            enabled: false
            minAvailable: 1
    asserts:
      - hasDocuments:
          count: 0

  - it: should use correct selector labels
    set:
      deployments:
        main:
          image: "nginx:1.25"
          pdb:
            enabled: true
            minAvailable: 1
    asserts:
      - equal:
          path: spec.selector.matchLabels["app.kubernetes.io/component"]
          value: main

  - it: should render PDB for multiple deployments
    set:
      deployments:
        frontend:
          image: "nginx:1.25"
          pdb:
            enabled: true
            minAvailable: 1
        backend:
          image: "myapp:v1"
          pdb:
            enabled: true
            maxUnavailable: 1
    asserts:
      - hasDocuments:
          count: 2

  - it: should fail when both minAvailable and maxUnavailable are set
    set:
      deployments:
        main:
          image: "nginx:1.25"
          pdb:
            enabled: true
            minAvailable: 1
            maxUnavailable: 1
    asserts:
      - failedTemplate:
          errorMessage: "deployments.main.pdb: minAvailable and maxUnavailable are mutually exclusive — set only one."

  - it: should fail when neither minAvailable nor maxUnavailable is set
    set:
      deployments:
        main:
          image: "nginx:1.25"
          pdb:
            enabled: true
    asserts:
      - failedTemplate:
          errorMessage: "deployments.main.pdb: one of minAvailable or maxUnavailable is required when pdb.enabled is true."

  - it: should render PDB with minAvailable 0
    set:
      deployments:
        main:
          image: "nginx:1.25"
          pdb:
            enabled: true
            minAvailable: 0
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: spec.minAvailable
          value: 0
      - notExists:
          path: spec.maxUnavailable

  - it: should not render PDB for disabled deployment
    set:
      deployments:
        main:
          enabled: false
          image: "nginx:1.25"
          pdb:
            enabled: true
            minAvailable: 1
    asserts:
      - hasDocuments:
          count: 0

  # ====== Integers from values (issue #132) ======
  # A number read from a values file is a float64, which the default format
  # prints as 1e+07 from a million up: an integer field the API server rejects.
  - it: should render a large minAvailable in plain digits
    set:
      deployments:
        main:
          image: "nginx:1.25"
          replicaCount: 20000000
          pdb:
            enabled: true
            minAvailable: 10000000
    asserts:
      - equal:
          path: spec.minAvailable
          value: 10000000

  # The int-or-string branch: a percentage passes through unchanged.
  - it: should render a percentage maxUnavailable unchanged
    set:
      deployments:
        main:
          image: "nginx:1.25"
          pdb:
            enabled: true
            maxUnavailable: "50%"
    asserts:
      - equal:
          path: spec.maxUnavailable
          value: "50%"

  # ====== A string bound is a count or a percentage ======
  # A string prints unquoted: "010" reached the API server as the YAML 1.1
  # octal 8, and "two" passed lint and was rejected at apply.
  - it: should reject a string minAvailable with a leading zero
    set:
      deployments:
        main:
          image: "nginx:1.25"
          pdb:
            enabled: true
            minAvailable: "010"
    asserts:
      - failedTemplate:
          errorPattern: "minAvailable"

  - it: should reject a string maxUnavailable that is neither a count nor a percentage
    set:
      deployments:
        main:
          image: "nginx:1.25"
          pdb:
            enabled: true
            maxUnavailable: "two"
    asserts:
      - failedTemplate:
          errorPattern: "maxUnavailable"

  # A digit string is a count spelled as a string: the schema takes a count
  # as an integer only (issue #156).
  - it: should reject a digit string with no percent sign
    set:
      deployments:
        main:
          image: "nginx:1.25"
          pdb:
            enabled: true
            minAvailable: "2"
    asserts:
      - failedTemplate:
          errorPattern: "minAvailable"

  - it: should accept a percentage
    set:
      deployments:
        main:
          image: "nginx:1.25"
          pdb:
            enabled: true
            maxUnavailable: "25%"
    asserts:
      - equal:
          path: spec.maxUnavailable
          value: 25%

  # ====== A PDB that allows no voluntary eviction (issue #216, ADR 0021) ======
  # Only the form whose effect depends on the count fails; the count is the
  # replica owner's floor.
  - it: should fail a minAvailable equal to a single replica
    set:
      deployments:
        main:
          image: "nginx:1.25"
          replicaCount: 1
          pdb:
            enabled: true
            minAvailable: 1
    asserts:
      - failedTemplate:
          errorMessage: "deployments.main.pdb.minAvailable: 1 allows no voluntary eviction with deployments.main.replicaCount: 1, so kubectl drain and cluster-autoscaler scale-down never finish on its node. Lower it, or set maxUnavailable: 0 instead to block evictions on purpose."

  - it: should fail a minAvailable equal to a fixed count above one
    set:
      deployments:
        main:
          image: "nginx:1.25"
          replicaCount: 3
          pdb:
            enabled: true
            minAvailable: 3
    asserts:
      - failedTemplate:
          errorMessage: "deployments.main.pdb.minAvailable: 3 allows no voluntary eviction with deployments.main.replicaCount: 3, so kubectl drain and cluster-autoscaler scale-down never finish on its node. Lower it, or set maxUnavailable: 0 instead to block evictions on purpose."

  - it: should fail a minAvailable above the fixed count
    set:
      deployments:
        main:
          image: "nginx:1.25"
          replicaCount: 2
          pdb:
            enabled: true
            minAvailable: 5
    asserts:
      - failedTemplate:
          errorMessage: "deployments.main.pdb.minAvailable: 5 allows no voluntary eviction with deployments.main.replicaCount: 2, so kubectl drain and cluster-autoscaler scale-down never finish on its node. Lower it, or set maxUnavailable: 0 instead to block evictions on purpose."

  - it: should fail a minAvailable reaching the default count of 2
    set:
      deployments:
        main:
          image: "nginx:1.25"
          pdb:
            enabled: true
            minAvailable: 2
    asserts:
      - failedTemplate:
          errorMessage: "deployments.main.pdb.minAvailable: 2 allows no voluntary eviction with the default of 2 replicas, so kubectl drain and cluster-autoscaler scale-down never finish on its node. Lower it, or set maxUnavailable: 0 instead to block evictions on purpose."

  - it: should fail a percentage that rounds up to the count
    set:
      deployments:
        main:
          image: "nginx:1.25"
          replicaCount: 2
          pdb:
            enabled: true
            minAvailable: "60%"
    asserts:
      - failedTemplate:
          errorMessage: "deployments.main.pdb.minAvailable: 60% allows no voluntary eviction with deployments.main.replicaCount: 2, so kubectl drain and cluster-autoscaler scale-down never finish on its node. Lower it, or set maxUnavailable: 0 instead to block evictions on purpose."

  - it: should fail a minAvailable reaching the HPA floor
    set:
      deployments:
        main:
          image: "nginx:1.25"
          autoscaling:
            enabled: true
            minReplicas: 1
            maxReplicas: 5
            targetCPUUtilizationPercentage: 80
          pdb:
            enabled: true
            minAvailable: 1
    asserts:
      - failedTemplate:
          errorMessage: "deployments.main.pdb.minAvailable: 1 allows no voluntary eviction with deployments.main.autoscaling.minReplicas: 1, so kubectl drain and cluster-autoscaler scale-down never finish on its node. Lower it, or set maxUnavailable: 0 instead to block evictions on purpose."

  - it: should fail a minAvailable reaching the KEDA floor
    set:
      deployments:
        main:
          image: "nginx:1.25"
          keda:
            enabled: true
            minReplicaCount: 1
            triggers:
              - type: cpu
                metadata:
                  value: "50"
          pdb:
            enabled: true
            minAvailable: 1
    asserts:
      - failedTemplate:
          errorMessage: "deployments.main.pdb.minAvailable: 1 allows no voluntary eviction with deployments.main.keda.minReplicaCount: 1, so kubectl drain and cluster-autoscaler scale-down never finish on its node. Lower it, or set maxUnavailable: 0 instead to block evictions on purpose."

  - it: should fail a StatefulSet whose minAvailable reaches its replica count
    set:
      deployments:
        main:
          kind: StatefulSet
          image: "nginx:1.25"
          replicaCount: 1
          pdb:
            enabled: true
            minAvailable: 1
    asserts:
      - failedTemplate:
          errorMessage: "deployments.main.pdb.minAvailable: 1 allows no voluntary eviction with deployments.main.replicaCount: 1, so kubectl drain and cluster-autoscaler scale-down never finish on its node. Lower it, or set maxUnavailable: 0 instead to block evictions on purpose."

  - it: should fail a percentage that rounds up to the HPA floor
    set:
      deployments:
        main:
          image: "nginx:1.25"
          autoscaling:
            enabled: true
            minReplicas: 2
            maxReplicas: 5
            targetCPUUtilizationPercentage: 80
          pdb:
            enabled: true
            minAvailable: "60%"
    asserts:
      - failedTemplate:
          errorMessage: "deployments.main.pdb.minAvailable: 60% allows no voluntary eviction with deployments.main.autoscaling.minReplicas: 2, so kubectl drain and cluster-autoscaler scale-down never finish on its node. Lower it, or set maxUnavailable: 0 instead to block evictions on purpose."

  - it: should render a StatefulSet whose minAvailable is below its replica count
    set:
      deployments:
        main:
          kind: StatefulSet
          image: "nginx:1.25"
          replicaCount: 3
          pdb:
            enabled: true
            minAvailable: 2
    asserts:
      - hasDocuments:
          count: 1

  - it: should render a minAvailable below the fixed count
    set:
      deployments:
        main:
          image: "nginx:1.25"
          replicaCount: 3
          pdb:
            enabled: true
            minAvailable: 2
    asserts:
      - hasDocuments:
          count: 1

  - it: should render a percentage that rounds up below the count
    set:
      deployments:
        main:
          image: "nginx:1.25"
          replicaCount: 2
          pdb:
            enabled: true
            minAvailable: "50%"
    asserts:
      - hasDocuments:
          count: 1

  - it: should render minAvailable 100% as a deliberate block
    set:
      deployments:
        main:
          image: "nginx:1.25"
          replicaCount: 1
          pdb:
            enabled: true
            minAvailable: "100%"
    asserts:
      - hasDocuments:
          count: 1

  - it: should render maxUnavailable 0 as a deliberate block
    set:
      deployments:
        main:
          image: "nginx:1.25"
          replicaCount: 1
          pdb:
            enabled: true
            maxUnavailable: 0
    asserts:
      - hasDocuments:
          count: 1

  - it: should render maxUnavailable "0%" as a deliberate block
    set:
      deployments:
        main:
          image: "nginx:1.25"
          replicaCount: 1
          pdb:
            enabled: true
            maxUnavailable: "0%"
    asserts:
      - hasDocuments:
          count: 1

  - it: should render a PDB on a workload with no replicas
    set:
      deployments:
        main:
          image: "nginx:1.25"
          replicaCount: 0
          pdb:
            enabled: true
            minAvailable: 1
    asserts:
      - hasDocuments:
          count: 1

  - it: should render a minAvailable below the HPA floor
    set:
      deployments:
        main:
          image: "nginx:1.25"
          autoscaling:
            enabled: true
            minReplicas: 2
            maxReplicas: 5
            targetCPUUtilizationPercentage: 80
          pdb:
            enabled: true
            minAvailable: 1
    asserts:
      - hasDocuments:
          count: 1

  - it: should render a PDB with a KEDA floor of 0
    set:
      deployments:
        main:
          image: "nginx:1.25"
          keda:
            enabled: true
            minReplicaCount: 0
            triggers:
              - type: cpu
                metadata:
                  value: "50"
          pdb:
            enabled: true
            minAvailable: 1
    asserts:
      - hasDocuments:
          count: 1

  - it: should render a PDB with KEDA's default floor
    set:
      deployments:
        main:
          image: "nginx:1.25"
          keda:
            enabled: true
            triggers:
              - type: cpu
                metadata:
                  value: "50"
          pdb:
            enabled: true
            minAvailable: 1
    asserts:
      - hasDocuments:
          count: 1

  # The API server rejects a percentage above 100% (IsNotMoreThan100Percent).
  - it: should reject a minAvailable percentage above 100%
    set:
      deployments:
        main:
          image: "nginx:1.25"
          pdb:
            enabled: true
            minAvailable: "150%"
    asserts:
      - failedTemplate:
          errorPattern: "minAvailable"
