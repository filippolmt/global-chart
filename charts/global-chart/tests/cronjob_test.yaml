  # ====== Root-level SA parity with root-level hooks (see hook_test.yaml) ======
  - it: should create the ServiceAccount the pod references when root cronjob sets none
    release:
      name: t
    set:
      cronJobs:
        cleanup:
          schedule: "0 0 * * *"
          image: busybox:1.36
    asserts:
      - hasDocuments:
          count: 2
      - equal:
          path: metadata.name
          value: t-global-chart-cleanup
        documentSelector:
          path: kind
          value: ServiceAccount
      - equal:
          path: spec.jobTemplate.spec.template.spec.serviceAccountName
          value: t-global-chart-cleanup
        documentSelector:
          path: kind
          value: CronJob

  - it: should honor serviceAccount.name on a root-level cronjob
    set:
      cronJobs:
        cleanup:
          schedule: "0 0 * * *"
          image: busybox:1.36
          serviceAccount:
            name: existing-sa
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: CronJob
      - equal:
          path: spec.jobTemplate.spec.template.spec.serviceAccountName
          value: existing-sa

  - it: should honor serviceAccount.automount on a created root-level cronjob SA
    set:
      cronJobs:
        cleanup:
          schedule: "0 0 * * *"
          image: busybox:1.36
          serviceAccount:
            automount: false
    asserts:
      - equal:
          path: automountServiceAccountToken
          value: false
        documentSelector:
          path: kind
          value: ServiceAccount

  - it: should leave the pod on the namespace default SA when create is false and nothing names one
    set:
      cronJobs:
        cleanup:
          schedule: "0 0 * * *"
          image: busybox:1.36
          serviceAccount:
            create: false
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: CronJob
      # Not the generated name: nothing would create it, and the pod would never
      # schedule. No name at all means the namespace default.
      - isNull:
          path: spec.jobTemplate.spec.template.spec.serviceAccountName

  - it: should create the SA under an explicit serviceAccountName when create is true
    set:
      cronJobs:
        cleanup:
          schedule: "0 0 * * *"
          image: busybox:1.36
          serviceAccountName: custom-sa
          serviceAccount:
            create: true
    asserts:
      - hasDocuments:
          count: 2
      - equal:
          path: metadata.name
          value: custom-sa
        documentSelector:
          path: kind
          value: ServiceAccount
      - equal:
          path: spec.jobTemplate.spec.template.spec.serviceAccountName
          value: custom-sa
        documentSelector:
          path: kind
          value: CronJob

  - it: should create the deployment-level cronjob SA under an explicit serviceAccountName
    set:
      deployments:
        backend:
