  # ====== Root-level cronJobs inherit nothing from deployments ======
  # Same guard as hook_test.yaml: cronjob.yaml PART 1 omits "deploy" in its
  # jobPodSpec call, and nothing but that omission keeps the inheritance chain
  # inactive for root-level cronJobs (CLAUDE.md pattern 5, "Asymmetry").
  - it: should inherit nothing from a deployment for a root-level cronjob
    documentSelector:
      path: kind
      value: CronJob
    set:
      deployments:
        backend:
          image: myapp:v1
          imagePullSecrets:
            - name: deploy-pull-secret
          hostAliases:
            - ip: "127.0.0.1"
              hostnames:
                - "foo.local"
          podSecurityContext:
            runAsUser: 1000
          securityContext:
            readOnlyRootFilesystem: true
          dnsConfig:
            nameservers:
              - "10.0.0.1"
          nodeSelector:
            disktype: ssd
          tolerations:
            - key: "node-role"
              operator: "Exists"
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: kubernetes.io/os
                        operator: In
                        values: ["linux"]
          additionalEnvs:
            - name: FROM_DEPLOYMENT
              value: "yes"
          configMap:
            DEPLOY_KEY: deploy-value
          secret:
            DEPLOY_SECRET: deploy-secret-value
          envFromConfigMaps:
            - deploy-external-cm
          envFromSecrets:
            - deploy-external-secret
      cronJobs:
        standalone:
          schedule: "0 2 * * *"
          image: myapp:v1
          command: ["./standalone.sh"]
    asserts:
      - isNull:
          path: spec.jobTemplate.spec.template.spec.imagePullSecrets
      - isNull:
          path: spec.jobTemplate.spec.template.spec.hostAliases
      - isNull:
          path: spec.jobTemplate.spec.template.spec.securityContext
      - isNull:
          path: spec.jobTemplate.spec.template.spec.dnsConfig
      - isNull:
          path: spec.jobTemplate.spec.template.spec.nodeSelector
      - isNull:
          path: spec.jobTemplate.spec.template.spec.tolerations
      - isNull:
          path: spec.jobTemplate.spec.template.spec.affinity
      - isNull:
          path: spec.jobTemplate.spec.template.spec.containers[0].securityContext
      - isNull:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
      - isNull:
          path: spec.jobTemplate.spec.template.spec.containers[0].envFrom

