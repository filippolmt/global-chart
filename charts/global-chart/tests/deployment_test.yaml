suite: deployment template tests
templates:
  - templates/deployment.yaml
tests:
  # ====== enabled flag ======
  - it: should not render deployment when enabled is false
    set:
      deployments:
        main:
          enabled: false
          image: nginx:1.25
    asserts:
      - hasDocuments:
          count: 0

  - it: should render deployment when enabled is true
    set:
      deployments:
        main:
          enabled: true
          image: nginx:1.25
    asserts:
      - hasDocuments:
          count: 1

  - it: should render deployment when enabled is not set (default true)
    set:
      deployments:
        main:
          image: nginx:1.25
    asserts:
      - hasDocuments:
          count: 1

  # ====== command / args ======
  - it: should render command and args on the main container
    set:
      deployments:
        main:
          image: nginx:1.25
          command: ["python", "-m", "app.worker"]
          args: ["--concurrency", "4"]
    asserts:
      - equal:
          path: spec.template.spec.containers[0].command
          value: ["python", "-m", "app.worker"]
      - equal:
          path: spec.template.spec.containers[0].args
          value: ["--concurrency", "4"]

  - it: should render command without args
    set:
      deployments:
        main:
          image: nginx:1.25
          command: ["python", "-m", "app.worker"]
    asserts:
      - equal:
          path: spec.template.spec.containers[0].command
          value: ["python", "-m", "app.worker"]
      - isNull:
          path: spec.template.spec.containers[0].args

  - it: should render args without command
    set:
      deployments:
        main:
          image: nginx:1.25
          args: ["--verbose"]
    asserts:
      - isNull:
          path: spec.template.spec.containers[0].command
      - equal:
          path: spec.template.spec.containers[0].args
          value: ["--verbose"]

  - it: should not render command or args when not set
    set:
      deployments:
        main:
          image: nginx:1.25
    asserts:
      - isNull:
          path: spec.template.spec.containers[0].command
      - isNull:
          path: spec.template.spec.containers[0].args

  - it: should not render command or args when set to empty lists
    set:
      deployments:
        main:
          image: nginx:1.25
          command: []
          args: []
    asserts:
      - isNull:
          path: spec.template.spec.containers[0].command
      - isNull:
          path: spec.template.spec.containers[0].args

  # ====== extraContainers (Bug Fix #1) ======
  - it: should render extraContainers as sidecar
    set:
      deployments:
        main:
          image: nginx:1.25
          extraContainers:
            - name: sidecar
              image: busybox:1.28
              command: ["sh", "-c", "echo sidecar"]
    asserts:
      - contains:
          path: spec.template.spec.containers
          content:
            name: sidecar
            image: busybox:1.28
            command: ["sh", "-c", "echo sidecar"]

  - it: should not render extraContainers when not set
    set:
      deployments:
        main:
          image: nginx:1.25
    asserts:
      - lengthEqual:
          path: spec.template.spec.containers
          count: 1

  # ====== securityContext container-level (Bug Fix #2) ======
  - it: should render container-level securityContext
    set:
      deployments:
        main:
          image: nginx:1.25
          securityContext:
            runAsUser: 1000
            runAsNonRoot: true
            readOnlyRootFilesystem: true
    asserts:
      - equal:
          path: spec.template.spec.containers[0].securityContext.runAsUser
          value: 1000
      - equal:
          path: spec.template.spec.containers[0].securityContext.runAsNonRoot
          value: true
      - equal:
          path: spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem
          value: true

  - it: should not render container securityContext when not set
    set:
      deployments:
        main:
          image: nginx:1.25
    asserts:
      - isNull:
          path: spec.template.spec.containers[0].securityContext

  # ====== additionalEnvs (Bug Fix #3) ======
  - it: should render additionalEnvs with valueFrom
    set:
      deployments:
        main:
          image: nginx:1.25
          additionalEnvs:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: POD_NAME
            valueFrom:
              fieldRef:
                fieldPath: metadata.name

  - it: should render additionalEnvs with literal value
    set:
      deployments:
        main:
          image: nginx:1.25
          additionalEnvs:
            - name: MY_VAR
              value: "hello"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: MY_VAR
            value: "hello"

  - it: should render additionalEnvs mixing value and valueFrom
    set:
      deployments:
        main:
          image: nginx:1.25
          additionalEnvs:
            - name: LITERAL
              value: "world"
            - name: FROM_SECRET
              valueFrom:
                secretKeyRef:
                  name: my-secret
                  key: password
    asserts:
      - lengthEqual:
          path: spec.template.spec.containers[0].env
          count: 2

  # ====== podSecurityContext ======
  - it: should render podSecurityContext
    set:
      deployments:
        main:
          image: nginx:1.25
          podSecurityContext:
            fsGroup: 2000
            runAsGroup: 3000
    asserts:
      - equal:
          path: spec.template.spec.securityContext.fsGroup
          value: 2000
      - equal:
          path: spec.template.spec.securityContext.runAsGroup
          value: 3000

  # ====== extraInitContainers ======
  - it: should render extraInitContainers
    set:
      deployments:
        main:
          image: nginx:1.25
          extraInitContainers:
            - name: init-db
              image: busybox:1.28
              command: ["sh", "-c", "echo init"]
    asserts:
      - contains:
          path: spec.template.spec.initContainers
          content:
            name: init-db
            image: busybox:1.28
            command: ["sh", "-c", "echo init"]

  - it: should render extraInitContainers with full spec
    set:
      deployments:
        main:
          image: nginx:1.25
          extraInitContainers:
            - name: init-db
              image: busybox:1.36
              command: ["sh", "-c", "echo init"]
              env:
                - name: DB_HOST
                  value: postgres
    asserts:
      - equal:
          path: spec.template.spec.initContainers[0].name
          value: init-db
      - equal:
          path: spec.template.spec.initContainers[0].image
          value: busybox:1.36
      - equal:
          path: spec.template.spec.initContainers[0].command[0]
          value: sh
      - equal:
          path: spec.template.spec.initContainers[0].env[0].name
          value: DB_HOST

  - it: should not render initContainers when extraInitContainers not set
    set:
      deployments:
        main:
          image: nginx:1.25
    asserts:
      - notExists:
          path: spec.template.spec.initContainers

  # ====== image with digest ======
  - it: should render image with digest
    set:
      deployments:
        main:
          image:
            repository: nginx
            digest: sha256:abc123
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: "nginx@sha256:abc123"

  # ====== resources ======
  - it: should render resources
    set:
      deployments:
        main:
          image: nginx:1.25
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources.requests.cpu
          value: 100m
      - equal:
          path: spec.template.spec.containers[0].resources.limits.memory
          value: 512Mi

  # ====== container port (issue #82) ======
  - it: should default containerPort to service.port
    set:
      deployments:
        main:
          image: nginx:1.25
          service:
            port: 8080
    asserts:
      - equal:
          path: spec.template.spec.containers[0].ports[0].containerPort
          value: 8080

  - it: should default containerPort to 80 when service.port is unset
    set:
      deployments:
        main:
          image: nginx:1.25
    asserts:
      - equal:
          path: spec.template.spec.containers[0].ports[0].containerPort
          value: 80

  - it: should derive containerPort from a numeric service.targetPort
    set:
      deployments:
        main:
          image: nginx:1.25
          service:
            port: 80
            targetPort: 8080
    asserts:
      - equal:
          path: spec.template.spec.containers[0].ports[0].containerPort
          value: 8080
      - equal:
          path: spec.template.spec.containers[0].ports[0].name
          value: http

  - it: should fall back to service.port when service.targetPort is a port name
    set:
      deployments:
        main:
          image: nginx:1.25
          service:
            port: 8080
            targetPort: http
    asserts:
      - equal:
          path: spec.template.spec.containers[0].ports[0].containerPort
          value: 8080

  - it: should name the derived containerPort with service.portName
    set:
      deployments:
        main:
          image: nginx:1.25
          service:
            port: 80
            targetPort: 9000
            portName: api
    asserts:
      - equal:
          path: spec.template.spec.containers[0].ports[0].containerPort
          value: 9000
      - equal:
          path: spec.template.spec.containers[0].ports[0].name
          value: api

  - it: should name the primary container port after service.portName and target it by default
    set:
      deployments:
        main:
          image: nginx:1.25
          service:
            port: 8080
            portName: api
    asserts:
      - equal:
          path: spec.template.spec.containers[0].ports[0].name
          value: api
      - equal:
          path: spec.template.spec.containers[0].ports[0].containerPort
          value: 8080

  - it: should declare a container port for every numeric extraPorts targetPort
    set:
      deployments:
        main:
          image: nginx:1.25
          service:
            port: 8069
            portName: odoo
            extraPorts:
              - name: gevent
                port: 8072
                targetPort: 8072
                protocol: TCP
    asserts:
      - lengthEqual:
          path: spec.template.spec.containers[0].ports
          count: 2
      - equal:
          path: spec.template.spec.containers[0].ports[1].name
          value: gevent
      - equal:
          path: spec.template.spec.containers[0].ports[1].containerPort
          value: 8072
      - equal:
          path: spec.template.spec.containers[0].ports[1].protocol
          value: TCP

  - it: should not declare a container port for a named extraPorts targetPort
    set:
      deployments:
        main:
          image: nginx:1.25
          service:
            port: 8069
            portName: odoo
            extraPorts:
              - name: gevent
                port: 8072
                targetPort: 8072
              - name: ws
                port: 8073
                targetPort: gevent
    asserts:
      - lengthEqual:
          path: spec.template.spec.containers[0].ports
          count: 2

  - it: should not declare a duplicate container port when extraPorts repeats the primary port
    set:
      deployments:
        main:
          image: nginx:1.25
          service:
            port: 8069
            extraPorts:
              - name: same-number
                port: 9000
                targetPort: 8069
    asserts:
      - lengthEqual:
          path: spec.template.spec.containers[0].ports
          count: 1
      - equal:
          path: spec.template.spec.containers[0].ports[0].name
          value: http

  - it: should declare the same port number twice when the protocols differ
    set:
      deployments:
        main:
          image: coredns:1.11
          service:
            port: 53
            portName: dns-tcp
            targetPort: 53
            protocol: TCP
            extraPorts:
              - name: dns-udp
                port: 53
                targetPort: 53
                protocol: UDP
    asserts:
      - lengthEqual:
          path: spec.template.spec.containers[0].ports
          count: 2
      - equal:
          path: spec.template.spec.containers[0].ports[1].name
          value: dns-udp
      - equal:
          path: spec.template.spec.containers[0].ports[1].containerPort
          value: 53
      - equal:
          path: spec.template.spec.containers[0].ports[1].protocol
          value: UDP

  - it: should not declare a duplicate container port when extraPorts repeats the primary name
    set:
      deployments:
        main:
          image: nginx:1.25
          service:
            port: 8069
            extraPorts:
              - name: http
                port: 9000
                targetPort: 9000
    asserts:
      - lengthEqual:
          path: spec.template.spec.containers[0].ports
          count: 1
      - equal:
          path: spec.template.spec.containers[0].ports[0].containerPort
          value: 8069

  # ====== probes ======
  - it: should render liveness and readiness probes
    set:
      deployments:
        main:
          image: nginx:1.25
          livenessProbe:
            httpGet:
              path: /health
              port: http
          readinessProbe:
            httpGet:
              path: /ready
              port: http
    asserts:
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.path
          value: /health
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.path
          value: /ready

  - it: should render startupProbe when configured
    set:
      deployments:
        main:
          image: nginx:1.25
          startupProbe:
            httpGet:
              path: /startup
              port: http
            failureThreshold: 30
            periodSeconds: 10
    asserts:
      - equal:
          path: spec.template.spec.containers[0].startupProbe.httpGet.path
          value: /startup
      - equal:
          path: spec.template.spec.containers[0].startupProbe.failureThreshold
          value: 30
      - equal:
          path: spec.template.spec.containers[0].startupProbe.periodSeconds
          value: 10

  - it: should not render probes when not configured
    set:
      deployments:
        main:
          image: nginx:1.25
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].livenessProbe
      - notExists:
          path: spec.template.spec.containers[0].readinessProbe
      - notExists:
          path: spec.template.spec.containers[0].startupProbe

  - it: should render all three probe types simultaneously
    set:
      deployments:
        main:
          image: nginx:1.25
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
          readinessProbe:
            tcpSocket:
              port: 8080
          startupProbe:
            exec:
              command: ["/bin/check"]
    asserts:
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.path
          value: /healthz
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.tcpSocket.port
          value: 8080
      - equal:
          path: spec.template.spec.containers[0].startupProbe.exec.command[0]
          value: /bin/check

  # ====== lifecycle + terminationGracePeriodSeconds ======
  - it: should render lifecycle preStop hook when configured
    set:
      deployments:
        main:
          image: nginx:1.25
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]
    asserts:
      - equal:
          path: spec.template.spec.containers[0].lifecycle.preStop.exec.command[0]
          value: /bin/sh
      - equal:
          path: spec.template.spec.containers[0].lifecycle.preStop.exec.command[2]
          value: sleep 5

  - it: should render lifecycle postStart hook when configured
    set:
      deployments:
        main:
          image: nginx:1.25
          lifecycle:
            postStart:
              httpGet:
                path: /warmup
                port: http
    asserts:
      - equal:
          path: spec.template.spec.containers[0].lifecycle.postStart.httpGet.path
          value: /warmup

  - it: should not render lifecycle when not configured
    set:
      deployments:
        main:
          image: nginx:1.25
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].lifecycle

  - it: should render terminationGracePeriodSeconds when configured
    set:
      deployments:
        main:
          image: nginx:1.25
          terminationGracePeriodSeconds: 60
    asserts:
      - equal:
          path: spec.template.spec.terminationGracePeriodSeconds
          value: 60

  - it: should render terminationGracePeriodSeconds 0 when explicitly set to zero
    set:
      deployments:
        main:
          image: nginx:1.25
          terminationGracePeriodSeconds: 0
    asserts:
      - equal:
          path: spec.template.spec.terminationGracePeriodSeconds
          value: 0

  - it: should not render terminationGracePeriodSeconds when not configured
    set:
      deployments:
        main:
          image: nginx:1.25
    asserts:
      - notExists:
          path: spec.template.spec.terminationGracePeriodSeconds

  # ====== envFrom ======
  - it: should render envFrom with configMap and secret
    set:
      deployments:
        main:
          image: nginx:1.25
          configMap:
            KEY: value
          secret:
            PASSWORD: secret
          envFromConfigMaps:
            - external-cm
          envFromSecrets:
            - external-secret
    asserts:
      - isNotNull:
          path: spec.template.spec.containers[0].envFrom

  # The last envFrom source wins on a shared key, so the order is a domain rule,
  # not a rendering detail. A Deployment orders its sources **by type**: every
  # non-secret source first, then every secret one, so a secret always beats a
  # plaintext configuration. Its jobs order **by proximity** instead, and the
  # twin of this case in cronjob_test.yaml holds that end. Assert the whole list:
  # `contains` passes whatever the order, which is how the two ends drifted
  # unobserved in the first place.
  - it: should order envFrom by type, non-secret sources before secret ones
    set:
      deployments:
        main:
          image: nginx:1.25
          configMap:
            KEY: value
          secret:
            PASSWORD: secret
          envFromConfigMaps:
            - external-cm
          envFromSecrets:
            - external-secret
    asserts:
      - equal:
          path: spec.template.spec.containers[0].envFrom
          value:
            - configMapRef:
                name: RELEASE-NAME-global-chart-main
            - configMapRef:
                name: external-cm
            - secretRef:
                name: RELEASE-NAME-global-chart-main
            - secretRef:
                name: external-secret

  - it: should place externalSecrets entries in the secret group, and mount the ones with a mountPath
    set:
      externalSecrets:
        app-env:
          secretstore: { kind: ClusterSecretStore, name: store }
          secretkey: PASSWORD
          remote: { key: app/password }
        app-conf:
          secretstore: { kind: ClusterSecretStore, name: store }
          secretkey: app.conf
          remote: { key: app/conf }
      deployments:
        main:
          image: nginx:1.25
          configMap:
            KEY: value
          envFromSecrets:
            - external-secret
          externalSecrets:
            - name: app-env
            - name: app-conf
              mountPath: /etc/app
          hooks:
            pre-install:
              migrate:
                command: ["true"]
    asserts:
      # The Deployment always reads the real Secret, never the hook copy
      - equal:
          path: spec.template.spec.containers[0].envFrom
          value:
            - configMapRef:
                name: RELEASE-NAME-global-chart-main
            - secretRef:
                name: external-secret
            - secretRef:
                name: RELEASE-NAME-global-chart-app-env
      - equal:
          path: spec.template.spec.containers[0].volumeMounts
          value:
            - name: es-app-conf
              mountPath: /etc/app
              readOnly: true
      - equal:
          path: spec.template.spec.volumes
          value:
            - name: es-app-conf
              secret:
                secretName: RELEASE-NAME-global-chart-app-conf

  - it: should fail when a mounted externalSecrets entry lands on the name of a deployment volume
    set:
      externalSecrets:
        app-conf:
          secretstore: { kind: ClusterSecretStore, name: store }
          secretkey: app.conf
          remote: { key: app/conf }
      deployments:
        main:
          image: nginx:1.25
          volumes:
            - name: es-app-conf
              emptyDir: {}
          externalSecrets:
            - name: app-conf
              mountPath: /etc/app
    asserts:
      - failedTemplate:
          errorPattern: "deployments.main.externalSecrets: the volume 'es-app-conf' generated for 'app-conf' is already declared"

  - it: should fail when the deployment names an unknown ExternalSecret key
    set:
      deployments:
        main:
          image: nginx:1.25
          externalSecrets:
            - name: missing
    asserts:
      - failedTemplate:
          errorPattern: "deployments.main.externalSecrets references 'missing', which is not a key of externalSecrets"

  # ====== replicas with autoscaling ======
  - it: should not set replicas when autoscaling is enabled
    set:
      deployments:
        main:
          image: nginx:1.25
          autoscaling:
            enabled: true
            minReplicas: 2
            maxReplicas: 10
            targetCPUUtilizationPercentage: 80
    asserts:
      - isNull:
          path: spec.replicas

  - it: should set replicas when autoscaling is disabled
    set:
      deployments:
        main:
          image: nginx:1.25
          replicaCount: 3
    asserts:
      - equal:
          path: spec.replicas
          value: 3

  # ====== replicas with KEDA ======
  # An autoscaler owns spec.replicas. Emitting it makes every `helm upgrade`
  # snap the Deployment back, and with minReplicaCount: 0 it wakes a workload
  # that was deliberately scaled to zero.
  - it: should not set replicas when keda is enabled
    set:
      deployments:
        main:
          image: nginx:1.25
          keda:
            enabled: true
            minReplicaCount: 0
            maxReplicaCount: 10
            triggers:
              - type: cron
                metadata: { timezone: UTC, start: "0 0 * * *", end: "59 23 * * *", desiredReplicas: "3" }
    asserts:
      - isNull:
          path: spec.replicas

  - it: should not set replicas when keda is enabled even with an explicit replicaCount
    set:
      deployments:
        main:
          image: nginx:1.25
          replicaCount: 3
          keda:
            enabled: true
            triggers:
              - type: cron
                metadata: { timezone: UTC, start: "0 0 * * *", end: "59 23 * * *", desiredReplicas: "3" }
    asserts:
      - isNull:
          path: spec.replicas

  - it: should set replicas when keda is present but disabled
    set:
      deployments:
        main:
          image: nginx:1.25
          replicaCount: 3
          keda:
            enabled: false
            triggers:
              - type: cron
                metadata: { timezone: UTC, start: "0 0 * * *", end: "59 23 * * *", desiredReplicas: "3" }
    asserts:
      - equal:
          path: spec.replicas
          value: 3

  # ====== deployment naming ======
  - it: should name deployment correctly
    release:
      name: myrelease
    set:
      deployments:
        api:
          image: nginx:1.25
    asserts:
      - equal:
          path: metadata.name
          value: myrelease-global-chart-api

  # ====== selector labels include component ======
  - it: should include component in selector labels
    set:
      deployments:
        web:
          image: nginx:1.25
    asserts:
      - isSubset:
          path: spec.selector.matchLabels
          content:
            app.kubernetes.io/component: web

  # ====== nodeSelector, tolerations, affinity ======
  - it: should render nodeSelector
    set:
      deployments:
        main:
          image: nginx:1.25
          nodeSelector:
            disktype: ssd
    asserts:
      - equal:
          path: spec.template.spec.nodeSelector.disktype
          value: ssd

  - it: should render tolerations
    set:
      deployments:
        main:
          image: nginx:1.25
          tolerations:
            - key: "dedicated"
              operator: "Equal"
              value: "special"
              effect: "NoSchedule"
    asserts:
      - contains:
          path: spec.template.spec.tolerations
          content:
            key: "dedicated"
            operator: "Equal"
            value: "special"
            effect: "NoSchedule"

  # ====== volumeMounts ======
  - it: should render volumeMounts and volumes
    set:
      deployments:
        main:
          image: nginx:1.25
          volumes:
            - name: data
              type: emptyDir
          volumeMounts:
            - name: data
              mountPath: /data
    asserts:
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: data
            mountPath: /data
      - contains:
          path: spec.template.spec.volumes
          content:
            name: data
            emptyDir: {}

  # ====== native volume spec ======
  - it: should render native volume spec (no .type field)
    set:
      deployments:
        main:
          image: "nginx:1.25"
          volumes:
            - name: data
              hostPath:
                path: /data
                type: DirectoryOrCreate
            - name: downward
              downwardAPI:
                items:
                  - path: labels
                    fieldRef:
                      fieldPath: metadata.labels
          volumeMounts:
            - name: data
              mountPath: /data
            - name: downward
              mountPath: /etc/podinfo
    asserts:
      - equal:
          path: spec.template.spec.volumes[0].name
          value: data
      - equal:
          path: spec.template.spec.volumes[0].hostPath.path
          value: /data
      - equal:
          path: spec.template.spec.volumes[1].name
          value: downward
      - exists:
          path: spec.template.spec.volumes[1].downwardAPI

  - it: should still render legacy .type volume spec (backward compat)
    set:
      deployments:
        main:
          image: "nginx:1.25"
          volumes:
            - name: myvolume
              type: secret
              secret:
                secretName: my-secret
            - name: myvolume2
              type: configMap
              configMap:
                name: my-config
          volumeMounts:
            - name: myvolume
              mountPath: /etc/secret
    asserts:
      - equal:
          path: spec.template.spec.volumes[0].name
          value: myvolume
      - equal:
          path: spec.template.spec.volumes[0].secret.secretName
          value: my-secret
      - equal:
          path: spec.template.spec.volumes[1].name
          value: myvolume2
      - equal:
          path: spec.template.spec.volumes[1].configMap.name
          value: my-config

  # ====== resources handling ======
  - it: should not render resources key when not specified
    set:
      deployments:
        main:
          image: "nginx:1.25"
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].resources

  - it: should render resources when specified
    set:
      deployments:
        main:
          image: "nginx:1.25"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources.requests.cpu
          value: 100m

  # ====== secret checksum ======
  - it: should include secret checksum in pod annotations
    set:
      deployments:
        main:
          image: "nginx:1.25"
          secret:
            DB_PASSWORD: "s3cret"
    asserts:
      - exists:
          path: spec.template.metadata.annotations.checksum/secret

  # ====== strategy ======
  - it: should render strategy when configured
    set:
      deployments:
        main:
          image: "nginx:1.25"
          strategy:
            type: RollingUpdate
            rollingUpdate:
              maxSurge: 1
              maxUnavailable: 0
    asserts:
      - equal:
          path: spec.strategy.type
          value: RollingUpdate
      - equal:
          path: spec.strategy.rollingUpdate.maxSurge
          value: 1

  - it: should not render strategy when not configured
    set:
      deployments:
        main:
          image: "nginx:1.25"
    asserts:
      - notExists:
          path: spec.strategy

  # ====== revisionHistoryLimit ======
  - it: should render revisionHistoryLimit when configured
    set:
      deployments:
        main:
          image: "nginx:1.25"
          revisionHistoryLimit: 3
    asserts:
      - equal:
          path: spec.revisionHistoryLimit
          value: 3

  - it: should not render revisionHistoryLimit when not configured
    set:
      deployments:
        main:
          image: "nginx:1.25"
    asserts:
      - notExists:
          path: spec.revisionHistoryLimit

  # ====== progressDeadlineSeconds ======
  - it: should render progressDeadlineSeconds when configured
    set:
      deployments:
        main:
          image: "nginx:1.25"
          progressDeadlineSeconds: 120
    asserts:
      - equal:
          path: spec.progressDeadlineSeconds
          value: 120

  - it: should not render progressDeadlineSeconds when not configured
    set:
      deployments:
        main:
          image: "nginx:1.25"
    asserts:
      - notExists:
          path: spec.progressDeadlineSeconds

  # ====== topologySpreadConstraints ======
  - it: should render topologySpreadConstraints when configured
    set:
      deployments:
        main:
          image: "nginx:1.25"
          topologySpreadConstraints:
            - maxSkew: 1
              topologyKey: topology.kubernetes.io/zone
              whenUnsatisfiable: DoNotSchedule
              labelSelector:
                matchLabels:
                  app: web
    asserts:
      - equal:
          path: spec.template.spec.topologySpreadConstraints[0].maxSkew
          value: 1
      - equal:
          path: spec.template.spec.topologySpreadConstraints[0].topologyKey
          value: topology.kubernetes.io/zone

  - it: should not render topologySpreadConstraints when not configured
    set:
      deployments:
        main:
          image: "nginx:1.25"
    asserts:
      - notExists:
          path: spec.template.spec.topologySpreadConstraints

  # ====== global values ======
  - it: should prepend global.imageRegistry to image
    set:
      global:
        imageRegistry: registry.example.com
      deployments:
        main:
          image:
            repository: myapp
            tag: "v1"
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: "registry.example.com/myapp:v1"

  - it: should not prepend imageRegistry when not set
    set:
      deployments:
        main:
          image:
            repository: myapp
            tag: "v1"
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: "myapp:v1"

  - it: should use global.imagePullSecrets when deployment has none
    set:
      global:
        imagePullSecrets:
          - name: global-regcred
      deployments:
        main:
          image: "nginx:1.25"
    asserts:
      - equal:
          path: spec.template.spec.imagePullSecrets[0].name
          value: "global-regcred"

  - it: should prefer deployment imagePullSecrets over global
    set:
      global:
        imagePullSecrets:
          - name: global-regcred
      deployments:
        main:
          image: "nginx:1.25"
          imagePullSecrets:
            - name: local-regcred
    asserts:
      - equal:
          path: spec.template.spec.imagePullSecrets[0].name
          value: "local-regcred"

  # ====== falsy-safe replicaCount (hasKey) ======
  - it: should render replicaCount 0 when explicitly set
    set:
      deployments:
        main:
          image: nginx:1.25
          replicaCount: 0
    asserts:
      - equal:
          path: spec.replicas
          value: 0

  - it: should skip global imageRegistry when string image already contains a registry
    set:
      global:
        imageRegistry: registry.example.com
      deployments:
        main:
          image: "docker.io/nginx:1.25"
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: "docker.io/nginx:1.25"

  # ====== Deployment field gap closure ======

  - it: should render affinity when set on deployment
    set:
      deployments:
        main:
          image: nginx:1.25
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: zone
                        operator: In
                        values: ["us-east-1a"]
    asserts:
      - isNotNull:
          path: spec.template.spec.affinity.nodeAffinity
      - equal:
          path: spec.template.spec.affinity.nodeAffinity.requiredDuringSchedulingIgnoredDuringExecution.nodeSelectorTerms[0].matchExpressions[0].key
          value: zone
      - equal:
          path: spec.template.spec.affinity.nodeAffinity.requiredDuringSchedulingIgnoredDuringExecution.nodeSelectorTerms[0].matchExpressions[0].operator
          value: In

  - it: should not use global.imagePullSecrets when deployment sets empty list
    set:
      global:
        imagePullSecrets:
          - name: global-regcred
      deployments:
        main:
          image: nginx:1.25
          imagePullSecrets: []
    asserts:
      - isNull:
          path: spec.template.spec.imagePullSecrets

  # ====== global.commonLabels / global.commonAnnotations ======

  - it: should render global.commonLabels on deployment metadata
    set:
      global:
        commonLabels:
          team: platform
      deployments:
        main:
          image: nginx:1.25
    asserts:
      - equal:
          path: metadata.labels.team
          value: platform

  - it: should render global.commonAnnotations on deployment metadata
    set:
      global:
        commonAnnotations:
          owner: ops-team
      deployments:
        main:
          image: nginx:1.25
    asserts:
      - equal:
          path: metadata.annotations.owner
          value: ops-team

  - it: should render global.commonAnnotations on pod template
    set:
      global:
        commonAnnotations:
          owner: ops-team
      deployments:
        main:
          image: nginx:1.25
    asserts:
      - equal:
          path: spec.template.metadata.annotations.owner
          value: ops-team

  - it: should let podAnnotations win over global.commonAnnotations and the checksums
    set:
      global:
        commonAnnotations:
          owner: ops-team
          shared: from-global
      deployments:
        main:
          image: nginx:1.25
          podAnnotations:
            shared: from-pod
            checksum/config: pinned-by-hand
    asserts:
      - equal:
          path: spec.template.metadata.annotations.shared
          value: from-pod
      - equal:
          path: spec.template.metadata.annotations["checksum/config"]
          value: pinned-by-hand
      - equal:
          path: spec.template.metadata.annotations.owner
          value: ops-team

  - it: should let a blanked per-resource annotation win over global.commonAnnotations
    set:
      global:
        commonAnnotations:
          shared: from-global
      deployments:
        main:
          image: nginx:1.25
          podAnnotations:
            shared: ""
    asserts:
      - equal:
          path: spec.template.metadata.annotations.shared
          value: ""

  - it: should let podLabels win over global.commonLabels
    set:
      global:
        commonLabels:
          tier: from-global
      deployments:
        main:
          image: nginx:1.25
          podLabels:
            tier: from-pod
    asserts:
      - equal:
          path: spec.template.metadata.labels.tier
          value: from-pod

  - it: should not let global.commonLabels overwrite the identity labels the selector uses
    set:
      global:
        commonLabels:
          app.kubernetes.io/component: hijacked
      deployments:
        main:
          image: nginx:1.25
    asserts:
      - equal:
          path: spec.template.metadata.labels["app.kubernetes.io/component"]
          value: main
      - equal:
          path: spec.selector.matchLabels["app.kubernetes.io/component"]
          value: main

  - it: should not add global.commonLabels to selector matchLabels
    set:
      global:
        commonLabels:
          team: platform
      deployments:
        main:
          image: nginx:1.25
    asserts:
      - notExists:
          path: spec.selector.matchLabels.team

  # ====== Negative tests: fail/required paths ======
  - it: should render correctly with numeric-looking image tag
    set:
      deployments:
        main:
          image:
            repository: myapp/api
            tag: "1.25"
    asserts:
      - isKind:
          of: Deployment
      - matchRegex:
          path: spec.template.spec.containers[0].image
          pattern: "myapp/api:1\\.25"

  # NOTE: Deploy-level CronJob/Hook image-required checks (cronjob.yaml:175, hook.yaml:259)
  # are unreachable in practice because deployment.yaml catches missing image first. Skipped.

  - it: should fail when image map has repository but no tag or digest
    set:
      deployments:
        main:
          image:
            repository: myapp/api
    asserts:
      - failedTemplate:
          errorMessage: "deployments.main.image requires either a tag or digest when repository is provided"

  - it: should fail when image is nil
    set:
      deployments:
        main:
          image: null
    asserts:
      - failedTemplate:
          errorMessage: "deployments.main.image must define a repository with tag/digest or be a full image reference"

  - it: should fail when volume has no name
    set:
      deployments:
        main:
          image: "nginx:1.25"
          volumes:
            - emptyDir: {}
          volumeMounts:
            - name: myvol
              mountPath: /mnt
    asserts:
      - failedTemplate:
          errorPattern: "renderVolume: every volume entry must have a 'name' field"

  - it: should fail when volume uses unknown legacy type
    set:
      deployments:
        main:
          image: "nginx:1.25"
          volumes:
            - name: myvol
              type: nfs
          volumeMounts:
            - name: myvol
              mountPath: /mnt
    asserts:
      - failedTemplate:
          errorPattern: "renderVolume: unknown legacy volume type 'nfs'"

  - it: should fail when imagePullSecrets entry has no name key
    set:
      deployments:
        main:
          image: "nginx:1.25"
          imagePullSecrets:
            - badkey: value
    asserts:
      - failedTemplate:
          errorPattern: "at '/deployments/main/imagePullSecrets/0'"

  # ====== automountServiceAccountToken (pod-level, Issue #73) ======
  - it: should not render automountServiceAccountToken when not set
    set:
      deployments:
        main:
          image: nginx:1.25
    asserts:
      - notExists:
          path: spec.template.spec.automountServiceAccountToken

  - it: should render pod-level automountServiceAccountToken true when set
    set:
      deployments:
        main:
          image: nginx:1.25
          automountServiceAccountToken: true
    asserts:
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: true

  - it: should render pod-level automountServiceAccountToken false when set
    set:
      deployments:
        main:
          image: nginx:1.25
          automountServiceAccountToken: false
    asserts:
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: false

  # ====== Per-resource annotations (issue #112) ======
  - it: should merge the Deployment's own annotations over the common ones, apart from podAnnotations
    set:
      global:
        commonAnnotations:
          team: platform
          argocd.argoproj.io/sync-wave: "0"
      deployments:
        web:
          image: nginx:1.25
          annotations:
            argocd.argoproj.io/sync-wave: "1"
          podAnnotations:
            prometheus.io/scrape: "true"
    asserts:
      - equal:
          path: metadata.annotations
          value:
            team: platform
            argocd.argoproj.io/sync-wave: "1"
      # The pod template keeps the common value: the Deployment's own does not reach it
      - equal:
          path: spec.template.metadata.annotations["argocd.argoproj.io/sync-wave"]
          value: "0"
      - equal:
          path: spec.template.metadata.annotations["prometheus.io/scrape"]
          value: "true"

  # ====== Integers from values (issue #132) ======
  # A number read from a values file is a float64, which the default format
  # prints as 1e+07 from a million up: an integer field the API server rejects.
  # set: values reach the template as float64 too, so these fail without
  # global-chart.printScalar.
  - it: should render large integers in plain digits
    set:
      deployments:
        main:
          image: nginx:1.25
          replicaCount: 10000000
          revisionHistoryLimit: 10000000
          progressDeadlineSeconds: 10000000
          terminationGracePeriodSeconds: 10000000
    asserts:
      - equal:
          path: spec.replicas
          value: 10000000
      - equal:
          path: spec.revisionHistoryLimit
          value: 10000000
      - equal:
          path: spec.progressDeadlineSeconds
          value: 10000000
      - equal:
          path: spec.template.spec.terminationGracePeriodSeconds
          value: 10000000

  # ====== Numbers from values in string fields (issue #132) ======
  # A values-file number is a float64, and toString prints it as 1e+07 from a
  # million up: the API server accepts that in a string field and the
  # application silently reads the wrong value. A non-integral float keeps its
  # form (1.5 is never truncated). set: values reach the template as float64.
  - it: should render a large dnsConfig option value in plain digits and keep a fraction
    set:
      deployments:
        main:
          image: nginx:1.25
          dnsConfig:
            options:
              - name: ndots
                value: 10000000
              - name: timeout
                value: 1.5
    asserts:
      - equal:
          path: spec.template.spec.dnsConfig.options[0].value
          value: "10000000"
      - equal:
          path: spec.template.spec.dnsConfig.options[1].value
          value: "1.5"

  # Set means present and not null: 0 and "" are values the user wrote, and
  # used to be dropped by a truthiness test.
  - it: should keep a dnsConfig option value of 0 or empty and omit an absent one
    set:
      deployments:
        main:
          image: nginx:1.25
          dnsConfig:
            options:
              - name: ndots
                value: 0
              - name: edns0
                value: ""
              - name: single-request
    asserts:
      - equal:
          path: spec.template.spec.dnsConfig.options
          value:
            - name: ndots
              value: "0"
            - name: edns0
              value: ""
            - name: single-request

  # The tag is string-only (issue #138): a bare 1.20 is the number 1.2 before
  # any template sees it. Quoted, the trailing zero survives.
  - it: should keep a quoted numeric-looking image tag verbatim
    set:
      deployments:
        main:
          image:
            repository: nginx
            tag: "1.20"
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: nginx:1.20

  # A missing targetPath rendered `mountPath:` as null, rejected at apply
  # (issue #157).
  - it: should fail when a mountedConfigFiles entry has no targetPath
    set:
      deployments:
        main:
          image: nginx:1.25
          mountedConfigFiles:
            files:
              - name: myconfig
                filename: config.yaml
                content: "a: b"
    asserts:
      - failedTemplate:
          errorMessage: "deployments.main.mountedConfigFiles.files[0] (myconfig): 'targetPath' is required"

  # imagePullSecrets items share global.imagePullSecrets' shape: a number
  # used to pass the schema and crash the render (issue #158).
  - it: should reject an imagePullSecrets item that is neither a string nor a name map
    set:
      deployments:
        main:
          image: nginx:1.25
          imagePullSecrets: [regcred, { name: other }, 5]
    asserts:
      - failedTemplate:
          errorPattern: "at '/deployments/main/imagePullSecrets/2'"

  - it: should render imagePullSecrets given as strings and as name maps
    set:
      deployments:
        main:
          image: nginx:1.25
          imagePullSecrets: [regcred, { name: other }]
    asserts:
      - equal:
          path: spec.template.spec.imagePullSecrets
          value:
            - name: regcred
            - name: other

  # The mounted file's name and paths are quoted like its ConfigMap key
  # (issue #152): a bare 1.10 reached the API server as the float 1.1
  - it: should quote the mounted file's paths
    set:
      deployments:
        main:
          image: nginx:1.25
          mountedConfigFiles:
            files:
              - name: myconfig
                filename: "1.10"
                targetPath: /etc/1.10
                content: "a"
            bundles:
              - mountDir: /etc/bundle
                files:
                  - name: appconfig
                    relPath: sub/1.20
                    content: "b"
    asserts:
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[0].subPath
          value: "1.10"
      - equal:
          path: spec.template.spec.volumes[1].projected.sources[0].configMap.items[0]
          value: { key: "1.20", path: sub/1.20 }

  # A bundle with no mountDir rendered `mountPath:` as null (issue #157)
  - it: should fail when a mountedConfigFiles bundle has no mountDir
    set:
      deployments:
        main:
          image: nginx:1.25
          mountedConfigFiles:
            bundles:
              - files:
                  - name: appconfig
                    relPath: sub/app.yaml
                    content: "b"
    asserts:
      - failedTemplate:
          errorMessage: "deployments.main.mountedConfigFiles.bundles[0]: 'mountDir' is required"

  # ====== priorityClassName (issue #168) ======
  - it: should render priorityClassName when set
    set:
      deployments:
        main:
          image: nginx:1.25
          priorityClassName: prod-high
    asserts:
      - equal:
          path: spec.template.spec.priorityClassName
          value: prod-high

  - it: should omit priorityClassName when unset
    set:
      deployments:
        main:
          image: nginx:1.25
    asserts:
      - notExists:
          path: spec.template.spec.priorityClassName
