suite: cross-resource validation tests
templates:
  - templates/validate.yaml
tests:
  # ====== deployment name collision ======
  # Prefix "RELEASE-NAME-global-chart-" = 26 chars, leaving 37 chars for deployment name
  # "abcdefghij-klmnopqrst-uvwxyz-abcdefgh1" (39 chars) and "...gh2" both truncate to same 37 chars
  - it: should fail when two deployment names collide after truncation
    set:
      deployments:
        abcdefghij-klmnopqrst-uvwxyz-abcdefgh1:
          image: nginx:1.25
        abcdefghij-klmnopqrst-uvwxyz-abcdefgh2:
          image: nginx:1.25
    asserts:
      - failedTemplate:
          errorPattern: "Name collision: Deployment"

  - it: should not fail when deployment names are unique after truncation
    set:
      deployments:
        frontend:
          image: nginx:1.25
        backend:
          image: myapp:v2
    asserts:
      - hasDocuments:
          count: 0

  # ====== deployment-level CronJob collision ======
  # Both deployments: 27-char names + cronJob "m" = 29-char suffix, trunc to 26 = identical
  - it: should fail when deployment-level cronjob names collide after truncation
    set:
      deployments:
        abcdefghijklmnopqrstuvwxyz1:
          image: nginx:1.25
          cronJobs:
            m:
              schedule: "0 4 * * *"
              command: ["./cleanup.sh"]
        abcdefghijklmnopqrstuvwxyz2:
          image: nginx:1.25
          cronJobs:
            m:
              schedule: "0 4 * * *"
              command: ["./cleanup.sh"]
    asserts:
      - failedTemplate:
          errorPattern: "Name collision: CronJob"

  # ====== Collision tests: remaining types ======

  # --- Deploy-level hook Job collision (same deployment, same hook type, long job names) ---
  # depFullname = "RELEASE-NAME-global-chart-app" (29 chars)
  # hookJobName = "{depFullname}-pre-install-{jobName}" trunc 63
  # Prefix: 29 + 1 + 11 + 1 = 42 chars. Available for jobName: 63 - 42 = 21 chars.
  # Two 22-char job names (21 letters + digit) collide after trunc 63.
  - it: should fail when deploy-level hook Job names collide after truncation
    set:
      deployments:
        app:
          image: nginx:1.25
          hooks:
            pre-install:
              abcdefghijklmnopqrstu1:
                command: ["./migrate1.sh"]
              abcdefghijklmnopqrstu2:
                command: ["./migrate2.sh"]
    asserts:
      - failedTemplate:
          errorPattern: "Name collision: Job.*generated by hook"

  # --- Cross-source CronJob collision (root cronJob vs deploy-level cronJob) ---
  # Deploy-level: "RELEASE-NAME-global-chart-backend-cleanup" (41 chars, trunc 52 = 41)
  # Root-level:   "RELEASE-NAME-global-chart-backend-cleanup" (41 chars, trunc 52 = 41)
  # Deploy entry is registered first, root cronJob check finds collision.
  - it: should fail when root cronJob collides with deploy-level cronJob name
    set:
      deployments:
        backend:
          image: nginx:1.25
          cronJobs:
            cleanup:
              schedule: "0 4 * * *"
              command: ["./cleanup.sh"]
      cronJobs:
        backend-cleanup:
          schedule: "0 2 * * *"
          image: nginx:1.25
          command: ["./backup.sh"]
    asserts:
      - failedTemplate:
          errorPattern: "Name collision: CronJob.*generated by root cronJob"

  # --- Root-level CronJob collision (two root cronJobs with truncation) ---
  # Default release: fullname = "RELEASE-NAME-global-chart" (25 chars)
  # cronJobName = "{fullname}-{name}" trunc 52 => 26 + len(name) trunc 52
  # Available for name: 52 - 26 = 26 chars
  # Two 27-char names (26 letters + digit) collide after trunc 52
  - it: should fail when root-level cronjob names collide after truncation
    set:
      cronJobs:
        abcdefghijklmnopqrstuvwxyz1:
          schedule: "0 2 * * *"
          image: nginx:1.25
          command: ["./backup.sh"]
        abcdefghijklmnopqrstuvwxyz2:
          schedule: "0 2 * * *"
          image: nginx:1.25
          command: ["./backup.sh"]
    asserts:
      - failedTemplate:
          errorPattern: "Name collision: CronJob.*generated by root cronJob"

  # --- Root-level hook Job collision ---
  # Default release: fullname = "RELEASE-NAME-global-chart" (25 chars)
  # hookfullname = "{fullname}-{hookType}-{jobName}" trunc 63
  # With hookType "post-install" (12 chars): 25 + 1 + 12 + 1 = 39 prefix chars
  # Available for jobName: 63 - 39 = 24 chars
  # Two 25-char job names (24 letters + digit) collide after trunc 63
  - it: should fail when root-level hook Job names collide after truncation
    set:
      hooks:
        post-install:
          abcdefghijklmnopqrstuvwx1:
            image: nginx:1.25
            command: ["./setup.sh"]
          abcdefghijklmnopqrstuvwx2:
            image: nginx:1.25
            command: ["./setup.sh"]
    asserts:
      - failedTemplate:
          errorPattern: "Name collision: Job.*generated by root hook"

  # --- Cross-source hook Job collision (root hook vs deploy-level hook) ---
  # Deploy "pre-install" with hook type "pre-install", job "x":
  #   depFullname = "RELEASE-NAME-global-chart-pre-install" (37 chars)
  #   hookJob = "RELEASE-NAME-global-chart-pre-install-pre-install-x" (52 chars)
  # Root hook type "pre-install", job "pre-install-x":
  #   hookfullname = "RELEASE-NAME-global-chart-pre-install-pre-install-x" (52 chars)
  # Deploy hook is registered first, root hook check finds collision.
  - it: should fail when root hook collides with deploy-level hook name
    set:
      deployments:
        pre-install:
          image: nginx:1.25
          hooks:
            pre-install:
              x:
                command: ["./x.sh"]
      hooks:
        pre-install:
          pre-install-x:
            image: nginx:1.25
            command: ["./y.sh"]
    asserts:
      - failedTemplate:
          errorPattern: "Name collision: Job.*generated by root hook"

  # ====== mountedConfigFiles ConfigMap collision ======
  # `files` and `bundles` render into one name space: <depFullname>-md-cm-<name>.
  # The same `name` on both sides rendered two ConfigMaps with one name and
  # different content, and the pod silently got whichever applied last.
  - it: should fail when a mountedConfigFiles file and bundle share a name
    set:
      deployments:
        app:
          image: nginx:1.25
          mountedConfigFiles:
            files:
              - name: shared
                filename: from-files.conf
                targetPath: /etc/app/from-files.conf
                content: FROM-FILES
            bundles:
              - mountDir: /etc/app/bundle
                files:
                  - name: shared
                    relPath: from-bundle.conf
                    content: FROM-BUNDLE
    asserts:
      - failedTemplate:
          errorPattern: "Name collision: ConfigMap.*mountedConfigFiles"

  - it: should not fail when mountedConfigFiles names are distinct
    set:
      deployments:
        app:
          image: nginx:1.25
          mountedConfigFiles:
            files:
              - name: from-files
                filename: from-files.conf
                targetPath: /etc/app/from-files.conf
                content: FROM-FILES
            bundles:
              - mountDir: /etc/app/bundle
                files:
                  - name: from-bundle
                    relPath: from-bundle.conf
                    content: FROM-BUNDLE
    asserts:
      - hasDocuments:
          count: 0

  # ====== Cross-kind ConfigMap/Secret collisions ======
  # A kind's accumulator has to hold every name of that kind whatever derived it.
  # Deployment "a-md-cm-x" renders a ConfigMap under the same name deployment "a"
  # derives for its mounted file: two manifests, one name, neither invalid alone.
  - it: should fail when a deployment ConfigMap collides with a mounted config file
    set:
      deployments:
        a:
          image: nginx:1.25
          mountedConfigFiles:
            files:
              - name: x
                filename: a.conf
                targetPath: /etc/a.conf
                content: FROM-MOUNTED-FILE
        a-md-cm-x:
          image: nginx:1.25
          configMap:
            FROM: DEPLOYMENT-CONFIGMAP
    asserts:
      - failedTemplate:
          errorPattern: "Name collision: ConfigMap.*its own configMap"

  # Same shape on the Secret side: the hook prerequisite copy appends
  # "-hook-secret", which is a name a deployment can carry outright.
  - it: should fail when a deployment Secret collides with a hook prerequisite Secret
    set:
      deployments:
        a:
          image: nginx:1.25
          secret:
            K: v
          hooks:
            pre-install:
              m:
                command: ["./m.sh"]
        a-hook-secret:
          image: nginx:1.25
          secret:
            K: v
    asserts:
      - failedTemplate:
          errorPattern: "Name collision: Secret.*its own secret"

  # ====== Non-collision: false positive checks ======

  # Same hook command name across different hook types should NOT collide
  # because hook type is part of the Job name: {fullname}-{hookType}-{jobName}
  - it: should not fail when same hook name is used in different hook types
    set:
      deployments:
        app:
          image: nginx:1.25
          hooks:
            pre-install:
              migrate:
                command: ["./migrate.sh"]
            post-install:
              migrate:
                command: ["./migrate.sh"]
    asserts:
      - hasDocuments:
          count: 0

  # Root-level cronJob and deploy-level cronJob with DIFFERENT generated names should NOT collide
  - it: should not fail when root and deploy-level cronjobs produce different names
    set:
      deployments:
        backend:
          image: nginx:1.25
          cronJobs:
            cleanup:
              schedule: "0 4 * * *"
              command: ["./cleanup.sh"]
      cronJobs:
        daily-report:
          schedule: "0 2 * * *"
          image: nginx:1.25
          command: ["./report.sh"]
    asserts:
      - hasDocuments:
          count: 0

  # A deployment's own ConfigMap and Secret share its name by design; registering
  # both must not make the ordinary case collide with itself.
  - it: should not fail when a deployment has both a configMap and a secret
    set:
      deployments:
        app:
          image: nginx:1.25
          configMap:
            FOO: bar
          secret:
            DB_PASSWORD: s3cret
    asserts:
      - hasDocuments:
          count: 0

  # ====== Autoscaler conflict (HPA vs KEDA) ======
  # KEDA creates and owns its own HPA for the ScaledObject; a chart-rendered HPA
  # on the same Deployment gives two controllers writing spec.replicas.
  - it: should fail when a deployment enables both the native HPA and KEDA
    set:
      deployments:
        worker:
          image: nginx:1.25
          autoscaling:
            enabled: true
            minReplicas: 1
            maxReplicas: 5
            targetCPUUtilizationPercentage: 80
          keda:
            enabled: true
            triggers:
              - type: cron
                metadata: { timezone: UTC, start: "0 0 * * *", end: "59 23 * * *", desiredReplicas: "3" }
    asserts:
      - failedTemplate:
          errorPattern: "deployments.worker: autoscaling.enabled and keda.enabled are mutually exclusive"

  - it: should not fail when HPA and KEDA are enabled on different deployments
    set:
      deployments:
        legacy:
          image: nginx:1.25
          autoscaling:
            enabled: true
            minReplicas: 1
            maxReplicas: 5
            targetCPUUtilizationPercentage: 80
        worker:
          image: nginx:1.25
          keda:
            enabled: true
            triggers:
              - type: cron
                metadata: { timezone: UTC, start: "0 0 * * *", end: "59 23 * * *", desiredReplicas: "3" }
    asserts:
      - hasDocuments:
          count: 0

  # A disabled deployment renders nothing, so its values cannot conflict.
  - it: should not fail when both autoscalers are set on a disabled deployment
    set:
      deployments:
        worker:
          enabled: false
          image: nginx:1.25
          autoscaling:
            enabled: true
            minReplicas: 1
            maxReplicas: 5
          keda:
            enabled: true
            triggers:
              - type: cron
                metadata: { timezone: UTC, start: "0 0 * * *", end: "59 23 * * *", desiredReplicas: "3" }
    asserts:
      - hasDocuments:
          count: 0

  # ====== named service targetPort resolution (issue #82) ======
  - it: should fail when service.targetPort names a port nothing declares
    set:
      deployments:
        web:
          image: nginx:1.25
          service:
            port: 8080
            portName: api
            targetPort: http
    asserts:
      - failedTemplate:
          errorPattern: "deployments.web.service.targetPort names the port 'http', which no container port declares \\(declared: api\\)"

  - it: should fail when an extraPorts targetPort names a port nothing declares
    set:
      deployments:
        web:
          image: nginx:1.25
          service:
            port: 8069
            extraPorts:
              - name: ws
                port: 8072
                targetPort: gevent
    asserts:
      - failedTemplate:
          errorPattern: "deployments.web.service.extraPorts 'ws' has targetPort 'gevent', which no container port declares"

  - it: should not fail when a named targetPort resolves to an extraPorts declaration
    set:
      deployments:
        web:
          image: nginx:1.25
          service:
            port: 8069
            extraPorts:
              - name: gevent
                port: 8072
                targetPort: 8072
              - name: ws
                port: 8073
                targetPort: gevent
    asserts:
      - hasDocuments:
          count: 0

  - it: should not fail when targetPort is omitted and portName is customised
    set:
      deployments:
        web:
          image: nginx:1.25
          service:
            port: 8080
            portName: api
    asserts:
      - hasDocuments:
          count: 0

  - it: should not validate target ports of a disabled service
    set:
      deployments:
        web:
          image: nginx:1.25
          service:
            enabled: false
            portName: api
            targetPort: http
    asserts:
      - hasDocuments:
          count: 0

  # ====== ServiceAccount name collision ======
  # A root-level cronJob and a deployment keyed the same generate the same SA name
  # (<release>-<chart>-<key>). Both create it, and the install dies on "already
  # exists" halfway through the release.
  - it: should fail when a root cronJob creates a ServiceAccount a deployment also creates
    set:
      deployments:
        cleanup:
          image: nginx:1.25
      cronJobs:
        cleanup:
          schedule: "0 0 * * *"
          image: busybox:1.36
    asserts:
      - failedTemplate:
          errorPattern: "Name collision: ServiceAccount .* created for root cronJob"

  - it: should not fail when the root cronJob binds the existing ServiceAccount instead
    set:
      deployments:
        cleanup:
          image: nginx:1.25
      cronJobs:
        cleanup:
          schedule: "0 0 * * *"
          image: busybox:1.36
          serviceAccount:
            create: false
            name: t-global-chart-cleanup
    asserts:
      - notFailedTemplate: {}

