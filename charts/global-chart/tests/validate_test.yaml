suite: cross-resource validation tests
templates:
  - templates/validate.yaml
tests:
  # ====== deployment name collision ======
  # Prefix "RELEASE-NAME-global-chart-" = 26 chars, leaving 37 chars for deployment name
  # "abcdefghij-klmnopqrst-uvwxyz-abcdefgh1" (39 chars) and "...gh2" both truncate to same 37 chars
  - it: should fail when two deployment names collide after truncation
    set:
      deployments:
        abcdefghij-klmnopqrst-uvwxyz-abcdefgh1:
          image: nginx:1.25
        abcdefghij-klmnopqrst-uvwxyz-abcdefgh2:
          image: nginx:1.25
    asserts:
      - failedTemplate:
          errorMessage: "Name collision: Deployment 'RELEASE-NAME-global-chart-abcdefghij-klmnopqrst-uvwxyz-abcdefgh' generated by deployments.abcdefghij-klmnopqrst-uvwxyz-abcdefgh2 conflicts with deployments.abcdefghij-klmnopqrst-uvwxyz-abcdefgh1"

  - it: should not fail when deployment names are unique after truncation
    set:
      deployments:
        frontend:
          image: nginx:1.25
        backend:
          image: myapp:v2
    asserts:
      - hasDocuments:
          count: 0

  # ====== deployment-level CronJob collision ======
  # Both deployments: 27-char names + cronJob "m" = 29-char suffix, trunc to 26 = identical
  - it: should fail when deployment-level cronjob names collide after truncation
    set:
      deployments:
        abcdefghijklmnopqrstuvwxyz1:
          image: nginx:1.25
          cronJobs:
            m:
              schedule: "0 4 * * *"
              command: ["./cleanup.sh"]
        abcdefghijklmnopqrstuvwxyz2:
          image: nginx:1.25
          cronJobs:
            m:
              schedule: "0 4 * * *"
              command: ["./cleanup.sh"]
    asserts:
      - failedTemplate:
          errorMessage: "Name collision: CronJob 'RELEASE-NAME-global-chart-abcdefghijklmnopqrstuvwxyz' generated by deployments.abcdefghijklmnopqrstuvwxyz2.cronJobs.m conflicts with deployments.abcdefghijklmnopqrstuvwxyz1.cronJobs.m"

  # ====== Collision tests: remaining types ======

  # --- Deploy-level hook Job collision (same deployment, same hook type, long job names) ---
  # depFullname = "RELEASE-NAME-global-chart-app" (29 chars)
  # hookJobName = "{depFullname}-pre-install-{jobName}" trunc 63
  # Prefix: 29 + 1 + 11 + 1 = 42 chars. Available for jobName: 63 - 42 = 21 chars.
  # Two 22-char job names (21 letters + digit) collide after trunc 63.
  - it: should fail when deploy-level hook Job names collide after truncation
    set:
      deployments:
        app:
          image: nginx:1.25
          hooks:
            pre-install:
              abcdefghijklmnopqrstu1:
                command: ["./migrate1.sh"]
              abcdefghijklmnopqrstu2:
                command: ["./migrate2.sh"]
    asserts:
      - failedTemplate:
          errorPattern: "Name collision: Job .* generated by deployments\\.app\\.hooks\\.pre-install\\.abcdefghijklmnopqrstu2 conflicts with deployments\\.app\\.hooks\\.pre-install\\.abcdefghijklmnopqrstu1"

  # --- Cross-source CronJob collision (root cronJob vs deploy-level cronJob) ---
  # Deploy-level: "RELEASE-NAME-global-chart-backend-cleanup" (41 chars, trunc 52 = 41)
  # Root-level:   "RELEASE-NAME-global-chart-backend-cleanup" (41 chars, trunc 52 = 41)
  # Deploy entry is registered first, root cronJob check finds collision.
  - it: should fail when root cronJob collides with deploy-level cronJob name
    set:
      deployments:
        backend:
          image: nginx:1.25
          cronJobs:
            cleanup:
              schedule: "0 4 * * *"
              command: ["./cleanup.sh"]
      cronJobs:
        backend-cleanup:
          schedule: "0 2 * * *"
          image: nginx:1.25
          command: ["./backup.sh"]
    asserts:
      - failedTemplate:
          errorPattern: "Name collision: CronJob .* generated by cronJobs\\.backend-cleanup conflicts with deployments\\.backend\\.cronJobs\\.cleanup"

  # --- Root-level CronJob collision (two root cronJobs with truncation) ---
  # Default release: fullname = "RELEASE-NAME-global-chart" (25 chars)
  # cronJobName = "{fullname}-{name}" trunc 52 => 26 + len(name) trunc 52
  # Available for name: 52 - 26 = 26 chars
  # Two 27-char names (26 letters + digit) collide after trunc 52
  - it: should fail when root-level cronjob names collide after truncation
    set:
      cronJobs:
        abcdefghijklmnopqrstuvwxyz1:
          schedule: "0 2 * * *"
          image: nginx:1.25
          command: ["./backup.sh"]
        abcdefghijklmnopqrstuvwxyz2:
          schedule: "0 2 * * *"
          image: nginx:1.25
          command: ["./backup.sh"]
    asserts:
      - failedTemplate:
          errorPattern: "Name collision: CronJob .* generated by cronJobs\\.abcdefghijklmnopqrstuvwxyz2 conflicts with cronJobs\\.abcdefghijklmnopqrstuvwxyz1"

  # --- Root-level hook Job collision ---
  # Default release: fullname = "RELEASE-NAME-global-chart" (25 chars)
  # hookfullname = "{fullname}-{hookType}-{jobName}" trunc 63
  # With hookType "post-install" (12 chars): 25 + 1 + 12 + 1 = 39 prefix chars
  # Available for jobName: 63 - 39 = 24 chars
  # Two 25-char job names (24 letters + digit) collide after trunc 63
  - it: should fail when root-level hook Job names collide after truncation
    set:
      hooks:
        post-install:
          abcdefghijklmnopqrstuvwx1:
            image: nginx:1.25
            command: ["./setup.sh"]
          abcdefghijklmnopqrstuvwx2:
            image: nginx:1.25
            command: ["./setup.sh"]
    asserts:
      - failedTemplate:
          errorPattern: "Name collision: Job .* generated by hooks\\.post-install\\.abcdefghijklmnopqrstuvwx2 conflicts with hooks\\.post-install\\.abcdefghijklmnopqrstuvwx1"

  # --- Cross-source hook Job collision (root hook vs deploy-level hook) ---
  # Deploy "pre-install" with hook type "pre-install", job "x":
  #   depFullname = "RELEASE-NAME-global-chart-pre-install" (37 chars)
  #   hookJob = "RELEASE-NAME-global-chart-pre-install-pre-install-x" (52 chars)
  # Root hook type "pre-install", job "pre-install-x":
  #   hookfullname = "RELEASE-NAME-global-chart-pre-install-pre-install-x" (52 chars)
  # Deploy hook is registered first, root hook check finds collision.
  - it: should fail when root hook collides with deploy-level hook name
    set:
      deployments:
        pre-install:
          image: nginx:1.25
          hooks:
            pre-install:
              x:
                command: ["./x.sh"]
      hooks:
        pre-install:
          pre-install-x:
            image: nginx:1.25
            command: ["./y.sh"]
    asserts:
      - failedTemplate:
          errorPattern: "Name collision: Job .* generated by hooks\\.pre-install\\.pre-install-x conflicts with deployments\\.pre-install\\.hooks\\.pre-install\\.x"

  # ====== mountedConfigFiles ConfigMap collision ======
  # `files` and `bundles` render into one name space: <depFullname>-md-cm-<name>.
  # The same `name` on both sides rendered two ConfigMaps with one name and
  # different content, and the pod silently got whichever applied last.
  - it: should fail when a mountedConfigFiles file and bundle share a name
    set:
      deployments:
        app:
          image: nginx:1.25
          mountedConfigFiles:
            files:
              - name: shared
                filename: from-files.conf
                targetPath: /etc/app/from-files.conf
                content: FROM-FILES
            bundles:
              - mountDir: /etc/app/bundle
                files:
                  - name: shared
                    relPath: from-bundle.conf
                    content: FROM-BUNDLE
    asserts:
      - failedTemplate:
          errorMessage: "Name collision: ConfigMap 'RELEASE-NAME-global-chart-app-md-cm-shared' generated by deployments.app.mountedConfigFiles.bundles[0].files[0] ('shared') conflicts with deployments.app.mountedConfigFiles.files[0] ('shared'). Give one of the two entries a different 'name'."

  - it: should not fail when mountedConfigFiles names are distinct
    set:
      deployments:
        app:
          image: nginx:1.25
          mountedConfigFiles:
            files:
              - name: from-files
                filename: from-files.conf
                targetPath: /etc/app/from-files.conf
                content: FROM-FILES
            bundles:
              - mountDir: /etc/app/bundle
                files:
                  - name: from-bundle
                    relPath: from-bundle.conf
                    content: FROM-BUNDLE
    asserts:
      - hasDocuments:
          count: 0

  # ====== Cross-kind ConfigMap/Secret collisions ======
  # A kind's accumulator has to hold every name of that kind whatever derived it.
  # Deployment "a-md-cm-x" renders a ConfigMap under the same name deployment "a"
  # derives for its mounted file: two manifests, one name, neither invalid alone.
  - it: should fail when a deployment ConfigMap collides with a mounted config file
    set:
      deployments:
        a:
          image: nginx:1.25
          mountedConfigFiles:
            files:
              - name: x
                filename: a.conf
                targetPath: /etc/a.conf
                content: FROM-MOUNTED-FILE
        a-md-cm-x:
          image: nginx:1.25
          configMap:
            FROM: DEPLOYMENT-CONFIGMAP
    asserts:
      - failedTemplate:
          errorMessage: "Name collision: ConfigMap 'RELEASE-NAME-global-chart-a-md-cm-x' generated by deployments.a-md-cm-x.configMap conflicts with deployments.a.mountedConfigFiles.files[0] ('x')"

  # Same shape on the Secret side: the hook prerequisite copy appends
  # "-hook-secret", which is a name a deployment can carry outright.
  - it: should fail when a deployment Secret collides with a hook prerequisite Secret
    set:
      deployments:
        a:
          image: nginx:1.25
          secret:
            K: v
          hooks:
            pre-install:
              m:
                command: ["./m.sh"]
        a-hook-secret:
          image: nginx:1.25
          secret:
            K: v
    asserts:
      - failedTemplate:
          errorMessage: "Name collision: Secret 'RELEASE-NAME-global-chart-a-hook-secret' generated by deployments.a-hook-secret.secret conflicts with deployments.a.secret (hook prerequisite copy)"

  # ====== Non-collision: false positive checks ======

  # Same hook command name across different hook types should NOT collide
  # because hook type is part of the Job name: {fullname}-{hookType}-{jobName}
  - it: should not fail when same hook name is used in different hook types
    set:
      deployments:
        app:
          image: nginx:1.25
          hooks:
            pre-install:
              migrate:
                command: ["./migrate.sh"]
            post-install:
              migrate:
                command: ["./migrate.sh"]
    asserts:
      - hasDocuments:
          count: 0

  # Root-level cronJob and deploy-level cronJob with DIFFERENT generated names should NOT collide
  - it: should not fail when root and deploy-level cronjobs produce different names
    set:
      deployments:
        backend:
          image: nginx:1.25
          cronJobs:
            cleanup:
              schedule: "0 4 * * *"
              command: ["./cleanup.sh"]
      cronJobs:
        daily-report:
          schedule: "0 2 * * *"
          image: nginx:1.25
          command: ["./report.sh"]
    asserts:
      - hasDocuments:
          count: 0

  # A deployment's own ConfigMap and Secret share its name by design; registering
  # both must not make the ordinary case collide with itself.
  - it: should not fail when a deployment has both a configMap and a secret
    set:
      deployments:
        app:
          image: nginx:1.25
          configMap:
            FOO: bar
          secret:
            DB_PASSWORD: s3cret
    asserts:
      - hasDocuments:
          count: 0

  # ====== Autoscaler conflict (HPA vs KEDA) ======
  # KEDA creates and owns its own HPA for the ScaledObject; a chart-rendered HPA
  # on the same Deployment gives two controllers writing spec.replicas.
  - it: should fail when a deployment enables both the native HPA and KEDA
    set:
      deployments:
        worker:
          image: nginx:1.25
          autoscaling:
            enabled: true
            minReplicas: 1
            maxReplicas: 5
            targetCPUUtilizationPercentage: 80
          keda:
            enabled: true
            triggers:
              - type: cron
                metadata: { timezone: UTC, start: "0 0 * * *", end: "59 23 * * *", desiredReplicas: "3" }
    asserts:
      - failedTemplate:
          errorPattern: "deployments.worker: autoscaling.enabled and keda.enabled are mutually exclusive"

  # ====== autoscaling.enabled needs an active metric (issue #151, ADR 0012) ======
  # The Deployment drops spec.replicas when autoscaling is enabled; with no
  # positive target no HPA renders and Kubernetes defaults replicas to 1.
  - it: should fail when autoscaling is enabled with no target set
    set:
      deployments:
        main:
          image: nginx:1.25
          replicaCount: 3
          autoscaling:
            enabled: true
            minReplicas: 3
            maxReplicas: 10
    asserts:
      - failedTemplate:
          errorMessage: "deployments.main.autoscaling.enabled is true but neither targetCPUUtilizationPercentage nor targetMemoryUtilizationPercentage is a positive number; without one no HPA renders and the Deployment runs a single replica. Set a target or disable autoscaling."

  - it: should fail when autoscaling is enabled with every target off
    set:
      deployments:
        main:
          image: nginx:1.25
          autoscaling:
            enabled: true
            minReplicas: 1
            maxReplicas: 5
            targetCPUUtilizationPercentage: ""
            targetMemoryUtilizationPercentage: 0
    asserts:
      - failedTemplate:
          errorPattern: "deployments.main.autoscaling.enabled is true but neither"

  - it: should not fail when one target is on and the other is 0
    set:
      deployments:
        main:
          image: nginx:1.25
          autoscaling:
            enabled: true
            minReplicas: 1
            maxReplicas: 5
            targetCPUUtilizationPercentage: 80
            targetMemoryUtilizationPercentage: 0
    asserts:
      - notFailedTemplate: {}

  - it: should not fail when a disabled autoscaler has no target
    set:
      deployments:
        main:
          image: nginx:1.25
          autoscaling:
            enabled: false
    asserts:
      - notFailedTemplate: {}

  - it: should report the KEDA conflict before the missing target
    set:
      deployments:
        worker:
          image: nginx:1.25
          autoscaling:
            enabled: true
            minReplicas: 1
            maxReplicas: 5
          keda:
            enabled: true
            triggers:
              - type: cron
                metadata: { timezone: UTC, start: "0 0 * * *", end: "59 23 * * *", desiredReplicas: "3" }
    asserts:
      - failedTemplate:
          errorPattern: "deployments.worker: autoscaling.enabled and keda.enabled are mutually exclusive"

  # "80%" reads as 0 through float64: the schema admits digits only
  - it: should reject a percentage target written with a percent sign
    set:
      deployments:
        main:
          image: nginx:1.25
          autoscaling:
            enabled: true
            minReplicas: 1
            maxReplicas: 5
            targetCPUUtilizationPercentage: "80%"
    asserts:
      - failedTemplate:
          errorPattern: "does not match pattern"

  - it: should reject a target with a leading zero, which YAML reads as octal
    set:
      deployments:
        main:
          image: nginx:1.25
          autoscaling:
            enabled: true
            minReplicas: 1
            maxReplicas: 5
            targetCPUUtilizationPercentage: "010"
    asserts:
      - failedTemplate:
          errorPattern: "does not match pattern"

  - it: should reject a negative target
    set:
      deployments:
        main:
          image: nginx:1.25
          autoscaling:
            enabled: true
            minReplicas: 1
            maxReplicas: 5
            targetMemoryUtilizationPercentage: -1
    asserts:
      - failedTemplate:
          errorPattern: "minimum"

  - it: should not fail when HPA and KEDA are enabled on different deployments
    set:
      deployments:
        legacy:
          image: nginx:1.25
          autoscaling:
            enabled: true
            minReplicas: 1
            maxReplicas: 5
            targetCPUUtilizationPercentage: 80
        worker:
          image: nginx:1.25
          keda:
            enabled: true
            triggers:
              - type: cron
                metadata: { timezone: UTC, start: "0 0 * * *", end: "59 23 * * *", desiredReplicas: "3" }
    asserts:
      - hasDocuments:
          count: 0

  # A disabled deployment renders nothing, so its values cannot conflict.
  - it: should not fail when both autoscalers are set on a disabled deployment
    set:
      deployments:
        worker:
          enabled: false
          image: nginx:1.25
          autoscaling:
            enabled: true
            minReplicas: 1
            maxReplicas: 5
          keda:
            enabled: true
            triggers:
              - type: cron
                metadata: { timezone: UTC, start: "0 0 * * *", end: "59 23 * * *", desiredReplicas: "3" }
    asserts:
      - hasDocuments:
          count: 0

  # ====== named service targetPort resolution (issue #82) ======
  - it: should fail when service.targetPort names a port nothing declares
    set:
      deployments:
        web:
          image: nginx:1.25
          service:
            port: 8080
            portName: api
            targetPort: http
    asserts:
      - failedTemplate:
          errorPattern: "deployments.web.service.targetPort names the port 'http', which no container port declares \\(declared: api\\)"

  - it: should fail when an extraPorts targetPort names a port nothing declares
    set:
      deployments:
        web:
          image: nginx:1.25
          service:
            port: 8069
            extraPorts:
              - name: ws
                port: 8072
                targetPort: gevent
    asserts:
      - failedTemplate:
          errorPattern: "deployments.web.service.extraPorts 'ws' has targetPort 'gevent', which no container port declares"

  - it: should not fail when a named targetPort resolves to an extraPorts declaration
    set:
      deployments:
        web:
          image: nginx:1.25
          service:
            port: 8069
            extraPorts:
              - name: gevent
                port: 8072
                targetPort: 8072
              - name: ws
                port: 8073
                targetPort: gevent
    asserts:
      - hasDocuments:
          count: 0

  - it: should not fail when targetPort is omitted and portName is customised
    set:
      deployments:
        web:
          image: nginx:1.25
          service:
            port: 8080
            portName: api
    asserts:
      - hasDocuments:
          count: 0

  - it: should not validate target ports of a disabled service
    set:
      deployments:
        web:
          image: nginx:1.25
          service:
            enabled: false
            portName: api
            targetPort: http
    asserts:
      - hasDocuments:
          count: 0

  # ====== ServiceAccount name collision ======
  # A root-level cronJob and a deployment keyed the same generate the same SA name
  # (<release>-<chart>-<key>). Both create it, and the install dies on "already
  # exists" halfway through the release.
  - it: should fail when a root cronJob creates a ServiceAccount a deployment also creates
    set:
      deployments:
        cleanup:
          image: nginx:1.25
      cronJobs:
        cleanup:
          schedule: "0 0 * * *"
          image: busybox:1.36
    asserts:
      - failedTemplate:
          errorMessage: "Name collision: ServiceAccount 'RELEASE-NAME-global-chart-cleanup' created for cronJobs.cleanup conflicts with the one created for deployments.cleanup. Give one of them an explicit serviceAccount.name, or set serviceAccount.create: false to bind the existing one."

  - it: should not fail when the root cronJob binds the existing ServiceAccount instead
    set:
      deployments:
        cleanup:
          image: nginx:1.25
      cronJobs:
        cleanup:
          schedule: "0 0 * * *"
          image: busybox:1.36
          serviceAccount:
            create: false
            name: t-global-chart-cleanup
    asserts:
      - notFailedTemplate: {}


  # ====== ExternalSecret hook copies (issue #110, ADR 0007) ======
  # The copy is named <real>-hook, so the real ExternalSecret of a key that
  # already ends in -hook lands on the same name.
  - it: should fail when an ExternalSecret hook copy collides with a real ExternalSecret
    set:
      externalSecrets:
        app:
          secretstore: { kind: ClusterSecretStore, name: store }
          secretkey: PASSWORD
          remote: { key: app }
          target:
            name: app-secret
        app-hook:
          secretstore: { kind: ClusterSecretStore, name: store }
          secretkey: PASSWORD
          remote: { key: app-hook }
          target:
            name: app-hook-secret
      hooks:
        pre-install:
          migrate:
            image: busybox:1.36
            externalSecrets:
              - name: app
    asserts:
      - failedTemplate:
          errorMessage: "Name collision: ExternalSecret 'RELEASE-NAME-global-chart-app-hook' generated by externalSecrets.app (hook prerequisite copy) conflicts with externalSecrets.app-hook"

  - it: should fail when the Secret of an ExternalSecret hook copy collides with a deployment Secret
    set:
      externalSecrets:
        app-env:
          secretstore: { kind: ClusterSecretStore, name: store }
          secretkey: PASSWORD
          remote: { key: app }
      deployments:
        app-env-hook:
          image: nginx:1.25
          secret:
            TOKEN: abc
      hooks:
        pre-install:
          migrate:
            image: busybox:1.36
            externalSecrets:
              - name: app-env
    asserts:
      - failedTemplate:
          errorMessage: "Name collision: Secret 'RELEASE-NAME-global-chart-app-env-hook' generated by externalSecrets.app-env (hook prerequisite copy) conflicts with deployments.app-env-hook.secret"

  - it: should fail when the Secret of an ExternalSecret hook copy is the target another ExternalSecret owns
    set:
      externalSecrets:
        app:
          secretstore: { kind: ClusterSecretStore, name: store }
          secretkey: PASSWORD
          remote: { key: app }
          target:
            name: shared
        other:
          secretstore: { kind: ClusterSecretStore, name: store }
          secretkey: PASSWORD
          remote: { key: other }
          target:
            name: shared-hook
      hooks:
        pre-install:
          migrate:
            image: busybox:1.36
            externalSecrets:
              - name: app
    asserts:
      - failedTemplate:
          errorMessage: "Name collision: Secret 'shared-hook' generated by externalSecrets.app (hook prerequisite copy) conflicts with externalSecrets.other"

  # Merge writes into a Secret something else owns: two ExternalSecrets merging
  # into one target is a design, not a collision, and must keep rendering.
  - it: should not fail when two ExternalSecrets merge into the same target
    set:
      externalSecrets:
        a:
          secretstore: { kind: ClusterSecretStore, name: store }
          secretkey: A
          remote: { key: a }
          target: { name: shared, creationPolicy: Merge }
        b:
          secretstore: { kind: ClusterSecretStore, name: store }
          secretkey: B
          remote: { key: b }
          target: { name: shared, creationPolicy: Merge }
    asserts:
      - notFailedTemplate: {}

  # A Merge target is written into, not owned, so it is not an owner — but a
  # copy owns its target, and its deletion would garbage-collect the Secret the
  # Merge ExternalSecret writes into.
  - it: should fail when a Merge ExternalSecret writes into the Secret a hook copy owns
    set:
      externalSecrets:
        app:
          secretstore: { kind: ClusterSecretStore, name: store }
          secretkey: PASSWORD
          remote: { key: app }
          target: { name: shared }
        other:
          secretstore: { kind: ClusterSecretStore, name: store }
          secretkey: PASSWORD
          remote: { key: other }
          target: { name: shared-hook, creationPolicy: Merge }
      hooks:
        pre-install:
          migrate:
            image: busybox:1.36
            externalSecrets:
              - name: app
    asserts:
      - failedTemplate:
          errorMessage: "Name collision: Secret 'shared-hook' generated by externalSecrets.other (Merge) conflicts with externalSecrets.app (hook prerequisite copy)"

  # Two Merge ExternalSecrets may share a target; two hook copies of them may
  # not, since each would own it.
  - it: should fail when the hook copies of two ExternalSecrets merging into one target collide
    set:
      externalSecrets:
        a:
          secretstore: { kind: ClusterSecretStore, name: store }
          secretkey: A
          remote: { key: a }
          target: { name: shared, creationPolicy: Merge }
        b:
          secretstore: { kind: ClusterSecretStore, name: store }
          secretkey: B
          remote: { key: b }
          target: { name: shared, creationPolicy: Merge }
      hooks:
        pre-install:
          migrate:
            image: busybox:1.36
            externalSecrets:
              - name: a
              - name: b
    asserts:
      - failedTemplate:
          errorMessage: "Name collision: Secret 'shared-hook' generated by externalSecrets.b (hook prerequisite copy) conflicts with externalSecrets.a (hook prerequisite copy)"

  # ====== Owner ExternalSecret target vs a chart Secret (issue #153, ADR 0013) ======
  # externalSecrets.<key> and deployments.<key>.secret both default to
  # <fullname>-<key>. Owner adopts the Helm Secret: the two overwrite each
  # other's data, and deleting the ExternalSecret garbage-collects the Secret.
  - it: should fail when an Owner ExternalSecret targets a deployment Secret
    set:
      externalSecrets:
        app:
          secretstore: { kind: ClusterSecretStore, name: store }
          secretkey: K
          remote: { key: k }
      deployments:
        app:
          image: nginx
          secret: { API_KEY: abc }
    asserts:
      - failedTemplate:
          errorMessage: "Name collision: Secret 'RELEASE-NAME-global-chart-app' generated by externalSecrets.app conflicts with deployments.app.secret"

  - it: should fail when an Owner ExternalSecret targets a deployment Secret's hook prerequisite copy
    set:
      externalSecrets:
        app-hook-secret:
          secretstore: { kind: ClusterSecretStore, name: store }
          secretkey: K
          remote: { key: k }
      deployments:
        app:
          image: nginx
          secret: { API_KEY: abc }
          hooks:
            pre-install:
              migrate:
                command: ["true"]
    asserts:
      - failedTemplate:
          errorMessage: "Name collision: Secret 'RELEASE-NAME-global-chart-app-hook-secret' generated by externalSecrets.app-hook-secret conflicts with deployments.app.secret (hook prerequisite copy)"

  # Merge adds its keys to the Secret and Helm's patch keeps them; None writes
  # nothing. Neither fights Helm, so both stay legal.
  - it: should not fail when a Merge ExternalSecret writes into a deployment Secret
    set:
      externalSecrets:
        app:
          secretstore: { kind: ClusterSecretStore, name: store }
          secretkey: K
          remote: { key: k }
          target: { creationPolicy: Merge }
      deployments:
        app:
          image: nginx
          secret: { API_KEY: abc }
    asserts:
      - notFailedTemplate: {}

  - it: should not fail when a None ExternalSecret names a deployment Secret
    set:
      externalSecrets:
        app:
          secretstore: { kind: ClusterSecretStore, name: store }
          secretkey: K
          remote: { key: k }
          target: { creationPolicy: None }
      deployments:
        app:
          image: nginx
          secret: { API_KEY: abc }
    asserts:
      - notFailedTemplate: {}

  - it: should not fail when the deployment owning the Secret is disabled
    set:
      externalSecrets:
        app:
          secretstore: { kind: ClusterSecretStore, name: store }
          secretkey: K
          remote: { key: k }
      deployments:
        app:
          enabled: false
          image: nginx
          secret: { API_KEY: abc }
    asserts:
      - notFailedTemplate: {}

  # ====== kedaTriggerAuthentications name collision (issue #117) ======
  # "RELEASE-NAME-global-chart-" is 26 chars, leaving 37 for the key: two
  # 38-char keys differing only in the last char truncate to one name
  - it: should fail when two TriggerAuthentication keys collide after truncation
    set:
      kedaTriggerAuthentications:
        abcdefghij-klmnopqrst-uvwxyz-abcdefgh1:
          env: [{ parameter: p, name: A }]
        abcdefghij-klmnopqrst-uvwxyz-abcdefgh2:
          env: [{ parameter: p, name: A }]
    asserts:
      - failedTemplate:
          errorMessage: "Name collision: TriggerAuthentication 'RELEASE-NAME-global-chart-abcdefghij-klmnopqrst-uvwxyz-abcdefgh' generated by kedaTriggerAuthentications.abcdefghij-klmnopqrst-uvwxyz-abcdefgh2 conflicts with kedaTriggerAuthentications.abcdefghij-klmnopqrst-uvwxyz-abcdefgh1"

  # ====== rbacs.roles name collisions (issue #122) ======
  - it: should fail when two roles share a name
    set:
      rbacs:
        roles:
          - { name: reader, rules: [] }
          - { name: reader, rules: [] }
    asserts:
      - failedTemplate:
          errorPattern: "Name collision: Role 'reader' generated by rbacs.roles\\[1\\]"

  - it: should fail when foo and foo-role yield the same RoleBinding
    set:
      rbacs:
        roles:
          - { name: reader, serviceAccount: {}, rules: [] }
          - { name: reader-role, serviceAccount: {}, rules: [] }
    asserts:
      - failedTemplate:
          errorPattern: "Name collision: RoleBinding 'reader-rolebinding'"

  - it: should fail when two long role names truncate to the same default SA
    set:
      rbacs:
        roles:
          - { name: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa1, serviceAccount: {}, rules: [] }
          - { name: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa2, serviceAccount: {}, rules: [] }
    asserts:
      - failedTemplate:
          errorPattern: "Name collision: ServiceAccount 'aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa'"

  - it: should fail when a role creates the ServiceAccount a deployment creates
    set:
      deployments:
        web:
          image: nginx:1.25
          serviceAccount: { name: shared }
      rbacs:
        roles:
          - name: reader
            serviceAccount: { name: shared }
            rules: []
    asserts:
      - failedTemplate:
          errorPattern: "Name collision: ServiceAccount .* created for rbacs.roles\\[0\\]"

  - it: should not fail when two roles bind one existing ServiceAccount
    set:
      rbacs:
        roles:
          - { name: reader, serviceAccount: { name: shared, create: false }, rules: [] }
          - { name: writer, serviceAccount: { name: shared, create: false }, rules: [] }
    asserts:
      - notFailedTemplate: {}

  # ====== rbacs.roles hook-prerequisite copies (ADR 0010) ======
  - it: should fail when a role's hook copy lands on another role's name
    set:
      rbacs:
        roles:
          - { name: scaler, serviceAccount: {}, rules: [] }
          - { name: scaler-hook, rules: [] }
      hooks:
        pre-upgrade:
          migrate: { image: myapp:v1, serviceAccountName: scaler-sa }
    asserts:
      - failedTemplate:
          errorPattern: "Name collision: Role 'scaler-hook'"

  - it: should fail when a role's hook SA copy lands on a created ServiceAccount
    set:
      rbacs:
        roles:
          - { name: scaler, serviceAccount: { name: scaler }, rules: [] }
          - { name: other, serviceAccount: { name: scaler-hook }, rules: [] }
      hooks:
        pre-upgrade:
          migrate: { image: myapp:v1, serviceAccountName: scaler }
    asserts:
      # The copy takes its name from the real SA: the advice is to change the
      # name, not serviceAccount.name / create, which the copy cannot be given
      - failedTemplate:
          errorMessage: "Name collision: ServiceAccount 'scaler-hook' created for rbacs.roles[0] ('scaler') (hook prerequisite copy) conflicts with the one created for rbacs.roles[1] ('other'). A hook-prerequisite copy is named after its real resource plus '-hook', truncated to the same limit (ADR 0011): shorten the name so the copy fits, or rename the entry it lands on."

  - it: should fail when a role's hook SA copy truncates back onto the real SA
    set:
      rbacs:
        roles:
          - { name: scaler, serviceAccount: { name: ccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc }, rules: [] }
      hooks:
        pre-upgrade:
          migrate: { image: myapp:v1, serviceAccountName: ccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc }
    asserts:
      - failedTemplate:
          errorPattern: "Name collision: ServiceAccount 'c{63}' created for rbacs.roles\\[0\\] \\('scaler'\\) \\(hook prerequisite copy\\) conflicts with the one created for rbacs.roles\\[0\\] \\('scaler'\\)"

  # The deployment SA copy (ADR 0011) is registered under the same rule
  - it: should fail when a deployment's hook SA copy lands on a created ServiceAccount
    set:
      deployments:
        app:
          image: myapp:v1
          serviceAccount: { name: app-sa }
          hooks:
            pre-install:
              migrate: { command: ["./migrate.sh"] }
      rbacs:
        roles:
          - { name: other, serviceAccount: { name: app-sa-hook }, rules: [] }
    asserts:
      - failedTemplate:
          errorMessage: "Name collision: ServiceAccount 'app-sa-hook' created for deployments.app (hook prerequisite copy) conflicts with the one created for rbacs.roles[0] ('other'). A hook-prerequisite copy is named after its real resource plus '-hook', truncated to the same limit (ADR 0011): shorten the name so the copy fits, or rename the entry it lands on."

  - it: should fail when a deployment's hook SA copy truncates back onto the real SA
    set:
      deployments:
        app:
          image: myapp:v1
          serviceAccount: { name: ddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddd }
          hooks:
            pre-upgrade:
              migrate: { command: ["./migrate.sh"] }
    asserts:
      - failedTemplate:
          errorPattern: "Name collision: ServiceAccount 'd{63}' created for deployments.app \\(hook prerequisite copy\\) conflicts with the one created for deployments.app"

  - it: should blame a cronjob when its SA copy lands on a created ServiceAccount
    set:
      cronJobs:
        report:
          image: myapp:v1
          schedule: "0 3 * * *"
          serviceAccount: { create: true, name: report-sa }
      rbacs:
        roles:
          - { name: other, serviceAccount: { name: report-sa-hook }, rules: [] }
      hooks:
        pre-upgrade:
          seed: { image: myapp:v1, serviceAccountName: report-sa }
    asserts:
      - failedTemplate:
          errorPattern: "Name collision: ServiceAccount 'report-sa-hook' created for cronJobs.report \\(hook prerequisite copy\\) conflicts with the one created for rbacs.roles\\[0\\] \\('other'\\)"

  # A Role name is used verbatim up to 253 characters, the copy is truncated to
  # the same 253: at the limit it lands on the real Role
  - it: should fail when a role's hook copy truncates back onto the real Role
    set:
      rbacs:
        roles:
          - { name: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa, serviceAccount: { create: false, name: existing }, rules: [] }
      hooks:
        pre-upgrade:
          migrate: { image: myapp:v1, serviceAccountName: existing }
    asserts:
      - failedTemplate:
          errorPattern: "Name collision: Role 'a{253}' generated by rbacs.roles\\[0\\] \\('a{253}'\\) \\(hook prerequisite copy\\) conflicts with rbacs.roles\\[0\\]"

  # The RoleBinding is truncated to 63: a role name of 59 characters or more
  # leaves no room for -hook
  - it: should fail when a role's hook RoleBinding copy truncates back onto the real one
    set:
      rbacs:
        roles:
          - { name: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb, serviceAccount: { create: false, name: existing }, rules: [] }
      hooks:
        pre-upgrade:
          migrate: { image: myapp:v1, serviceAccountName: existing }
    asserts:
      - failedTemplate:
          errorMessage: "Name collision: RoleBinding 'bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb-ro' generated by rbacs.roles[0] ('bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb') (hook prerequisite copy) conflicts with rbacs.roles[0] ('bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb'). A hook-prerequisite copy is named after its real resource plus '-hook', truncated to the same limit (ADR 0010): shorten the name so the copy fits, or rename the entry it lands on."

  # ====== fullname that can never reach a label (issue #120) ======
  # Helm accepts a dotted release name; a Deployment's container name and a root
  # hook's container name are the fullname plus a suffix, and a label has no dot.
  - it: should fail when a dotted release name reaches a Deployment
    release:
      name: my.app
    set:
      deployments:
        web:
          image: nginx:1.25
    asserts:
      - failedTemplate:
          errorPattern: "contains a dot"

  - it: should fail when a dotted fullnameOverride reaches a root hook
    set:
      fullnameOverride: my.app
      hooks:
        pre-install:
          migrate:
            image: busybox:1.36
            command: ["true"]
    asserts:
      - failedTemplate:
          errorPattern: "contains a dot"

  # A cronjob-only release names nothing but subdomains with the fullname: it
  # renders today and must keep rendering.
  - it: should accept a dotted release name on a cronjob-only release
    release:
      name: my.app
    set:
      cronJobs:
        backup:
          schedule: "0 2 * * *"
          image: busybox:1.36
          command: ["true"]
    asserts:
      - hasDocuments:
          count: 0

  # A Service name is a DNS-1035 label: it cannot start with a digit.
  - it: should fail when a release name starting with a digit reaches a Service
    release:
      name: 1app
    set:
      deployments:
        web:
          image: nginx:1.25
    asserts:
      - failedTemplate:
          errorPattern: "starts with a digit"

  - it: should accept a release name starting with a digit when no Service renders
    release:
      name: 1app
    set:
      deployments:
        web:
          image: nginx:1.25
          service:
            enabled: false
      hooks:
        pre-install:
          migrate:
            image: busybox:1.36
            command: ["true"]
    asserts:
      - hasDocuments:
          count: 0
