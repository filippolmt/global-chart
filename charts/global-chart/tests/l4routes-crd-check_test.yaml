suite: l4routes CRD presence check
templates:
  - templates/l4routes.yaml
# Deliberately declares NO capabilities, like keda-crd-check_test.yaml: a
# per-test `capabilities.apiVersions: []` does not clear a suite-level list.
tests:
  - it: should fail a TCPRoute when the cluster does not serve gateway.networking.k8s.io/v1 TCPRoute
    set:
      tcpRoutes:
        db:
          parentRefs: [{ name: gw }]
          rules: [{ backendRefs: [{ service: { name: x } }] }]
    asserts:
      - failedTemplate:
          errorMessage: "tcpRoutes.db: needs the CRD gateway.networking.k8s.io/v1/TCPRoute, which is not registered in the cluster. Install the Gateway API experimental-channel CRDs that serve TCPRoute at v1 before installing this release, or render offline with --api-versions gateway.networking.k8s.io/v1/TCPRoute."

  - it: should check each kind on its own (TCPRoute served, UDPRoute not)
    capabilities:
      apiVersions:
        - gateway.networking.k8s.io/v1/TCPRoute
    set:
      udpRoutes:
        dns:
          parentRefs: [{ name: gw }]
          rules: [{ backendRefs: [{ service: { name: x } }] }]
    asserts:
      - failedTemplate:
          errorPattern: "udpRoutes\\.dns: needs the CRD gateway\\.networking\\.k8s\\.io/v1/UDPRoute"

  - it: should not ask for the CRDs when no L4 route is declared
    set:
      deployments:
        api:
          image: nginx:1.25
    asserts:
      - hasDocuments:
          count: 0
