{{- $root := . }}
{{- range $name, $deploy := .Values.deployments }}
{{- if $deploy }}
{{- if eq (include "global-chart.deploymentEnabled" $deploy) "true" }}
{{- $pdb := default (dict) $deploy.pdb }}
{{- if $pdb.enabled }}
{{- $depFullname := include "global-chart.deploymentFullname" (dict "root" $root "deploymentName" $name) }}
{{- $errCtx := include "global-chart.deploymentValuesPath" $name }}
{{- $labelCtx := dict "root" $root "deploymentName" $name }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $depFullname }}
  labels:
    {{- include "global-chart.deploymentLabels" $labelCtx | nindent 4 }}
  {{- with (include "global-chart.renderAnnotations" (dict "root" $root)) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
spec:
  {{- if and (hasKey $pdb "minAvailable") (hasKey $pdb "maxUnavailable") }}
  {{- fail (printf "%s.pdb: minAvailable and maxUnavailable are mutually exclusive — set only one." $errCtx) }}
  {{- end }}
  {{- if not (or (hasKey $pdb "minAvailable") (hasKey $pdb "maxUnavailable")) }}
  {{- fail (printf "%s.pdb: one of minAvailable or maxUnavailable is required when pdb.enabled is true." $errCtx) }}
  {{- end }}
  {{- if hasKey $pdb "minAvailable" }}
  minAvailable: {{ include "global-chart.printScalar" (dict "value" $pdb.minAvailable "errCtx" (printf "%s.pdb.minAvailable" $errCtx)) }}
  {{- /* A minAvailable that reaches every pod the replica owner keeps allows no
         voluntary eviction: kubectl drain and cluster-autoscaler scale-down
         never finish on the node (issue #216, ADR 0021). Only the form whose
         effect depends on the count fails; maxUnavailable: 0, "0%" and
         minAvailable: "100%" block at any count and are taken as meant.
         Percentages round up, as the disruption controller does. The count is
         the replica owner's floor, where an autoscaled workload idles.
         shortcut: a KEDA floor of 0 skips the check though the workload blocks
         at 1 pod, upgrade if a scale-to-zero workload reports a stuck drain. */}}
  {{- $floor := include "global-chart.replicaFloor" (dict "deploy" $deploy "errCtx" $errCtx) | fromJson }}
  {{- $min := $pdb.minAvailable }}
  {{- if and (kindIs "float64" $floor.count) (ge (int $floor.count) 1) (not (kindIs "invalid" $min)) }}
  {{- $count := int $floor.count }}
  {{- $needed := -1 }}
  {{- if kindIs "string" $min }}
  {{- $pct := trimSuffix "%" $min | atoi }}
  {{- if and (hasSuffix "%" $min) (lt $pct 100) }}
  {{- $needed = div (add (mul $pct $count) 99) 100 }}
  {{- end }}
  {{- else }}
  {{- $needed = int $min }}
  {{- end }}
  {{- if ge $needed $count }}
  {{- fail (printf "%s.pdb.minAvailable: %s allows no voluntary eviction with %s: %d, so kubectl drain and cluster-autoscaler scale-down never finish on its node. Lower it, or set maxUnavailable: 0 instead to block evictions on purpose." $errCtx (include "global-chart.printScalar" $min) $floor.path $count) }}
  {{- end }}
  {{- end }}
  {{- end }}
  {{- if hasKey $pdb "maxUnavailable" }}
  maxUnavailable: {{ include "global-chart.printScalar" (dict "value" $pdb.maxUnavailable "errCtx" (printf "%s.pdb.maxUnavailable" $errCtx)) }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "global-chart.deploymentSelectorLabels" $labelCtx | nindent 6 }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
