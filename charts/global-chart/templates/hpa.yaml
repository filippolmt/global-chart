{{- $root := . }}
{{- range $name, $deploy := .Values.deployments }}
{{- if $deploy }}
{{- if eq (include "global-chart.deploymentEnabled" $deploy) "true" }}
{{- $hpa := default (dict) $deploy.autoscaling }}
{{- /* Raw values, printed through printScalar: an int cast here would truncate
       in silence. float64 only for the "is it set" test */ -}}
{{- $cpu := ternary $hpa.targetCPUUtilizationPercentage 0 (hasKey $hpa "targetCPUUtilizationPercentage") }}
{{- $mem := ternary $hpa.targetMemoryUtilizationPercentage 0 (hasKey $hpa "targetMemoryUtilizationPercentage") }}
{{- $cpuOn := gt (float64 $cpu) 0.0 }}
{{- $memOn := gt (float64 $mem) 0.0 }}
{{- $hasMetric := or $cpuOn $memOn }}
{{- if and $hpa.enabled $hasMetric }}
{{- $depFullname := include "global-chart.deploymentFullname" (dict "root" $root "deploymentName" $name) }}
{{- $labelCtx := dict "root" $root "deploymentName" $name }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ $depFullname }}
  labels:
    {{- include "global-chart.deploymentLabels" $labelCtx | nindent 4 }}
  {{- with (include "global-chart.renderAnnotations" (dict "root" $root)) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ $depFullname }}
  {{- if not (hasKey $hpa "minReplicas") }}
  {{- fail (printf "deployments.%s.autoscaling.minReplicas is required when HPA is enabled" $name) }}
  {{- end }}
  minReplicas: {{ include "global-chart.printScalar" $hpa.minReplicas }}
  {{- if not (hasKey $hpa "maxReplicas") }}
  {{- fail (printf "deployments.%s.autoscaling.maxReplicas is required when HPA is enabled" $name) }}
  {{- end }}
  maxReplicas: {{ include "global-chart.printScalar" $hpa.maxReplicas }}
  metrics:
    {{- if $cpuOn }}
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ include "global-chart.printScalar" $cpu }}
    {{- end }}
    {{- if $memOn }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ include "global-chart.printScalar" $mem }}
    {{- end }}
  {{- with $hpa.behavior }}
  behavior:
    {{- with .scaleUp }}
    scaleUp:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- with .scaleDown }}
    scaleDown:
      {{- toYaml . | nindent 6 }}
    {{- end }}
  {{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
