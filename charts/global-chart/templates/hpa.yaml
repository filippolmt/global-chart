{{- $root := . }}
{{- range $name, $deploy := .Values.deployments }}
{{- if $deploy }}
{{- if eq (include "global-chart.deploymentEnabled" $deploy) "true" }}
{{- $hpa := default (dict) $deploy.autoscaling }}
{{- /* validateAutoscalingConflict fails an enabled HPA with no active target;
       the $targets test only keeps a render without validate.yaml from
       emitting an empty metrics list, which the API server reads as CPU 80% */ -}}
{{- $targets := include "global-chart.hpaActiveTargets" $hpa | fromJson }}
{{- if and $hpa.enabled $targets }}
{{- $depFullname := include "global-chart.deploymentFullname" (dict "root" $root "deploymentName" $name) }}
{{- $labelCtx := dict "root" $root "deploymentName" $name }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ $depFullname }}
  labels:
    {{- include "global-chart.deploymentLabels" $labelCtx | nindent 4 }}
  {{- with (include "global-chart.renderAnnotations" (dict "root" $root)) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ $depFullname }}
  {{- if not (hasKey $hpa "minReplicas") }}
  {{- fail (printf "deployments.%s.autoscaling.minReplicas is required when HPA is enabled" $name) }}
  {{- end }}
  minReplicas: {{ include "global-chart.printScalar" $hpa.minReplicas }}
  {{- if not (hasKey $hpa "maxReplicas") }}
  {{- fail (printf "deployments.%s.autoscaling.maxReplicas is required when HPA is enabled" $name) }}
  {{- end }}
  maxReplicas: {{ include "global-chart.printScalar" $hpa.maxReplicas }}
  metrics:
    {{- range $res, $target := $targets }}
    - type: Resource
      resource:
        name: {{ $res }}
        target:
          type: Utilization
          averageUtilization: {{ include "global-chart.printScalar" $target }}
    {{- end }}
  {{- with $hpa.behavior }}
  behavior:
    {{- with .scaleUp }}
    scaleUp:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- with .scaleDown }}
    scaleDown:
      {{- toYaml . | nindent 6 }}
    {{- end }}
  {{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
