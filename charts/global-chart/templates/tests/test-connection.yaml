{{- $root := . }}
{{- $firstSvc := "" }}
{{- $firstPort := 0 }}{{/* placeholder: overwritten with servicePrimaryPort below, and nothing renders unless it is */}}
{{- range $name := keys .Values.deployments | sortAlpha }}
{{- $deploy := index $.Values.deployments $name }}
{{- if and $deploy (not $firstSvc) }}
{{- if eq (include "global-chart.deploymentEnabled" $deploy) "true" }}
{{- $svc := default (dict) $deploy.service }}
{{- if eq (include "global-chart.serviceEnabled" $svc) "true" }}
{{- $firstSvc = include "global-chart.deploymentFullname" (dict "root" $root "deploymentName" $name) }}
{{- $firstPort = (include "global-chart.servicePrimaryPort" $svc | fromJson).port }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- if $firstSvc }}
apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "global-chart.fullname" $root }}-test-connection"
  labels:
    {{- include "global-chart.labels" $root | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  containers:
    - name: wget
      image: busybox:1.36
      command: ['wget']
      args: ['http://{{ $firstSvc }}:{{ include "global-chart.int" $firstPort }}/', '--timeout=5', '-q', '-O', '/dev/null']
  restartPolicy: Never
{{- end }}
