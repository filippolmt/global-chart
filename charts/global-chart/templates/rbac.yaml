{{- $root := . }}
{{- /* The hooks that run as each role's SA during a phase the normal resources
       are absent (ADR 0010); a role absent from it gets no copy */ -}}
{{- $consumers := include "global-chart.rbacHookConsumers" $root | fromJson }}
{{- range $role := $root.Values.rbacs.roles }}
{{- $resolved := include "global-chart.rbacServiceAccount" $role | fromJson }}
{{- if $resolved.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $resolved.name }}
  namespace: {{ $root.Release.Namespace | quote }}
  labels:
    {{- include "global-chart.labels" $root | nindent 4 }}
  {{- with (include "global-chart.renderAnnotations" (dict "root" $root "own" $resolved.annotations)) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ $resolved.automount }}
---
{{- end }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $role.name }}
  namespace: {{ $root.Release.Namespace | quote }}
  labels:
    {{- include "global-chart.labels" $root | nindent 4 }}
  {{- with (include "global-chart.renderAnnotations" (dict "root" $root)) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
rules:
{{- with $role.rules }}
{{ toYaml . | indent 2 }}
{{- else }}
  []
{{- end }}
---
{{- if $resolved.name }}
{{- $roleBindingName := include "global-chart.rbacRoleBindingName" $role.name }}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $roleBindingName }}
  namespace: {{ $root.Release.Namespace | quote }}
  labels:
    {{- include "global-chart.labels" $root | nindent 4 }}
  {{- with (include "global-chart.renderAnnotations" (dict "root" $root)) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $role.name }}
subjects:
  - kind: ServiceAccount
    name: {{ $resolved.name }}
    namespace: {{ $root.Release.Namespace | quote }}
---
{{- end }}
{{- /*
  Hook-prerequisite copy of the entry (ADR 0010): the Role, the RoleBinding and
  the SA are normal resources, applied after the pre-* hooks and gone before
  post-delete, so a hook running as the role's SA in those phases would run
  without its rules — or, when the role creates the SA, as a SA that does not
  exist. Every copy has its own name (<name>-hook): a same-name copy deleted by
  hook-succeeded would take the live resource with it under Argo CD, where
  pre-install runs on every sync. One copy per entry, whatever the number of
  hooks: phases aggregated, weight from the earliest consumer, role prereq.
*/ -}}
{{- with index $consumers $role.name }}
{{- $hookTypes := keys . | sortAlpha | join "," }}
{{- $weight := include "global-chart.minHookWeight" (dict "hooks" .) }}
{{- $copySA := include "global-chart.rbacCopyServiceAccountName" (dict "root" $root "name" $resolved.name) }}
{{- $roleCopy := include "global-chart.rbacHookName" (list $role.name 253) }}
{{- if $resolved.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $copySA }}
  namespace: {{ $root.Release.Namespace | quote }}
  labels:
    {{- include "global-chart.hookLabelsWithComponent" (dict "root" $root) | nindent 4 }}
  annotations:
    {{- with (include "global-chart.renderAnnotations" (dict "root" $root "own" $resolved.annotations)) }}
    {{- . | nindent 4 }}
    {{- end }}
    {{- include "global-chart.hookAnnotations" (dict "hookType" $hookTypes "role" "prereq" "weight" $weight) | nindent 4 }}
automountServiceAccountToken: {{ $resolved.automount }}
---
{{- end }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $roleCopy }}
  namespace: {{ $root.Release.Namespace | quote }}
  labels:
    {{- include "global-chart.hookLabelsWithComponent" (dict "root" $root) | nindent 4 }}
  annotations:
    {{- with (include "global-chart.renderAnnotations" (dict "root" $root)) }}
    {{- . | nindent 4 }}
    {{- end }}
    {{- include "global-chart.hookAnnotations" (dict "hookType" $hookTypes "role" "prereq" "weight" $weight) | nindent 4 }}
rules:
{{- with $role.rules }}
{{ toYaml . | indent 2 }}
{{- else }}
  []
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "global-chart.rbacHookName" (list (include "global-chart.rbacRoleBindingName" $role.name) 63) }}
  namespace: {{ $root.Release.Namespace | quote }}
  labels:
    {{- include "global-chart.hookLabelsWithComponent" (dict "root" $root) | nindent 4 }}
  annotations:
    {{- with (include "global-chart.renderAnnotations" (dict "root" $root)) }}
    {{- . | nindent 4 }}
    {{- end }}
    {{- include "global-chart.hookAnnotations" (dict "hookType" $hookTypes "role" "prereq" "weight" $weight) | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $roleCopy }}
subjects:
  - kind: ServiceAccount
    name: {{ $copySA }}
    namespace: {{ $root.Release.Namespace | quote }}
---
{{- end }}
{{- end }}
