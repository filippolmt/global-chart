{{- $root := . -}}
{{- /* One list drives both the "did you declare anything?" guard and the body,
       so adding a credential source is a schema change plus one word here. */ -}}
{{- $sources := list "secretTargetRef" "env" "podIdentity" "hashiCorpVault" "azureKeyVault" "awsSecretManager" "gcpSecretManager" -}}
{{- range $name, $auth := .Values.kedaTriggerAuthentications }}
{{- if $auth }}
{{- include "global-chart.requireKedaCrd" (dict "root" $root "errCtx" (printf "kedaTriggerAuthentications.%s" $name)) }}
{{- $declared := false }}
{{- $empty := list }}
{{- /* Read as the body renders it: a source empty or of nulls only is left out (issue #304) */ -}}
{{- range $field := $sources }}
{{- if include "global-chart.passthroughYaml" (index $auth $field) }}{{- $declared = true }}
{{- else if eq (include "global-chart.isSet" (list $auth $field)) "true" }}{{- $empty = append $empty $field }}{{- end }}
{{- end }}
{{- if not $declared }}
{{- with $empty }}
{{- fail (printf "kedaTriggerAuthentications.%s.%s: empty or of nulls only, and the entry declares no other credential source (one of: %s)" $name (first .) (join ", " $sources)) }}
{{- end }}
{{- fail (printf "kedaTriggerAuthentications.%s: declares no credential source (one of: %s)" $name (join ", " $sources)) }}
{{- end }}
---
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: {{ include "global-chart.kedaTriggerAuthName" (dict "root" $root "name" $name) | quote }}
  labels:
    {{- include "global-chart.labels" $root | nindent 4 }}
  {{- with (include "global-chart.renderAnnotations" (dict "root" $root)) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
spec:
  {{- range $field := $sources }}
  {{- with include "global-chart.passthroughYaml" (index $auth $field) }}
  {{ $field }}:
    {{- . | nindent 4 }}
  {{- end }}
  {{- end }}
{{- end }}
{{- end }}
