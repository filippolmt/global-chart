{{- $rt := default (dict) .Values.httpRoute }}
{{- if $rt.enabled }}
{{- $root := . }}
{{- $fullName := include "global-chart.fullname" $root }}

{{- /* parentRefs and matches are verbatim Gateway API structures rendered straight
       through toYaml, so the chart never re-implements — and drifts from — the
       upstream schema. Field-level validation lives in values.schema.json; field
       defaults (e.g. path type/value) are owned by the Gateway API CRD, not
       duplicated here. Only backendRefs is rendered field-by-field, since that is
       where the chart transforms input (deployment name -> Service via
       resolveBackend). */ -}}

{{- /* Guarded like the L4 routes (issue #196); see requireGatewayApiCrd */ -}}
{{- include "global-chart.requireGatewayApiCrd" (dict "root" $root "kind" "HTTPRoute" "errCtx" "httpRoute") }}

{{- /* Validate required-when-enabled fields */ -}}
{{- if not $rt.parentRefs }}
  {{- fail "httpRoute.parentRefs: empty while httpRoute.enabled is true. Provide at least one parentRef pointing to an existing Gateway (the chart does not create Gateways)." }}
{{- end }}
{{- if not $rt.rules }}
  {{- fail "httpRoute.rules: empty while httpRoute.enabled is true. Provide at least one rule." }}
{{- end }}

apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $fullName }}
  labels:
    {{- include "global-chart.labels" $root | nindent 4 }}
  {{- with (include "global-chart.renderAnnotations" (dict "root" $root "own" $rt.annotations)) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- toYaml $rt.parentRefs | nindent 4 }}
  {{- with $rt.hostnames }}
  hostnames:
    {{- range . }}
    - {{ . | quote }}
    {{- end }}
  {{- end }}
  rules:
    {{- range $ruleIdx, $rule := $rt.rules }}
    {{- $rule = default (dict) $rule }}
    {{- /* A RequestRedirect answers the request itself: Gateway API rejects it
           together with backendRefs (a CEL rule of the CRD, which kubeconform
           does not evaluate), so such a rule is the one that has none */ -}}
    {{- $redirects := false }}
    {{- range $rule.filters }}
      {{- if eq (default (dict) .).type "RequestRedirect" }}{{- $redirects = true }}{{- end }}
    {{- end }}
    -
      {{- with $rule.matches }}
      matches:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $rule.filters }}
      filters:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if and $redirects $rule.backendRefs }}
        {{- fail (printf "httpRoute.rules[%d].backendRefs: set on a rule with a RequestRedirect filter, which the API server rejects: a redirect answers the request itself. Drop backendRefs from the rule." $ruleIdx) }}
      {{- else if and (not $redirects) (not $rule.backendRefs) }}
        {{- fail (printf "httpRoute.rules[%d].backendRefs: empty — provide at least one backendRef (deployment or service)." $ruleIdx) }}
      {{- end }}
      {{- if $rule.backendRefs }}
      backendRefs:
        {{- range $brIdx, $br := $rule.backendRefs }}
        {{- $brCtx := printf "httpRoute.rules[%d].backendRefs[%d]" $ruleIdx $brIdx }}
        {{- $b := include "global-chart.resolveBackend" (dict "root" $root "ref" $br "errCtx" $brCtx "protocol" "TCP") | fromJson }}
        - name: {{ $b.name | quote }}
          port: {{ include "global-chart.printScalar" $b.port }}
          {{- if hasKey $br "weight" }}
          weight: {{ include "global-chart.printScalar" (dict "value" $br.weight "errCtx" (printf "%s.weight" $brCtx)) }}
          {{- end }}
          {{- with $br.filters }}
          filters:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        {{- end }}
      {{- end }}
      {{- with $rule.timeouts }}
      timeouts:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- end }}
{{- end }}
