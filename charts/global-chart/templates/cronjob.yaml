{{/*
  CronJobs can be defined in two places:
  1. Root level: .Values.cronJobs (standalone, optional fromDeployment for image)
  2. Inside deployments: .Values.deployments.<name>.cronJobs (inherits image, configMap, secret, SA from deployment)
*/}}

{{- $root := . }}

{{/* ====== PART 1: Root-level cronJobs ====== */}}
{{- if .Values.cronJobs }}
{{- range $name, $job := .Values.cronJobs }}
{{- if $job }}
{{- $fullname := include "global-chart.fullname" $root }}
{{- /* CronJob names limited to 52 chars (see rootCronJobName helper) */ -}}
{{- $jobFullname := include "global-chart.rootCronJobName" (dict "root" $root "name" $name) }}
{{- $errCtx := include "global-chart.jobValuesPath" (dict "kind" "cronjob" "jobName" $name) }}

{{- /* Resolve image: explicit > fromDeployment > error (see jobImageString helper) */ -}}
{{- $imageRef := include "global-chart.jobImageString" (dict "root" $root "job" $job "errCtx" $errCtx) }}

{{- /* ServiceAccount: explicit > create own (see jobServiceAccount helper; no
       deployment to inherit from at root level) */ -}}
{{- $sa := include "global-chart.jobServiceAccount" (dict "root" $root "job" $job "jobFullname" $jobFullname "errCtx" $errCtx) | fromJson }}
{{- $saName := $sa.name }}
{{- if $sa.create }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $saName }}
  namespace: {{ $root.Release.Namespace | quote }}
  labels:
    {{- include "global-chart.labels" $root | nindent 4 }}
  {{- with (include "global-chart.renderAnnotations" (dict "root" $root "own" $sa.annotations)) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ $sa.automount }}
{{- end }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ $jobFullname }}
  labels:
    {{- include "global-chart.labels" $root | nindent 4 }}
  {{- with (include "global-chart.renderAnnotations" (dict "root" $root "own" $job.annotations)) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
spec:
  schedule: {{ $job.schedule | quote }}
  {{- with $job.timeZone }}
  timeZone: {{ . | quote }}
  {{- end }}
  {{- include "global-chart.cronJobSpecFields" $job | nindent 2 }}
  jobTemplate:
    {{- with (include "global-chart.renderAnnotations" (dict "root" $root)) }}
    metadata:
      annotations:
        {{- . | nindent 8 }}
    {{- end }}
    spec:
      {{- with (include "global-chart.jobSpecVerbatimFields" (dict "job" $job "kind" "cronjob")) }}
      {{- . | nindent 6 }}
      {{- end }}
      template:
        {{- with (include "global-chart.renderAnnotations" (dict "root" $root)) }}
        metadata:
          annotations:
            {{- . | nindent 12 }}
        {{- end }}
        spec:
          {{- $ctx := dict "root" $root "job" $job "saName" $saName "imageRef" $imageRef "containerName" $name "kind" "cronjob" "errCtx" $errCtx }}
          {{- include "global-chart.jobPodSpec" $ctx | trimPrefix "\n" | nindent 10 }}
{{- end }}
{{- end }}
{{- end }}

{{/* ====== PART 2: Deployment-level cronJobs (inherit from deployment) ====== */}}
{{- range $deployName, $deploy := .Values.deployments }}
{{- if $deploy }}
{{- if and (eq (include "global-chart.deploymentEnabled" $deploy) "true") $deploy.cronJobs }}
{{- range $name, $job := $deploy.cronJobs }}
{{- if $job }}

{{- /* Build cronjob fullname with deployment name for uniqueness */ -}}
{{- /* CronJob names limited to 52 chars (see deploymentCronJobName helper) */ -}}
{{- $jobFullname := include "global-chart.deploymentCronJobName" (dict "root" $root "deploymentName" $deployName "jobName" $name) }}
{{- $errCtx := include "global-chart.jobValuesPath" (dict "kind" "cronjob" "deploymentName" $deployName "jobName" $name) }}

{{- /* Resolve image: explicit in cronjob > inherited from deployment (see jobImageString helper) */ -}}
{{- $imageRef := include "global-chart.jobImageString" (dict "root" $root "job" $job "deploy" $deploy "errCtx" $errCtx) }}

{{- /* ServiceAccount: explicit > inherited from deployment > default (see jobServiceAccount helper) */ -}}
{{- $sa := include "global-chart.jobServiceAccount" (dict "root" $root "job" $job "deploy" $deploy "deployName" $deployName "jobFullname" $jobFullname "errCtx" $errCtx) | fromJson -}}
{{- $saName := $sa.name -}}
{{- $saCreate := $sa.create -}}
{{- $saAutomount := $sa.automount -}}
{{- $saAnnotations := $sa.annotations -}}

{{- /* Create SA only if needed (not using deployment's or explicit existing) */ -}}
{{- if $saCreate }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $saName }}
  namespace: {{ $root.Release.Namespace | quote }}
  labels:
    {{- include "global-chart.deploymentLabels" (dict "root" $root "deploymentName" $deployName) | nindent 4 }}
  {{- with (include "global-chart.renderAnnotations" (dict "root" $root "own" $saAnnotations)) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ $saAutomount }}
{{ end -}}

{{- $deployFullname := include "global-chart.deploymentFullname" (dict "root" $root "deploymentName" $deployName) -}}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ $jobFullname }}
  labels:
    {{- include "global-chart.deploymentLabels" (dict "root" $root "deploymentName" $deployName) | nindent 4 }}
  {{- with (include "global-chart.renderAnnotations" (dict "root" $root "own" $job.annotations)) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
spec:
  schedule: {{ $job.schedule | quote }}
  {{- with $job.timeZone }}
  timeZone: {{ . | quote }}
  {{- end }}
  {{- include "global-chart.cronJobSpecFields" $job | nindent 2 }}
  jobTemplate:
    {{- with (include "global-chart.renderAnnotations" (dict "root" $root)) }}
    metadata:
      annotations:
        {{- . | nindent 8 }}
    {{- end }}
    spec:
      {{- with (include "global-chart.jobSpecVerbatimFields" (dict "job" $job "kind" "cronjob")) }}
      {{- . | nindent 6 }}
      {{- end }}
      template:
        {{- with (include "global-chart.renderAnnotations" (dict "root" $root)) }}
        metadata:
          annotations:
            {{- . | nindent 12 }}
        {{- end }}
        spec:
          {{- $ctx := dict "root" $root "job" $job "deploy" $deploy "saName" $saName "imageRef" $imageRef "containerName" $name "configMapRef" $deployFullname "secretRef" $deployFullname "kind" "cronjob" "deployName" $deployName "errCtx" $errCtx }}
          {{- include "global-chart.jobPodSpec" $ctx | trimPrefix "\n" | nindent 10 }}
{{ end }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
