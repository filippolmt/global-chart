{{- $root := . }}
{{- range $name, $deploy := .Values.deployments }}
{{- if $deploy }}
{{- if eq (include "global-chart.deploymentEnabled" $deploy) "true" }}
{{- $depFullname := include "global-chart.deploymentFullname" (dict "root" $root "deploymentName" $name) }}
{{- $errCtx := include "global-chart.deploymentValuesPath" $name }}
{{- $labelCtx := dict "root" $root "deploymentName" $name }}
{{- $autoscaling := default (dict) $deploy.autoscaling }}
{{- $keda := default (dict) $deploy.keda }}
{{- $podRecreation := default (dict) $deploy.podRecreation }}
{{- $dnsConfig := default (dict) $deploy.dnsConfig }}
{{- $svc := default (dict) $deploy.service }}
{{- $kind := include "global-chart.workloadKind" $deploy }}
{{- $sts := eq $kind "StatefulSet" }}
{{- /* Backstop guard: the schema's if/then on kind rejects these first; this is
       the message under --skip-schema-validation (ADR 0020). */}}
{{- $kindOnly := dict "Deployment" (list "strategy" "progressDeadlineSeconds") "StatefulSet" (list "updateStrategy" "podManagementPolicy" "volumeClaimTemplates" "persistentVolumeClaimRetentionPolicy") }}
{{- range $owner, $fields := $kindOnly }}
{{- if ne $owner $kind }}
{{- range $fields }}
{{- if eq (include "global-chart.isSet" (list $deploy .)) "true" }}
{{- fail (printf "%s.%s: a %s field, and this entry renders a %s. Drop it, or set kind: %s." $errCtx . $owner $kind $owner) }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- if $sts }}
{{- /* Every pod carries controller-revision-hash: <name>-<hash>, the hash a
       decimal uint32 of up to 10 characters, and a label value holds 63. Past 52
       a pod is created or not depending on the hash. Truncating only the
       StatefulSet would split its name from its Service and HPA (ADR 0020). */}}
{{- $stsName := printf "%s-%s" (include "global-chart.fullname" $root) $name }}
{{- if gt (len $stsName) 52 }}
{{- fail (printf "%s: a StatefulSet name is at most 52 characters, and '%s' has %d. The pods' controller-revision-hash label appends up to 11 to it, within the 63 of a label value. Shorten the key, or the fullname with fullnameOverride." $errCtx $stsName (len $stsName)) }}
{{- end }}
{{- end }}
{{- /* Each claim template becomes a pod volume of its name: it must not clash
       with a volumes entry or a generated volume, and some container must mount
       it, or the claim is storage paid for and never used (ADR 0020). */}}
{{- $volumeNames := dict }}
{{- range (default (list) $deploy.volumes) }}{{- if kindIs "map" . }}{{- $_ := set $volumeNames (toString .name) true }}{{- end }}{{- end }}
{{- /* A mount with no name could be any claim's: the null is validateNullItems'
       to report, so the "mounted by nobody" check stands down */}}
{{- $mountNames := dict }}
{{- $unnamedMount := false }}
{{- range $c := concat (list $deploy) (default (list) $deploy.extraContainers) (default (list) $deploy.extraInitContainers) }}
{{- range (default (list) (default (dict) $c).volumeMounts) }}
{{- if include "global-chart.isNamedEntry" . }}{{- $_ := set $mountNames (toString .name) true }}{{- else }}{{- $unnamedMount = true }}{{- end }}
{{- end }}
{{- end }}
{{- $claimVolumes := list }}
{{- range $i, $claim := (default (list) $deploy.volumeClaimTemplates) }}
{{- if include "global-chart.isNamedEntry" $claim }}
{{- if hasKey $volumeNames (toString $claim.name) }}
{{- fail (printf "%s.volumeClaimTemplates[%d]: '%s' is also the name of a volumes entry, and the claim becomes a pod volume of that name. Rename one of them." $errCtx $i $claim.name) }}
{{- end }}
{{- if not (or $unnamedMount (hasKey $mountNames (toString $claim.name))) }}
{{- fail (printf "%s.volumeClaimTemplates[%d]: '%s' is mounted by no volumeMounts item of the pod's containers. Mount it, or drop the entry." $errCtx $i $claim.name) }}
{{- end }}
{{- $claimVolumes = append $claimVolumes (dict "name" $claim.name) }}
{{- end }}
{{- end }}
{{- /* externalSecrets: the Deployment always reads the real Secret, never the
       hook copy (ADR 0007). Resolved once, for the pod's checksum and its env/volumes */ -}}
{{- $es := include "global-chart.resolveExternalSecretRefs" (dict "root" $root "refs" $deploy.externalSecrets "hook" false "volumes" (concat (default (list) $deploy.volumes) $claimVolumes) "errCtx" $errCtx) | fromJson }}
---
apiVersion: apps/v1
kind: {{ $kind }}
metadata:
  name: {{ $depFullname }}
  labels:
    {{- include "global-chart.deploymentLabels" $labelCtx | nindent 4 }}
  {{- /* reloader.externalSecrets (ADR 0016): on the Deployment's metadata, where
         Reloader reads it, not on the pod template */ -}}
  {{- $ownAnnotations := include "global-chart.deploymentOwnAnnotations" (dict "root" $root "deploy" $deploy "name" $name "es" $es) | fromJson }}
  {{- with (include "global-chart.renderAnnotations" (dict "root" $root "own" $ownAnnotations)) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
spec:
  {{- if $sts }}
  serviceName: {{ include "global-chart.headlessServiceName" $labelCtx }}
  {{- end }}
  {{- /* An autoscaler owns spec.replicas: emitting it here makes every upgrade
         snap the Deployment back to this value before the autoscaler corrects
         it — and with KEDA minReplicaCount: 0 it wakes a workload that was
         deliberately scaled to zero. */}}
  {{- if not (or $autoscaling.enabled $keda.enabled) }}
  replicas: {{ include "global-chart.printScalar" (dict "value" (ternary $deploy.replicaCount 2 (hasKey $deploy "replicaCount")) "errCtx" (printf "%s.replicaCount" $errCtx)) }}
  {{- end }}
  {{- with $deploy.strategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with $deploy.updateStrategy }}
  updateStrategy:
    {{- with .type }}
    type: {{ . }}
    {{- end }}
    {{- with .rollingUpdate }}
    rollingUpdate:
      {{- if hasKey . "partition" }}
      partition: {{ include "global-chart.printScalar" (dict "value" .partition "errCtx" (printf "%s.updateStrategy.rollingUpdate.partition" $errCtx)) }}
      {{- end }}
    {{- end }}
  {{- end }}
  {{- with $deploy.podManagementPolicy }}
  podManagementPolicy: {{ . }}
  {{- end }}
  {{- if $sts }}
  {{- $retention := default (dict) $deploy.persistentVolumeClaimRetentionPolicy }}
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: {{ ternary $retention.whenDeleted "Retain" (eq (include "global-chart.isSet" (list $retention "whenDeleted")) "true") }}
    whenScaled: {{ ternary $retention.whenScaled "Retain" (eq (include "global-chart.isSet" (list $retention "whenScaled")) "true") }}
  {{- end }}
  {{- if hasKey $deploy "revisionHistoryLimit" }}
  revisionHistoryLimit: {{ include "global-chart.printScalar" (dict "value" $deploy.revisionHistoryLimit "errCtx" (printf "%s.revisionHistoryLimit" $errCtx)) }}
  {{- end }}
  {{- if hasKey $deploy "progressDeadlineSeconds" }}
  progressDeadlineSeconds: {{ include "global-chart.printScalar" (dict "value" $deploy.progressDeadlineSeconds "errCtx" (printf "%s.progressDeadlineSeconds" $errCtx)) }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "global-chart.deploymentSelectorLabels" $labelCtx | nindent 6 }}
  template:
    metadata:
      {{- /* One merged map, not four concatenated blocks: podAnnotations and the
             common annotations can name the same key, and so can podAnnotations and
             a checksum. podAnnotations wins either way, which is what the duplicate
             keys already did — Helm took the last one — minus the manifest a strict
             validator rejects. */ -}}
      {{- $checksums := dict
            "checksum/config" (toYaml $deploy.configMap | sha256sum)
            "checksum/secret" (toYaml $deploy.secret | sha256sum)
            "checksum/mounted-config-files" (toYaml $deploy.mountedConfigFiles | sha256sum) }}
      {{- /* checksum/external-secrets (issue #174): the rendered spec of every
             externalSecrets entry the deployment references, in list order — so a
             change to target.template, remote.key or the list itself rolls the pods.
             Only with references: an always-present key would roll every deployment
             once on upgrade for nothing. It hashes the spec, not the values: a new
             version in the external store, the window before ESO rewrites the
             Secret on rollout, and a target.immutable Secret are not covered.
             Hooks and cronjobs get none: their pods are created on every run. */ -}}
      {{- with $es.specs }}
      {{- $_ := set $checksums "checksum/external-secrets" (join "\n---\n" . | sha256sum) }}
      {{- end }}
      {{- if $podRecreation.enabled }}
      {{- $_ := set $checksums "timestamp" (now | date "20060102150405") }}
      {{- end }}
      {{- with (include "global-chart.renderAnnotations" (dict "root" $root "own" (mergeOverwrite $checksums (deepCopy (default (dict) $deploy.podAnnotations))))) }}
      annotations:
        {{- . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "global-chart.deploymentLabels" (dict "root" $root "deploymentName" $name "own" $deploy.podLabels) | nindent 8 }}
    spec:
      {{- /* ImagePullSecrets: deployment-level > global (hasKey distinguishes unset from empty) */ -}}
      {{- $imagePullSecrets := list -}}
      {{- if hasKey $deploy "imagePullSecrets" -}}
        {{- $imagePullSecrets = $deploy.imagePullSecrets -}}
      {{- else -}}
        {{- $global := default (dict) $root.Values.global -}}
        {{- $imagePullSecrets = $global.imagePullSecrets -}}
      {{- end -}}
      {{- with (include "global-chart.renderImagePullSecrets" $imagePullSecrets) }}
{{- . | nindent 6 }}
      {{- end }}
      {{- if $deploy.hostAliases }}
      hostAliases:
        {{- toYaml $deploy.hostAliases | nindent 8 }}
      {{- end }}
      {{- with (include "global-chart.renderDnsConfig" $dnsConfig) }}
{{- . | nindent 6 }}
      {{- end }}
      serviceAccountName: {{ default "default" (include "global-chart.deploymentServiceAccount" (dict "root" $root "deploymentName" $name "deployment" $deploy) | fromJson).name }}
      {{- if hasKey $deploy "automountServiceAccountToken" }}
      automountServiceAccountToken: {{ $deploy.automountServiceAccountToken }}
      {{- end }}
      {{- if hasKey $deploy "terminationGracePeriodSeconds" }}
      terminationGracePeriodSeconds: {{ include "global-chart.printScalar" (dict "value" $deploy.terminationGracePeriodSeconds "errCtx" (printf "%s.terminationGracePeriodSeconds" $errCtx)) }}
      {{- end }}
      {{- if $deploy.podSecurityContext }}
      securityContext:
        {{- toYaml $deploy.podSecurityContext | nindent 8 }}
      {{- end }}
      {{- with $deploy.extraInitContainers }}
      initContainers:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ $depFullname }}
          {{- if and (kindIs "map" $deploy.image) $deploy.image.repository (not (or $deploy.image.tag $deploy.image.digest)) }}
          {{- fail (printf "%s.image: requires either a tag or a digest when repository is provided" $errCtx) }}
          {{- end }}
          {{- $depImageRef := include "global-chart.imageString" (dict "image" $deploy.image "global" $root.Values.global "errCtx" (printf "%s.image" $errCtx)) }}
          image: {{ required (printf "%s.image: must define a repository with a tag or a digest, or be a full image reference" $errCtx) $depImageRef | quote }}
          imagePullPolicy: {{ include "global-chart.imagePullPolicy" (dict "image" $deploy.image) }}
          {{- if $deploy.command }}
          command:
            {{- toYaml $deploy.command | nindent 12 }}
          {{- end }}
          {{- if $deploy.args }}
          args:
            {{- toYaml $deploy.args | nindent 12 }}
          {{- end }}
          {{- with $deploy.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            {{- range (include "global-chart.containerPorts" (dict "service" $svc "errCtx" (printf "%s.service" $errCtx)) | fromJsonArray) }}
            - name: {{ .name }}
              containerPort: {{ include "global-chart.printScalar" .containerPort }}
              protocol: {{ .protocol }}
            {{- end }}
          {{- if $deploy.livenessProbe }}
          livenessProbe:
            {{- toYaml $deploy.livenessProbe | nindent 12 }}
          {{- end }}
          {{- if $deploy.readinessProbe }}
          readinessProbe:
            {{- toYaml $deploy.readinessProbe | nindent 12 }}
          {{- end }}
          {{- if $deploy.startupProbe }}
          startupProbe:
            {{- toYaml $deploy.startupProbe | nindent 12 }}
          {{- end }}
          {{- with $deploy.lifecycle }}
          lifecycle:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $deploy.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- /* externalSecrets ($es, resolved at the top): a mountPath makes the
                 entry a volume; any other entry is a secret source, in the secret group */ -}}
          {{- $esEnv := $es.env }}
          {{- $esMounted := $es.mounted }}
          {{- if or $deploy.configMap $deploy.envFromConfigMaps $deploy.secret $deploy.envFromSecrets $esEnv }}
          envFrom:
            {{- if $deploy.configMap }}
            - configMapRef:
                name: {{ $depFullname | quote }}
            {{- end }}
            {{- range $cm := $deploy.envFromConfigMaps }}
            - configMapRef:
                name: {{ $cm | quote }}
            {{- end }}
            {{- if $deploy.secret }}
            - secretRef:
                name: {{ $depFullname | quote }}
            {{- end }}
            {{- range $sec := $deploy.envFromSecrets }}
            - secretRef:
                name: {{ $sec | quote }}
            {{- end }}
            {{- range $esEnv }}
            - secretRef:
                name: {{ . | quote }}
            {{- end }}
          {{- end }}
          {{- if $deploy.additionalEnvs }}
          env:
            {{- toYaml $deploy.additionalEnvs | nindent 12 }}
          {{- end }}
          {{- with (include "global-chart.containerVolumeMounts" (dict "errCtx" $errCtx "volumeMounts" $deploy.volumeMounts "mountedConfigFiles" $deploy.mountedConfigFiles "externalSecrets" $esMounted) | fromJsonArray) }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with $deploy.extraContainers }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- $mountedConfigFiles := $deploy.mountedConfigFiles }}
      {{- $userVolumes := default (list) $deploy.volumes }}
      {{- $hasUserVolumes := gt (len $userVolumes) 0 }}
      {{- $hasMcfFiles := and $mountedConfigFiles (gt (len (default (list) $mountedConfigFiles.files)) 0) }}
      {{- $hasMcfBundles := and $mountedConfigFiles (gt (len (default (list) $mountedConfigFiles.bundles)) 0) }}
      {{- if or $hasUserVolumes $hasMcfFiles $hasMcfBundles $esMounted }}
      volumes:
        {{- range $i, $v := $userVolumes }}
        {{- include "global-chart.renderVolume" (dict "volume" $v "errCtx" (printf "%s.volumes[%d]" $errCtx $i)) | nindent 8 }}
        {{- end }}
        {{- if $hasMcfFiles }}
        {{- range $i, $f := $mountedConfigFiles.files }}
        - name: {{ include "global-chart.mountedFileVolumeName" (dict "fileName" $f.name) }}
          configMap:
            name: {{ include "global-chart.mountedConfigMapName" (dict "deploymentFullname" $depFullname "fileName" $f.name) }}
        {{- end }}
        {{- end }}
        {{- if $hasMcfBundles }}
        {{- range $bi, $b := $mountedConfigFiles.bundles }}
        - name: {{ include "global-chart.mountedBundleVolumeName" (dict "bundleIndex" $bi) }}
          projected:
            sources:
            {{- range $fi, $f := $b.files }}
              - configMap:
                  name: {{ include "global-chart.mountedConfigMapName" (dict "deploymentFullname" $depFullname "fileName" $f.name) }}
                  items:
                    - key: {{ $f.relPath | base | quote }}
                      path: {{ $f.relPath | quote }}
            {{- end }}
        {{- end }}
        {{- end }}
        {{- with $esMounted }}
        {{- include "global-chart.renderExternalSecretVolumes" . | nindent 8 }}
        {{- end }}
      {{- end }}
      {{- with $deploy.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $deploy.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $deploy.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $deploy.priorityClassName }}
      priorityClassName: {{ . | quote }}
      {{- end }}
      {{- with $deploy.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  {{- /* The claims' metadata carries the selector labels and the entry's own,
         never helm.sh/chart or the common labels and annotations:
         volumeClaimTemplates is immutable, so a label that moves with the chart
         version would make every upgrade a forbidden update (ADR 0020). */}}
  {{- with $deploy.volumeClaimTemplates }}
  volumeClaimTemplates:
    {{- range . }}
    {{- if kindIs "map" . }}
    - metadata:
        name: {{ .name }}
        labels:
          {{- /* The selector labels win, as in mergeLabels: they tie the claim to its workload */}}
          {{- toYaml (mergeOverwrite (deepCopy (default (dict) .labels)) (include "global-chart.deploymentSelectorLabels" $labelCtx | fromYaml)) | nindent 10 }}
        {{- with .annotations }}
        annotations:
          {{- toYaml . | nindent 10 }}
        {{- end }}
      spec:
        accessModes:
          {{- toYaml (default (list "ReadWriteOnce") .accessModes) | nindent 10 }}
        {{- if eq (include "global-chart.isSet" (list . "storageClassName")) "true" }}
        storageClassName: {{ .storageClassName | quote }}
        {{- end }}
        {{- /* Kubernetes' own default, written out: the API server fills it in,
               and a field the manifest omits is a standing diff for a GitOps
               controller on an immutable template */}}
        volumeMode: {{ default "Filesystem" .volumeMode }}
        resources:
          requests:
            storage: {{ .size | quote }}
    {{- end }}
    {{- end }}
  {{- end }}
{{- end }}
{{- end }}
{{- end }}
