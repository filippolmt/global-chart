{{- $ing := default (dict) .Values.ingress }}
{{- if $ing.enabled }}
{{- $root := . }}
{{- include "global-chart.rejectNullItems" (dict "list" $ing.tls "errCtx" "ingress.tls") }}
{{- include "global-chart.rejectNullItems" (dict "list" $ing.hosts "errCtx" "ingress.hosts") }}
{{- range $hostIdx, $hostEntry := $ing.hosts }}
{{- include "global-chart.rejectNullItems" (dict "list" $hostEntry.paths "errCtx" (printf "ingress.hosts[%d].paths" $hostIdx)) }}
{{- end }}
{{- $fullName := include "global-chart.fullname" $root }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullName }}
  labels:
    {{- include "global-chart.labels" $root | nindent 4 }}
  {{- with (include "global-chart.renderAnnotations" (dict "root" $root "own" $ing.annotations)) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
spec:
  {{- if $ing.className }}
  ingressClassName: {{ $ing.className | quote }}
  {{- end }}

  {{- if $ing.tls }}
  tls:
    {{- range $ing.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName | quote }}
    {{- end }}
  {{- end }}
  rules:
    {{- range $hostIdx, $hostEntry := $ing.hosts }}
      {{- /* Resolve service name and port via shared helper */ -}}
      {{- $b := include "global-chart.resolveBackend" (dict "root" $root "ref" $hostEntry "errCtx" (printf "ingress.hosts[%d]" $hostIdx) "protocol" "TCP") | fromJson -}}
      {{- $svcName := $b.name -}}
      {{- $svcPort := $b.port }}

    - host: {{ $hostEntry.host | quote }}
      http:
        paths:
          {{- range $path := $hostEntry.paths }}
          - path: {{ $path.path }}
            pathType: {{ ternary $path.pathType "ImplementationSpecific" (hasKey $path "pathType") }}
            backend:
              service:
                name: {{ $svcName }}
                port:
                  number: {{ include "global-chart.printScalar" $svcPort }}
          {{- end }}
    {{- end }}
{{- end }}
