{{/*
  Hooks can be defined in two places:
  1. Root level: .Values.hooks (standalone, optional fromDeployment for image)
  2. Inside deployments: .Values.deployments.<name>.hooks (inherits image, configMap, secret, SA from deployment)
*/}}

{{- $root := . }}

{{/* ====== PART 1: Root-level hooks ====== */}}
{{- if .Values.hooks }}
{{- range $hookType, $jobs := .Values.hooks }}
{{- range $name, $command := $jobs }}
{{- if $command }}
{{- $hookFullname := include "global-chart.hookfullname" (merge (dict "hookname" $hookType "jobname" $name) $root) }}

{{- /* Resolve image: explicit > fromDeployment > error (see jobImageString helper) */ -}}
{{- $imageRef := required (printf "image is required for hooks.%s.%s (set hooks.%s.%s.image or hooks.%s.%s.fromDeployment)" $hookType $name $hookType $name $hookType $name) (include "global-chart.jobImageString" (dict "root" $root "job" $command "errCtx" (printf "hooks.%s.%s" $hookType $name))) }}

{{- /* ServiceAccount: explicit > create own (see jobServiceAccount helper; no
       deployment to inherit from at root level) */ -}}
{{- $sa := include "global-chart.jobServiceAccount" (dict "root" $root "job" $command "jobFullname" $hookFullname) | fromJson -}}
{{- $saName := $sa.name -}}

{{- /* The SA sorts before its Job; hookAnnotations owns the offset */ -}}
{{- if $sa.create }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $saName }}
  namespace: {{ $root.Release.Namespace | quote }}
  labels:
    {{- include "global-chart.hookLabelsWithComponent" (dict "root" $root) | nindent 4 }}
  annotations:
    {{- with (include "global-chart.renderAnnotations" (dict "root" $root "own" $sa.annotations)) }}
    {{- . | nindent 4 }}
    {{- end }}
    {{- include "global-chart.hookAnnotations" (dict "hookType" $hookType "role" "sa" "command" $command) | nindent 4 }}
automountServiceAccountToken: {{ $sa.automount }}
{{- end }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $hookFullname }}
  labels:
    {{- include "global-chart.hookLabelsWithComponent" (dict "root" $root) | nindent 4 }}
  annotations:
    {{- with (include "global-chart.renderAnnotations" (dict "root" $root "own" $command.annotations)) }}
    {{- . | nindent 4 }}
    {{- end }}
    {{- include "global-chart.hookAnnotations" (dict "hookType" $hookType "role" "job" "command" $command) | nindent 4 }}
spec:
  {{- if hasKey $command "activeDeadlineSeconds" }}
  activeDeadlineSeconds: {{ $command.activeDeadlineSeconds }}
  {{- end }}
  template:
    metadata:
      name: {{ $hookFullname }}
      labels:
        {{- include "global-chart.hookLabelsWithComponent" (dict "root" $root) | nindent 8 }}
      {{- with (include "global-chart.renderAnnotations" (dict "root" $root)) }}
      annotations:
        {{- . | nindent 8 }}
      {{- end }}
    spec:
      {{- $ctx := dict "root" $root "job" $command "saName" $saName "imageRef" $imageRef "containerName" $hookFullname "kind" "hook" "hookType" $hookType "errCtx" (printf "hooks.%s.%s" $hookType $name) }}
      {{- include "global-chart.jobPodSpec" $ctx | trimPrefix "\n" | nindent 6 }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}

{{/* ====== PART 2: Deployment-level hooks (inherit from deployment) ====== */}}
{{- range $deployName, $deploy := .Values.deployments }}
{{- if $deploy }}
{{- if and (eq (include "global-chart.deploymentEnabled" $deploy) "true") $deploy.hooks }}

{{- /* Compute deployment-level values ONCE per deployment (before hookType/command loops) */ -}}
{{- $deployFullname := include "global-chart.deploymentFullname" (dict "root" $root "deploymentName" $deployName) -}}
{{- $hasDeployConfigMap := and $deploy.configMap (gt (len $deploy.configMap) 0) -}}
{{- $hasDeploySecret := and $deploy.secret (gt (len $deploy.secret) 0) -}}
{{- /* Aggregate ALL hook types for prerequisite resources (sorted for deterministic output) */ -}}
{{- $allHookTypes := keys $deploy.hooks | sortAlpha | join "," -}}

{{- /* Minimum effective Job weight across all hooks of this deployment: the
       prereq copies must sort ahead of the earliest Job */ -}}
{{- $minJobWeight := include "global-chart.minHookWeight" (dict "hooks" $deploy.hooks) -}}

{{- /*
  Hook-specific ConfigMap/Secret: duplicates of the deployment's generated ConfigMap/Secret
  with hook annotations so they exist BEFORE the Job runs.
  Normal (non-hook) ConfigMap/Secret are NOT updated until after hooks complete,
  so the Job would reference stale values without these hook copies.
  Rendered ONCE per deployment (not per hook command) with ALL hook types aggregated.
  Weight order: prereq < SA < Job, per the role table in hookAnnotations.
*/ -}}
{{- if $hasDeployConfigMap }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "global-chart.hookPrereqConfigName" (dict "deploymentFullname" $deployFullname) }}
  labels:
    {{- include "global-chart.hookLabelsWithComponent" (dict "root" $root "deploymentName" $deployName) | nindent 4 }}
  annotations:
    {{- with (include "global-chart.renderAnnotations" (dict "root" $root)) }}
    {{- . | nindent 4 }}
    {{- end }}
    {{- include "global-chart.hookAnnotations" (dict "hookType" $allHookTypes "role" "prereq" "weight" $minJobWeight) | nindent 4 }}
data:
  {{- include "global-chart.renderConfigMapData" $deploy.configMap | nindent 2 }}
{{- end }}
{{- if $hasDeploySecret }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "global-chart.hookPrereqSecretName" (dict "deploymentFullname" $deployFullname) }}
  labels:
    {{- include "global-chart.hookLabelsWithComponent" (dict "root" $root "deploymentName" $deployName) | nindent 4 }}
  annotations:
    {{- with (include "global-chart.renderAnnotations" (dict "root" $root)) }}
    {{- . | nindent 4 }}
    {{- end }}
    {{- include "global-chart.hookAnnotations" (dict "hookType" $allHookTypes "role" "prereq" "weight" $minJobWeight) | nindent 4 }}
type: Opaque
data:
  {{- include "global-chart.renderSecretData" $deploy.secret | nindent 2 }}
{{- end }}

{{- /* Each hook's name and ServiceAccount, resolved once: the pre-install prereq
       copy below and the render loop further down both read this, so neither the
       name nor the SA can be derived twice and drift */ -}}
{{- $hooks := dict -}}
{{- range $hookType, $jobs := $deploy.hooks -}}
{{- range $name, $command := $jobs -}}
{{- if $command -}}
{{- $fn := include "global-chart.deploymentHookName" (dict "root" $root "deploymentName" $deployName "hookType" $hookType "jobName" $name) -}}
{{- $_ := set $hooks (printf "%s/%s" $hookType $name) (dict "fullname" $fn "sa" (include "global-chart.jobServiceAccount" (dict "root" $root "job" $command "deploy" $deploy "deployName" $deployName "jobFullname" $fn) | fromJson)) -}}
{{- end -}}
{{- end -}}
{{- end -}}

{{- /*
  Hook-prerequisite copy of the deployment's ServiceAccount.

  Helm creates normal resources AFTER pre-install hooks, so a pre-install hook Job
  that binds a chart-created deployment SA references an object that does not exist
  yet and can never schedule its pod (issue #71). The SA is duplicated here with the
  SAME name, annotations and automount as the real one — Workload Identity and IRSA
  bind the identity to system:serviceaccount:<ns>:<name>, so a dedicated name would
  strip the Job of the permissions it is being given.

  pre-install ONLY, and delete-policy hook-succeeded,hook-failed (NOT
  before-hook-creation): the copy lives for the duration of the hook phase and is
  gone before Helm creates the real SA, so the two never collide. Emitting it for
  pre-upgrade would fail with AlreadyExists, and adding before-hook-creation would
  delete a live SA mid-upgrade, invalidating the bound tokens of running pods.
  See docs/adr/0002-hook-prerequisite-serviceaccount-copy.md.
*/ -}}
{{- $deploySA := include "global-chart.deploymentServiceAccount" (dict "root" $root "deploymentName" $deployName "deployment" $deploy) | fromJson -}}
{{- $deploySAName := $deploySA.name -}}
{{- /* The pre-install hooks that actually bind the deployment SA; their minimum
       weight is what the copy sorts against */ -}}
{{- $preInstallSAHooks := dict -}}
{{- if and $deploySA.create (hasKey $deploy.hooks "pre-install") -}}
  {{- range $name, $command := (index $deploy.hooks "pre-install") -}}
    {{- if $command -}}
      {{- $resolvedSA := (index $hooks (printf "pre-install/%s" $name)).sa -}}
      {{- /* Only the hooks that actually bind the deployment SA matter: a hook with
             its own explicit or created SA already gets one at the "sa" offset */ -}}
      {{- if and (not $resolvedSA.create) (eq $resolvedSA.name $deploySAName) -}}
        {{- $_ := set $preInstallSAHooks $name $command -}}
      {{- end -}}
    {{- end -}}
  {{- end -}}
{{- end -}}
{{- if $preInstallSAHooks }}
{{- $preInstallMinWeight := include "global-chart.minHookWeight" (dict "hooks" (dict "pre-install" $preInstallSAHooks)) }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $deploySAName }}
  namespace: {{ $root.Release.Namespace | quote }}
  labels:
    {{- include "global-chart.hookLabelsWithComponent" (dict "root" $root "deploymentName" $deployName) | nindent 4 }}
  annotations:
    {{- with (include "global-chart.renderAnnotations" (dict "root" $root "own" $deploySA.annotations)) }}
    {{- . | nindent 4 }}
    {{- end }}
    {{- include "global-chart.hookAnnotations" (dict "hookType" "pre-install" "role" "pre-install-sa" "weight" $preInstallMinWeight) | nindent 4 }}
automountServiceAccountToken: {{ $deploySA.automount }}
{{- end }}

{{- /* Per hook type and command: SA + Job */ -}}
{{- range $hookType, $jobs := $deploy.hooks }}
{{- range $name, $command := $jobs }}
{{- if $command }}

{{- /* Hook fullname and ServiceAccount, both resolved once above */ -}}
{{- $hook := index $hooks (printf "%s/%s" $hookType $name) }}
{{- $hookFullname := $hook.fullname }}

{{- /* Resolve image: explicit in hook > inherited from deployment (see jobImageString helper) */ -}}
{{- $imageRef := required (printf "image is required for deployments.%s.hooks.%s.%s" $deployName $hookType $name) (include "global-chart.jobImageString" (dict "root" $root "job" $command "deploy" $deploy "errCtx" (printf "deployments.%s.hooks.%s.%s" $deployName $hookType $name))) }}

{{- /* ServiceAccount: explicit in hook > inherited from deployment > create new for hook (see jobServiceAccount helper) */ -}}
{{- $sa := $hook.sa -}}
{{- $saName := $sa.name -}}
{{- $saCreate := $sa.create -}}
{{- $saAutomount := $sa.automount -}}
{{- $saAnnotations := $sa.annotations -}}

{{- /* Create SA only if needed (not using deployment's or explicit existing);
       it sorts before its Job — hookAnnotations owns the offset */ -}}
{{- if $saCreate }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $saName }}
  namespace: {{ $root.Release.Namespace | quote }}
  labels:
    {{- include "global-chart.hookLabelsWithComponent" (dict "root" $root "deploymentName" $deployName) | nindent 4 }}
  annotations:
    {{- with (include "global-chart.renderAnnotations" (dict "root" $root "own" $saAnnotations)) }}
    {{- . | nindent 4 }}
    {{- end }}
    {{- include "global-chart.hookAnnotations" (dict "hookType" $hookType "role" "sa" "command" $command) | nindent 4 }}
automountServiceAccountToken: {{ $saAutomount }}
{{ end }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $hookFullname }}
  labels:
    {{- include "global-chart.hookLabelsWithComponent" (dict "root" $root "deploymentName" $deployName) | nindent 4 }}
  annotations:
    {{- with (include "global-chart.renderAnnotations" (dict "root" $root "own" $command.annotations)) }}
    {{- . | nindent 4 }}
    {{- end }}
    {{- include "global-chart.hookAnnotations" (dict "hookType" $hookType "role" "job" "command" $command) | nindent 4 }}
spec:
  {{- if hasKey $command "activeDeadlineSeconds" }}
  activeDeadlineSeconds: {{ $command.activeDeadlineSeconds }}
  {{- end }}
  template:
    metadata:
      name: {{ $hookFullname }}
      labels:
        {{- include "global-chart.hookLabelsWithComponent" (dict "root" $root "deploymentName" $deployName) | nindent 8 }}
      {{- with (include "global-chart.renderAnnotations" (dict "root" $root)) }}
      annotations:
        {{- . | nindent 8 }}
      {{- end }}
    spec:
      {{- $configMapRef := include "global-chart.hookPrereqConfigName" (dict "deploymentFullname" $deployFullname) }}
      {{- $secretRef := include "global-chart.hookPrereqSecretName" (dict "deploymentFullname" $deployFullname) }}
      {{- $ctx := dict "root" $root "job" $command "deploy" $deploy "saName" $saName "imageRef" $imageRef "containerName" $name "configMapRef" $configMapRef "secretRef" $secretRef "kind" "hook" "hookType" $hookType "deployName" $deployName "errCtx" (printf "deployments.%s.hooks.%s.%s" $deployName $hookType $name) }}
      {{- include "global-chart.jobPodSpec" $ctx | trimPrefix "\n" | nindent 6 }}
{{ end }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
