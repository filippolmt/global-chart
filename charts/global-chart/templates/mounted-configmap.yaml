{{- /* Every data value is a `|2` block scalar, its content at the key's
       indent + 2: a bare `|` takes its indentation from the content's first
       line, so content starting with indentation ended the scalar early
       (issue #157). Every key is quoted: a bare `on` or `1.10` is reparsed as
       a YAML 1.1 scalar and reaches the API server as another key (issue
       #152). */ -}}
{{- $root := . -}}
{{- range $name, $deploy := .Values.deployments }}
{{- if $deploy }}
{{- if eq (include "global-chart.deploymentEnabled" $deploy) "true" }}
{{- $mountedConfigFiles := $deploy.mountedConfigFiles -}}
{{- if $mountedConfigFiles }}
{{- $depFullname := include "global-chart.deploymentFullname" (dict "root" $root "deploymentName" $name) }}
{{- $errCtx := include "global-chart.deploymentValuesPath" $name }}
{{- $labelCtx := dict "root" $root "deploymentName" $name }}

{{- if $mountedConfigFiles.files }}
{{- range $i, $f := $mountedConfigFiles.files }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "global-chart.mountedConfigMapName" (dict "deploymentFullname" $depFullname "fileName" $f.name) }}
  labels:
    {{- include "global-chart.deploymentLabels" $labelCtx | nindent 4 }}
  {{- with (include "global-chart.renderAnnotations" (dict "root" $root)) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
data:
  {{ required (printf "%s.mountedConfigFiles.files[%d].filename: required" $errCtx $i) $f.filename | quote }}: |2
    {{- /* "" is an empty file, not a missing one: only an absent or null content fails */ -}}
    {{- if kindIs "invalid" $f.content }}{{ fail (printf "%s.mountedConfigFiles.files[%d].content: required" $errCtx $i) }}{{ end -}}
    {{- $content := $f.content -}}
    {{- $content | nindent 4 -}}
{{- end }}
{{- end }}

{{- if $mountedConfigFiles.bundles }}
{{- range $bi, $b := $mountedConfigFiles.bundles }}
{{- range $fi, $f := $b.files }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "global-chart.mountedConfigMapName" (dict "deploymentFullname" $depFullname "fileName" $f.name) }}
  labels:
    {{- include "global-chart.deploymentLabels" $labelCtx | nindent 4 }}
  {{- with (include "global-chart.renderAnnotations" (dict "root" $root)) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
data:
  {{ required (printf "%s.mountedConfigFiles.bundles[%d].files[%d].relPath: required" $errCtx $bi $fi) $f.relPath | base | quote }}: |2
    {{- /* "" is an empty file, not a missing one: only an absent or null content fails */ -}}
    {{- if kindIs "invalid" $f.content }}{{ fail (printf "%s.mountedConfigFiles.bundles[%d].files[%d].content: required" $errCtx $bi $fi) }}{{ end -}}
    {{- $content := $f.content -}}
    {{- $content | nindent 4 -}}
{{- end }}
{{- end }}
{{- end }}

{{- end }}
{{- end }}
{{- end }}
{{- end }}
