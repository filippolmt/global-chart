{{- $root := . -}}
{{- /* The hooks that read each ExternalSecret's copy, keyed by externalSecrets key:
       the copy below exists only for a key some of them reference (ADR 0007) */ -}}
{{- $consumers := include "global-chart.externalSecretHookConsumers" $root | fromJson -}}
{{- range $name, $secret := .Values.externalSecrets }}
{{- if $secret }}
{{- $nameCtx := dict "root" $root "key" $name "secret" $secret -}}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "global-chart.externalSecretName" $nameCtx | quote }}
  labels:
    {{- include "global-chart.labels" $root | nindent 4 }}
  {{- with (include "global-chart.renderAnnotations" (dict "root" $root "own" $secret.annotations)) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
spec:
  {{- include "global-chart.renderExternalSecretSpec" $nameCtx | trimPrefix "\n" | nindent 2 }}
{{- /*
  Hook-prerequisite copy: the ExternalSecret is a normal resource, applied after
  the pre-* hooks, so a hook Job reading its Secret would wait for something
  nothing creates until the hook finishes (issue #110) — and a post-delete hook
  runs after it is gone. The copy produces its OWN Secret (<target>-hook), which
  those hooks read; the Deployment, the cronjobs and the other hooks keep
  reading the real one. Same spec, except target.name and a forced
  creationPolicy Owner — Owner is what makes the Secret go away with the copy.
  One copy per key, whatever the number of hooks reading it: phases aggregated,
  weight from the earliest Job. See docs/adr/0007-hook-prerequisite-externalsecret-copy.md.
*/}}
{{- with index $consumers $name }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "global-chart.externalSecretHookName" $nameCtx | quote }}
  labels:
    {{- include "global-chart.hookLabelsWithComponent" (dict "root" $root) | nindent 4 }}
  annotations:
    {{- with (include "global-chart.renderAnnotations" (dict "root" $root)) }}
    {{- . | nindent 4 }}
    {{- end }}
    {{- include "global-chart.hookAnnotations" (dict "hookType" (keys . | sortAlpha | join ",") "role" "prereq" "weight" (include "global-chart.minHookWeight" (dict "hooks" .))) | nindent 4 }}
spec:
  {{- include "global-chart.renderExternalSecretSpec" (merge (dict "targetName" (include "global-chart.externalSecretHookTargetName" $nameCtx) "creationPolicy" "Owner") $nameCtx) | trimPrefix "\n" | nindent 2 }}
{{- end }}
{{ end }}
{{- end }}
