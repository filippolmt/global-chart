apiVersion: v2
name: global-chart
description: "Reusable Helm chart for multi-deployment Kubernetes applications—Deployments, StatefulSets, Services, Ingress, CronJobs, Hooks, ExternalSecrets, RBAC, HPA, PDB, NetworkPolicy, and more."

# A chart can be either an 'application' or a 'library' chart.
#
# Application charts are a collection of templates that can be packaged into versioned archives
# to be deployed.
#
# Library charts provide useful utilities or functions for the chart developer. They're included as
# a dependency of application charts to inject those utilities and functions into the rendering
# pipeline. Library charts do not define any templates and therefore cannot be deployed.
type: application

# This is the chart version. This version number should be incremented each time you make changes
# to the chart and its templates.
# Versions are expected to follow Semantic Versioning (https://semver.org/)
version: 3.3.0

# appVersion is intentionally omitted: this is a generic, reusable chart that
# deploys arbitrary workloads, so there is no single application version to pin.
# The app.kubernetes.io/version label is therefore only emitted when a consumer
# sets it (e.g. via global.commonLabels).

# Chart icon
icon: https://helm.sh/img/helm.svg

# Project URLs
home: https://github.com/filippolmt/global-chart
sources:
  - https://github.com/filippolmt/global-chart

# Chart maintainers
maintainers:
  - name: Filippo Merante Caparrotta
    url: https://github.com/filippolmt

# Search keywords
keywords:
  - deployment
  - statefulset
  - service
  - ingress
  - cronjob
  - hooks
  - kubernetes
  - multi-deployment
  - pdb
  - network-policy
  - hpa
  - autoscaling
  - keda
  - gateway-api
  - external-secrets

# Minimum Kubernetes version. The floor is what the templates render:
# autoscaling/v2 for the HPA (stable in 1.23), policy/v1 for the PDB (stable in
# 1.21), and a StatefulSet's persistentVolumeClaimRetentionPolicy, on by default
# from 1.27: below it the API server drops the field in silence, and with it the
# claims' Retain (ADR 0020). Raise it here when a template starts rendering a
# newer apiVersion or field.
kubeVersion: ">=1.27.0-0"
